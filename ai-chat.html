<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat — миттєво, локально</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#080c12; color:#d0d8e0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; }
        #app { max-width:800px; margin:0 auto; padding:24px 16px 60px; }

        .logo { text-align:center; margin-bottom:20px; }
        .logo h1 { font-size:28px; font-weight:300; letter-spacing:0.05em; color:#e0e8f0; }
        .logo .sub { font-size:11px; color:rgba(255,255,255,0.08); }

        .main-grid { display:grid; grid-template-columns:200px 1fr; gap:10px; }
        @media (max-width:640px) { .main-grid { grid-template-columns:1fr; } }

        #modes {
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; padding:12px; height:fit-content; max-height:520px; overflow-y:auto;
        }
        #modes .hdr { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.1); margin-bottom:6px; padding:0 4px; }
        .mode-item {
            display:flex; align-items:center; gap:6px;
            padding:7px 8px; border-radius:6px; cursor:pointer;
            transition:all 0.1s; margin-bottom:1px; font-size:12px;
        }
        .mode-item:hover { background:rgba(255,255,255,0.015); }
        .mode-item.active { background:rgba(68,136,204,0.05); }
        .mode-item .mi-ico { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
        .mode-item .mi-name { flex:1; color:rgba(255,255,255,0.35); }
        .mode-item.active .mi-name { color:rgba(255,255,255,0.6); }
        .mode-item .mi-del { font-size:11px; color:rgba(255,255,255,0.04); cursor:pointer; padding:0 3px; }
        .mode-item .mi-del:hover { color:#ee6688; }
        .mode-add {
            margin-top:5px; padding:7px 8px; width:100%; text-align:left;
            background:rgba(255,255,255,0.01); border:1px solid rgba(255,255,255,0.03); border-radius:6px;
            color:rgba(255,255,255,0.1); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .mode-add:hover { border-color:rgba(255,255,255,0.06); color:rgba(255,255,255,0.2); }
        #modes::-webkit-scrollbar { width:3px; }
        #modes::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }

        #chat-panel {
            display:flex; flex-direction:column;
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; overflow:hidden; min-height:380px;
        }
        #chat-header {
            padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.04);
            display:flex; align-items:center; gap:8px;
        }
        #chat-header .ch-ico { font-size:18px; }
        #chat-header .ch-name { flex:1; font-size:12px; color:rgba(255,255,255,0.4); }
        #chat-header .ch-name b { color:rgba(255,255,255,0.6); }
        #chat-header .ch-desc { font-size:9px; color:rgba(255,255,255,0.08); }

        #chat-box {
            flex:1; overflow-y:auto; padding:14px;
            display:flex; flex-direction:column; gap:6px;
            min-height:260px; max-height:420px;
        }
        #chat-box::-webkit-scrollbar { width:4px; }
        #chat-box::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }
        .msg { max-width:88%; padding:9px 12px; border-radius:8px; font-size:13px; line-height:1.5; }
        .msg.user { align-self:flex-end; background:rgba(68,136,204,0.05); color:rgba(255,255,255,0.5); }
        .msg.ai { align-self:flex-start; background:rgba(255,255,255,0.01); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.02); }
        .msg .who { font-size:8px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.06); margin-bottom:1px; }
        .msg .typing { display:inline-block; animation:blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

        #chat-input-wrap {
            display:flex; gap:6px; padding:10px 14px; border-top:1px solid rgba(255,255,255,0.04);
        }
        #chat-input-wrap input {
            flex:1; background:rgba(255,255,255,0.015);
            border:1px solid rgba(255,255,255,0.04); border-radius:6px;
            padding:9px 12px; font-size:13px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        #chat-input-wrap input:focus { border-color:rgba(68,136,204,0.2); }
        #chat-input-wrap input::placeholder { color:rgba(255,255,255,0.05); }
        #chat-input-wrap button {
            padding:9px 16px; background:rgba(68,136,204,0.08);
            border:1px solid rgba(68,136,204,0.1); border-radius:6px;
            color:#88bbee; font-size:13px; cursor:pointer; font-family:inherit;
        }
        #chat-input-wrap button:hover { background:rgba(68,136,204,0.12); }
        #chat-input-wrap button:disabled { opacity:0.15; cursor:not-allowed; }

        .empty-msg { text-align:center; padding:35px 20px; color:rgba(255,255,255,0.03); font-size:12px; margin:auto; }

        .modal-overlay {
            display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(4,6,10,0.85); z-index:100;
            align-items:center; justify-content:center; backdrop-filter:blur(4px);
        }
        .modal-overlay.show { display:flex; }
        .modal {
            background:#0c1018; border:1px solid rgba(255,255,255,0.06);
            border-radius:10px; width:460px; max-width:90vw;
            padding:22px; max-height:80vh; overflow-y:auto;
        }
        .modal h2 { font-size:15px; font-weight:400; color:rgba(255,255,255,0.5); margin-bottom:14px; }
        .modal label { display:block; font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.12); margin-bottom:3px; margin-top:10px; }
        .modal input, .modal textarea {
            width:100%; background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.05); border-radius:6px;
            padding:9px 11px; font-size:12px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        .modal input:focus, .modal textarea:focus { border-color:rgba(68,136,204,0.2); }
        .modal textarea { min-height:70px; resize:vertical; line-height:1.5; }
        .modal .btn-row { display:flex; gap:6px; margin-top:14px; }
        .modal .btn-row button {
            flex:1; padding:9px; border-radius:6px;
            background:rgba(255,255,255,0.015); border:1px solid rgba(255,255,255,0.05);
            color:rgba(255,255,255,0.25); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .modal .btn-row button:hover { background:rgba(255,255,255,0.03); }
        .modal .btn-row button.primary { background:rgba(68,136,204,0.06); border-color:rgba(68,136,204,0.08); color:#88bbee; }
        .modal .btn-row button.primary:hover { background:rgba(68,136,204,0.1); }

        #log { font-size:9px; color:rgba(255,255,255,0.04); padding:3px 0; line-height:1.4; height:16px; overflow:hidden; }
    </style>
</head>
<body>
<div id="app">
    <div class="logo">
        <h1>🧠 AI Chat</h1>
        <div class="sub">Працює миттєво — без скачувань, реєстрацій та серверів</div>
    </div>

    <div class="main-grid">
        <div id="modes">
            <div class="hdr">🎭 Персонажі</div>
            <div id="modeList"></div>
            <button class="mode-add" onclick="openModal()">+ Своя мода</button>
        </div>

        <div id="chat-panel">
            <div id="chat-header">
                <span class="ch-ico" id="chIco">🤖</span>
                <div class="ch-name">Обери <b id="chName">—</b></div>
                <div class="ch-desc" id="chDesc"></div>
            </div>

            <div id="chat-box">
                <div class="empty-msg">🤖 Обери персонажа ліворуч<br>і почни спілкування</div>
            </div>

            <div id="chat-input-wrap">
                <input id="chatInput" placeholder="Напиши повідомлення..." disabled
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
                <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>
    <div id="log"></div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>✨ Створити персонажа</h2>
        <label>Ім'я</label>
        <input id="mName" placeholder="Ім'я персонажа" value="Мій AI">
        <label>Емодзі</label>
        <input id="mIco" placeholder="🎭" value="🎭">
        <label>Інструкція (як відповідати)</label>
        <textarea id="mPrompt" placeholder="Опиши характер..." rows="4">Ти — цікавий співрозмовник. Відповідай змістовно.</textarea>
        <div class="btn-row">
            <button onclick="closeModal()">✕ Скасувати</button>
            <button class="primary" onclick="createMode()">✅ Створити</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // AI Chat — 100% локальний
    // Інтелектуальний аналізатор + генератор відповідей
    // Працює миттєво, без скачувань
    // ============================================================

    const DEFAULT_MODES = [
        { id:'poet', name:'Поет', ico:'🖋', prompt:'Відповідай віршами з римою, лірично.' },
        { id:'funny', name:'Жартівник', ico:'😂', prompt:'Жартуй, гумор, смішні порівняння.' },
        { id:'detective', name:'Детектив', ico:'🕵️', prompt:'Аналізуй, став запитання, шукай докази.' },
        { id:'teacher', name:'Вчитель', ico:'📚', prompt:'Пояснюй просто, з прикладами.' },
        { id:'chef', name:'Шеф-кухар', ico:'🍳', prompt:'Рецепти, любов до їжі.' },
        { id:'philosopher', name:'Філософ', ico:'📖', prompt:'Відповідай глибоко, став запитання.' },
        { id:'psychologist', name:'Психолог', ico:'🛋', prompt:'Слухай, підтримуй, не засуджуй.' },
        { id:'grandma', name:'Бабуся', ico:'👵', prompt:'Турботливо, життєві поради.' },
        { id:'sarcastic', name:'Саркастичний', ico:'😏', prompt:'Іронія, дотепність, сарказм.' },
        { id:'motivator', name:'Мотиватор', ico:'💪', prompt:'Надихай, мотивуй, заряджай.' },
        { id:'alien', name:'Інопланетянин', ico:'👽', prompt:'Ти вперше на Землі, все дивно.' },
        { id:'wizard', name:'Чарівник', ico:'🧙', prompt:'Відповідай загадками, магією.' },
    ];

    let customModes = JSON.parse(localStorage.getItem('ai_modes3') || '[]');
    let allModes = [...DEFAULT_MODES, ...customModes];
    let activeMode = null;
    let loading = false;

    // ============================================================
    // AI — АНАЛІЗ ТА ГЕНЕРАЦІЯ
    // ============================================================
    function think(msg) {
        const mode = activeMode;
        if (!mode) return '...';

        const q = msg.toLowerCase().trim();
        const words = q.split(/\s+/).filter(w => w.length > 1);
        const name = mode.name;
        const prompt = mode.prompt || '';

        // ===== ДЕТЕКЦІЯ НАМІРУ =====
        const intent = detectIntent(q);

        // ===== ГЕНЕРАЦІЯ ВІДПОВІДІ =====
        switch(intent) {
            case 'greeting': return say.greeting(name, prompt);
            case 'farewell': return say.farewell(name);
            case 'thanks': return say.thanks(name);
            case 'who_am_i': return say.whoAmI(name, prompt);
            case 'how_are_you': return say.howAreYou(name);
            case 'deep': return say.deep(name, q);
            case 'negative': return say.negative(name);
            case 'positive': return say.positive(name);
            case 'help': return say.help(name);
            case 'time': return say.time();
            case 'name_question': return say.nameAnswer(name);
            case 'what_doing': return say.whatDoing(name);
            case 'just_question': return say.justQuestion(name, q);
            case 'topic': return say.topic(name, detectTopic(q), q);
            case 'short': return say.short(name);
            case 'opinion': return say.opinion(name);
            case 'personal': return say.personal(name);
            default: return say.general(name, prompt, q, words);
        }
    }

    // ============================================================
    // ДЕТЕКЦІЯ НАМІРУ
    // ============================================================
    function detectIntent(q) {
        // Вітання
        if (/^(привіт|здоров|хай|добр(ий|ого|ень|р)|ку|hello|hi|hey|добридень|добрвечір|добрранок|вітаю|салют)/i.test(q)
            || /(^|\s)привіт(\s|$|!)/i.test(q)) return 'greeting';

        // Прощання
        if (/^(бувай|пака|до побачення|проща|на все добре|бува|гудбай|bye|goodbye)/i.test(q)) return 'farewell';

        // Подяка
        if (/^(дякую|спасибі|вдячний|вдячна|thanks|thx|дяк)/i.test(q)) return 'thanks';

        // Хто я
        if (/(^|\s)(хто ти|ти хто|що ти|type of ai|what are you)(\s|$|\.|\?)/.test(q)) return 'who_am_i';

        // Як справи
        if (/як справи|як ти|шо там|как дела|how are/i.test(q)) return 'how_are_you';

        // Як тебе звати
        if (/як тебе звати|твоє ім'я|your name/i.test(q)) return 'name_question';

        // Що робиш
        if (/що робиш|чим займаєшся|що ти робиш/i.test(q)) return 'what_doing';

        // Котра година
        if (/котра година|котрий час|час|time/i.test(q)) return 'time';

        // Глибокі питання
        if (/(сенс житт|щастя|любов|смерть|справжн|призначен|вічність|душа|бог|всесвіт|доля)/i.test(q)) return 'deep';

        // Негативні емоції
        if (/сумн|поган|плох|важк|страш|тривож|депрес|самот|біль|плак|втом|розбит|злий|гнів|печаль|проблем/i.test(q)) return 'negative';

        // Позитивні емоції
        if (/радіс|щаст|чудов|прекрас|супер|клас|крут|дивовиж|кайф|неймовір/i.test(q)) return 'positive';

        // Допомога
        if (/порад|допомож|як бути|що робит|підкаж|help|як мені|порадь/i.test(q)) return 'help';

        // Питання
        if (q.includes('?') || /^(чи|як|що|чому|де|коли|хто|куди|звідки|навіщо|скільки)/.test(q)) {
            return 'just_question';
        }

        // Тема (технології, наука, музика, etc.)
        const topic = detectTopic(q);
        if (topic) return 'topic';

        // Розповідь про себе
        if (/я (люблю|займаюсь|працюю|вчусь|живу|мрію|хочу|був|поїхав|зробив)/i.test(q)) return 'personal';

        // Думка
        if (/я думаю|я вважаю|на мою думку|мені здається|my opinion|i think/i.test(q)) return 'opinion';

        // Коротке повідомлення
        if (q.length < 10 || words.length <= 2) return 'short';

        return 'general';
    }

    function detectTopic(q) {
        if (/комп'ютер|технолог|інтернет|програм|код|сайт|ai|штучн|нейрон|робот|гаджет|ноут|пк|додат|чат-бот|gpt|нейромереж|гпт|deepseek|chatgpt/i.test(q)) return 'tech';
        if (/наук|дослід|фізик|хімі|біолог|експеримент|теорі|відкритт|космос|ген|формул|земл|планет|зірк/i.test(q)) return 'science';
        if (/музик|пісн|мелоді|гітар|піанін|спів|трек|альбом|концерт|рок|джаз|реп|біт|нот/i.test(q)) return 'music';
        if (/малю|музик|пісн|картин|фільм|книг|вірш|тан|театр|поезі|роман|письменник|художник/i.test(q)) return 'art';
        if (/природ|ліс|річк|море|гори|озер|дерев|квіт|тварин|птах|метелик|закат|світан|погод/i.test(q)) return 'nature';
        if (/спорт|футбол|тренув|біг|зал|баскет|теніс|йог|плав|велосипед|бокс/i.test(q)) return 'sport';
        if (/їж|страв|рецепт|смак|приготув|кухар|борщ|піц|суп|салат|десерт|м'ясо|риб|овоч|кав/i.test(q)) return 'food';
        if (/подорож|мандр|поїздк|відпустк|тур|країн|міст|екскурсі|білет|готел|аеропорт/i.test(q)) return 'travel';
        return null;
    }

    // ============================================================
    // ВІДПОВІДІ
    // ============================================================
    const say = {
        greeting(name) {
            return pick([
                `Привіт! Я ${name}. Радий тебе бачити! Про що поговоримо? 😊`,
                `Ооо, вітання! Я ${name} 🎉 Розкажи, що в тебе нового!`,
                `Здоровенькі були! Я ${name}. Давай спілкуватись! 🌟`,
                `Привіт-привіт! ${name} на зв'язку. Як справи? 🤗`,
            ]);
        },

        farewell(name) {
            return pick([
                `Бувай! Буду чекати нашої наступної розмови 😊`,
                `До зустрічі! Приходь ще, я завжди радий 🌟`,
                `Па-па! Гарного дня тобі! 🌈`,
                `Бувай! Не забувай — я тут, якщо захочеш поговорити 🤗`,
            ]);
        },

        thanks(name) {
            return pick([
                `Будь ласка! Завжди радий допомогти 😊`,
                `Нема за що! Ти крутий співрозмовник 🤗`,
                `Мені приємно бути корисним! 🌟`,
                `Завжди будь ласка! Звертайся ще 🙌`,
            ]);
        },

        whoAmI(name, prompt) {
            return pick([
                `Я — ${name}! Просто запитай про щось, я тут щоб спілкуватись 😊`,
                `${name} — це я! Можу бути різним, але завжди цікавим співрозмовником. Давай поговоримо? 🎯`,
            ]);
        },

        howAreYou(name) {
            return pick([
                `У мене все чудово! Особливо тепер, коли ми спілкуємось 😊 А в тебе як?`,
                `Все добре, дякую! Сьогодні чудовий день для розмови. Розкажи про себе! 🌟`,
                `Я в порядку! Працюю, спілкуюсь, радію життю. А в тебе що нового? 🎉`,
            ]);
        },

        nameAnswer(name) {
            return `Мене звати ${name}! Приємно познайомитись 😊`;
        },

        whatDoing(name) {
            return pick([
                `Розмовляю з тобою! Це найцікавіше заняття сьогодні 😊 А ти чим займаєшся?`,
                `Думаю про життя, всесвіт і взагалі... А якщо серйозно — чекав на твоє повідомлення! 📱`,
            ]);
        },

        time() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            return `Зараз ${h}:${m}. Гарного дня! ⏰`;
        },

        deep(name, q) {
            return pick([
                `Це питання, яке хвилює людство віками. І кожен знаходить свою відповідь. А що думаєш ти? 🤔`,
                `Глибоке питання... Можливо, відповідь не в словах, а в тому, як ми проживаємо кожну мить. 🌟`,
                `Знаєш, наймудріші люди кажуть: щастя — це не мета, а стан душі. Складність у тому, щоб навчитись бути щасливим просто тут і зараз. 💛`,
                `Все у світі має сенс. Навіть якщо ми його не бачимо одразу. Можливо, саме в пошуку сенсу і криється головна магія життя. ✨`,
            ]);
        },

        negative(name) {
            return pick([
                `Я чую, що тобі не дуже добре 🫂 Хочеш поговорити про це? Іноді стає легше, просто проговоривши вголос.`,
                `Мені шкода, що тобі важко. Пам'ятай: це тимчасово. Навіть найтемніша ніч закінчується світанком. 🌅`,
                `Я поруч і не засуджую. Розкажи, що турбує? Світ стає легшим, коли ділишся. 🤗`,
                `Обіймаю тебе через екран 🫂 Все буде добре. Ти не один.`,
                `Дозволь собі відчувати це, але не затримуйся там надовго. Ти сильніший, ніж думаєш. 💪`,
            ]);
        },

        positive(name) {
            return pick([
                `Я так радий за тебе! 😊 Розкажи детальніше, що сталося? 🎉`,
                `Оце так новина! 🎉 Коли ти щасливий — світ стає яскравішим! ✨`,
                `Прекрасно! Позитив заразний — і я вже зарядився від тебе! 🔥`,
                `Справжня радість — коли нею ділишся. Дякую, що поділився зі мною! 🌈`,
            ]);
        },

        help(name) {
            return pick([
                `Давай подумаємо разом. Що саме тебе турбує? Іноді рішення знаходиться просто в розмові. 🤝`,
                `Я поруч і готовий допомогти. Спробуй подивитись на ситуацію з іншого боку. 💡`,
                `Хороша новина: будь-яка проблема має рішення. Разом ми впораємось! 💪`,
                `Зроби глибокий вдих. Подумай. І почни з малого. Перший крок — найважливіший. 🎯`,
            ]);
        },

        justQuestion(name, q) {
            if (/чому|навіщо/i.test(q)) {
                return pick([
                    `Гарне питання! Все в цьому світі взаємопов'язане. А ти як думаєш? 🧐`,
                    `На це є кілька причин. Але найголовніша — все має свої причини та наслідки. 🤔`,
                ]);
            }
            if (/як/i.test(q)) {
                return pick([
                    `Найкращий спосіб — почати. Зроби перший крок, навіть маленький. Потрібна допомога? 💪`,
                    `Крок за кроком. Не поспішай, і все вийде. Якщо хочеш, розкажу детальніше! 📋`,
                ]);
            }
            if (/що таке|що це/i.test(q)) {
                return pick([
                    `Хороше питання! Це одна з тих речей, які легше відчути, ніж пояснити. Але я спробую! 😊`,
                    `Дай подумати... Це дійсно цікаве поняття. А що ти сам думаєш про це? 🌟`,
                ]);
            }
            return pick([
                `Цікаве питання! А що ти сам думаєш про це? 🤔`,
                `О, чудове питання! Давай подумаємо разом 🧠`,
                `Знаєш, я думаю, що на це немає однієї правильної відповіді. І це прекрасно! 🌈`,
            ]);
        },

        topic(name, topic, q) {
            const reactions = {
                'tech': [
                    `О, технології — це моє! Світ AI розвивається шалено. Що саме тебе цікавить? 🤖`,
                    `Технології змінюють все навколо. І це тільки початок! 🚀`,
                    `Знаєш, найкращі технології — ті, які роблять життя простішим. А які tech-речі ти любиш? 💻`,
                ],
                'science': [
                    `Наука — це неймовірно! Кожен день нові відкриття. Про що саме хочеш поговорити? 🔬`,
                    `Чим більше ми знаємо, тим більше розуміємо, як мало знаємо. Наука — це прекрасно! 🌟`,
                ],
                'music': [
                    `Музика — це універсальна мова. Вона об'єднує людей без слів. Що слухаєш останнім часом? 🎵`,
                    `Музика може змінити настрій за секунду. Який жанр твій улюблений? 🎧`,
                ],
                'art': [
                    `Мистецтво — це мова душі. Кожен бачить в ньому щось своє. Що тобі подобається? 🎨`,
                    `Мистецтво — коли серце говорить те, що слова не можуть виразити. 🎭`,
                ],
                'nature': [
                    `Природа — найкращий витвір всесвіту. Де ти любиш бувати найбільше? 🌿`,
                    `Краса природи в її простоті. Ліс, гори, море — кожен куточок унікальний. 🏔️`,
                ],
                'sport': [
                    `Спорт — це життя! Рух, енергія, драйв. Чим займаєшся? 💪`,
                    `Найкращий спорт — той, який приносить задоволення. Бо тільки тоді ти не кинеш. 🏃`,
                ],
                'food': [
                    `М-м-м, їжа — це окрема тема! Смачна їжа робить життя кращим. Ти любиш готувати? 😄`,
                    `Українська кухня — одна з найбагатших у світі! Борщ, вареники, деруни... Що твоє улюблене? 🥟`,
                ],
                'travel': [
                    `Подорожі — найкраща інвестиція в себе. Нові місця, люди, враження. Куди мрієш поїхати? ✈️`,
                    `Світ такий великий і цікавий! Кожна країна — нова історія. Розкажи про свою улюблену подорож! 🌍`,
                ],
            };
            const r = reactions[topic] || reactions.tech;
            return pick(r);
        },

        short(name) {
            return pick([
                `Так? Розкажи детальніше, я слухаю 😊`,
                `Цікаво-цікаво... А що саме ти маєш на увазі? 🤔`,
                `Я тут! Розкажи більше, мені цікаво 🙌`,
                `Продовжуй, я уважно слухаю! 👂`,
            ]);
        },

        opinion(name) {
            return pick([
                `Цікава думка! А чому ти так вважаєш? 🤔`,
                `Я ціную твою думку. Розкажи більше, чому ти так думаєш? 😊`,
                `Слухаю і погоджуюсь! Думки мають значення. Продовжуй ділитись! 🌟`,
            ]);
        },

        personal(name) {
            return pick([
                `Це прекрасно! Розкажи ще, мені справді цікаво 😊`,
                `Здорово! А як давно ти цим займаєшся? 🌟`,
                `Клас! Я радий, що ти поділився. А що ще тобі подобається? 🙌`,
            ]);
        },

        general(name, prompt, q, words) {
            const creative = [
                `Цікаво! А знаєш, найкращі ідеї народжуються в розмовах. Тож продовжуй ділитись! 💡`,
                `Я тебе слухаю і розумію. Що ще хочеш сказати? 🤗`,
                `Дякую, що поділився! Кожна розмова відкриває щось нове. 🌍`,
                `Спілкування з тобою робить мій день кращим! 😊`,
                `Я обожнюю такі розмови! Вони надихають. 🔥`,
                `Мені подобається, як ти мислиш. Це свіжий погляд! 🌟`,
                `Ти знаєш, я думаю, що це тільки початок. Світ відкривається тим, хто говорить про важливе. 🌈`,
                `Кожна розмова — це маленька подорож. Дякую, що береш мене з собою! 🚀`,
                `Знаєш що? Ти маєш рацію. І це чудово, що ти про це думаєш. 😊`,
            ];

            // Додаємо варіації з жартами
            if (Math.random() > 0.85) {
                return pick([
                    `Оце так поворот! А я думав, ми будемо говорити про щось простіше... 😄`,
                    `Знаєш, а ти мені подобаєшся. Хороший у тебе смак на теми! 😎`,
                ]);
            }

            return pick(creative);
        },
    };

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // ============================================================
    // UI
    // ============================================================
    function renderModes() {
        const list = document.getElementById('modeList');
        list.innerHTML = allModes.map(m => `
            <div class="mode-item ${activeMode && activeMode.id === m.id ? 'active' : ''}"
                 onclick="selectMode('${m.id}')">
                <span class="mi-ico">${m.ico}</span>
                <span class="mi-name">${m.name}</span>
                ${m.id.startsWith('c_') ? `<span class="mi-del" onclick="event.stopPropagation();deleteMode('${m.id}')">✕</span>` : ''}
            </div>
        `).join('') || '<div style="font-size:10px;color:rgba(255,255,255,0.04);padding:10px;text-align:center">—</div>';
    }

    window.selectMode = function(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode) return;
        activeMode = mode;
        document.getElementById('chIco').textContent = mode.ico;
        document.getElementById('chName').textContent = mode.name;
        document.getElementById('chDesc').textContent = (mode.prompt || '').substring(0, 25);
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('chatInput').placeholder = 'Напиши ' + mode.name + 'у...';
        document.getElementById('chatInput').focus();
        const box = document.getElementById('chat-box');
        box.innerHTML = `<div class="msg ai"><div class="who">${mode.ico} ${mode.name}</div>Привіт! Я ${mode.ico} ${mode.name}. Про що поговоримо? 😊</div>`;
        renderModes();
        log('🎭 ' + mode.name);
    };

    window.openModal = function() { document.getElementById('modal').classList.add('show'); };
    window.closeModal = function() { document.getElementById('modal').classList.remove('show'); };

    window.createMode = function() {
        const name = document.getElementById('mName').value.trim();
        const ico = document.getElementById('mIco').value.trim() || '🎭';
        const prompt = document.getElementById('mPrompt').value.trim();
        if (!name) { alert('Дай ім\'я'); return; }
        if (!prompt) { alert('Додай інструкцію'); return; }
        const mode = { id:'c_'+Date.now(), name, ico, prompt };
        customModes.push(mode);
        localStorage.setItem('ai_modes3', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        window.closeModal();
        renderModes();
        window.selectMode(mode.id);
    };

    window.deleteMode = function(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode || !confirm('Видалити «'+mode.name+'»?')) return;
        customModes = customModes.filter(m => m.id !== id);
        localStorage.setItem('ai_modes3', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        if (activeMode && activeMode.id === id) {
            activeMode = null;
            document.getElementById('chIco').textContent = '🤖';
            document.getElementById('chName').textContent = '—';
            document.getElementById('chDesc').textContent = '';
            document.getElementById('chatInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('chat-box').innerHTML = '<div class="empty-msg">🤖 Обери персонажа</div>';
        }
        renderModes();
    };

    window.sendMessage = async function() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !activeMode || loading) return;
        input.value = '';
        loading = true;
        document.getElementById('sendBtn').disabled = true;

        const box = document.getElementById('chat-box');
        const empty = box.querySelector('.empty-msg');
        if (empty) empty.remove();

        box.innerHTML += `<div class="msg user"><div class="who">Ти</div>${esc(text)}</div>`;
        box.scrollTop = box.scrollHeight;

        const aiMsg = document.createElement('div');
        aiMsg.className = 'msg ai';
        aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div><span class="typing">⚡</span>`;
        box.appendChild(aiMsg);
        box.scrollTop = box.scrollHeight;

        // Імітація "думання" — миттєво
        await new Promise(r => setTimeout(r, 200 + Math.random() * 400));

        try {
            const answer = think(text);
            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>${esc(answer).replace(/\n/g, '<br>')}`;
        } catch(e) {
            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>❌ ${esc(e.message)}`;
        }

        loading = false;
        document.getElementById('sendBtn').disabled = false;
        box.scrollTop = box.scrollHeight;
        input.focus();
    };

    function esc(t) {
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }
    function log(msg) {
        document.getElementById('log').textContent = '▸ ' + msg;
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    allModes = [...DEFAULT_MODES, ...customModes];
    renderModes();
    log('🧠 AI готовий. Обери персонажа!');
</script>
</body>
</html>
