<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real AI — нейромережа в браузері</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#080c12; color:#d0d8e0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; }
        #app { max-width:800px; margin:0 auto; padding:24px 16px 60px; }

        .logo { text-align:center; margin-bottom:20px; }
        .logo h1 { font-size:28px; font-weight:300; letter-spacing:0.05em; color:#e0e8f0; }
        .logo .sub { font-size:11px; color:rgba(255,255,255,0.08); margin-top:2px; }

        #model-status {
            text-align:center; margin:10px 0;
            padding:8px 16px; border-radius:8px;
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.03);
            display:none; font-size:11px; line-height:1.6;
        }
        #model-status.show { display:block; }
        #model-status .bar-wrap { background:rgba(255,255,255,0.03); border-radius:4px; height:4px; margin:5px 0; overflow:hidden; }
        #model-status .bar { height:100%; background:#44aaff; border-radius:4px; width:0%; transition:width 0.3s; }
        #model-status .label { color:rgba(255,255,255,0.25); }
        #model-status .label b { color:rgba(255,255,255,0.45); }
        #model-status .ready { color:#44cc88; }
        #model-status .error { color:#ee6688; }

        .main-grid { display:grid; grid-template-columns:200px 1fr; gap:10px; }
        @media (max-width:640px) { .main-grid { grid-template-columns:1fr; } }

        #modes {
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; padding:12px; height:fit-content; max-height:520px; overflow-y:auto;
        }
        #modes .hdr { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.1); margin-bottom:6px; padding:0 4px; }
        .mode-item {
            display:flex; align-items:center; gap:6px;
            padding:7px 8px; border-radius:6px; cursor:pointer;
            transition:all 0.1s; margin-bottom:1px; font-size:12px;
        }
        .mode-item:hover { background:rgba(255,255,255,0.015); }
        .mode-item.active { background:rgba(68,136,204,0.05); }
        .mode-item .mi-ico { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
        .mode-item .mi-name { flex:1; color:rgba(255,255,255,0.35); }
        .mode-item.active .mi-name { color:rgba(255,255,255,0.6); }
        .mode-item .mi-del { font-size:11px; color:rgba(255,255,255,0.04); cursor:pointer; padding:0 3px; }
        .mode-item .mi-del:hover { color:#ee6688; }
        .mode-add {
            margin-top:5px; padding:7px 8px; width:100%; text-align:left;
            background:rgba(255,255,255,0.01); border:1px solid rgba(255,255,255,0.03); border-radius:6px;
            color:rgba(255,255,255,0.1); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .mode-add:hover { border-color:rgba(255,255,255,0.06); color:rgba(255,255,255,0.2); }
        #modes::-webkit-scrollbar { width:3px; }
        #modes::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }

        #chat-panel {
            display:flex; flex-direction:column;
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; overflow:hidden; min-height:380px;
        }
        #chat-header {
            padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.04);
            display:flex; align-items:center; gap:8px;
        }
        #chat-header .ch-ico { font-size:18px; }
        #chat-header .ch-name { flex:1; font-size:12px; color:rgba(255,255,255,0.4); }
        #chat-header .ch-name b { color:rgba(255,255,255,0.6); }
        #chat-header .ch-desc { font-size:9px; color:rgba(255,255,255,0.08); }
        .ai-badge {
            font-size:8px; padding:2px 6px; border-radius:3px;
            background:rgba(68,136,204,0.04); color:rgba(68,136,204,0.25);
            flex-shrink:0;
        }
        .ai-badge.active { background:rgba(68,204,136,0.06); color:rgba(68,204,136,0.3); }

        #chat-box {
            flex:1; overflow-y:auto; padding:14px;
            display:flex; flex-direction:column; gap:6px;
            min-height:260px; max-height:420px;
        }
        #chat-box::-webkit-scrollbar { width:4px; }
        #chat-box::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }
        .msg { max-width:88%; padding:9px 12px; border-radius:8px; font-size:13px; line-height:1.5; }
        .msg.user { align-self:flex-end; background:rgba(68,136,204,0.05); color:rgba(255,255,255,0.5); }
        .msg.ai { align-self:flex-start; background:rgba(255,255,255,0.01); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.02); }
        .msg .who { font-size:8px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.06); margin-bottom:1px; }
        .msg .typing { display:inline-block; animation:blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

        #chat-input-wrap {
            display:flex; gap:6px; padding:10px 14px; border-top:1px solid rgba(255,255,255,0.04);
        }
        #chat-input-wrap input {
            flex:1; background:rgba(255,255,255,0.015);
            border:1px solid rgba(255,255,255,0.04); border-radius:6px;
            padding:9px 12px; font-size:13px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        #chat-input-wrap input:focus { border-color:rgba(68,136,204,0.2); }
        #chat-input-wrap input::placeholder { color:rgba(255,255,255,0.05); }
        #chat-input-wrap button {
            padding:9px 16px; background:rgba(68,136,204,0.08);
            border:1px solid rgba(68,136,204,0.1); border-radius:6px;
            color:#88bbee; font-size:13px; cursor:pointer; font-family:inherit;
        }
        #chat-input-wrap button:hover { background:rgba(68,136,204,0.12); }
        #chat-input-wrap button:disabled { opacity:0.15; cursor:not-allowed; }

        .empty-msg { text-align:center; padding:35px 20px; color:rgba(255,255,255,0.03); font-size:12px; margin:auto; }

        .modal-overlay {
            display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(4,6,10,0.85); z-index:100;
            align-items:center; justify-content:center; backdrop-filter:blur(4px);
        }
        .modal-overlay.show { display:flex; }
        .modal {
            background:#0c1018; border:1px solid rgba(255,255,255,0.06);
            border-radius:10px; width:460px; max-width:90vw;
            padding:22px; max-height:80vh; overflow-y:auto;
        }
        .modal h2 { font-size:15px; font-weight:400; color:rgba(255,255,255,0.5); margin-bottom:14px; }
        .modal label { display:block; font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.12); margin-bottom:3px; margin-top:10px; }
        .modal input, .modal textarea {
            width:100%; background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.05); border-radius:6px;
            padding:9px 11px; font-size:12px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        .modal input:focus, .modal textarea:focus { border-color:rgba(68,136,204,0.2); }
        .modal textarea { min-height:70px; resize:vertical; line-height:1.5; }
        .modal .btn-row { display:flex; gap:6px; margin-top:14px; }
        .modal .btn-row button {
            flex:1; padding:9px; border-radius:6px;
            background:rgba(255,255,255,0.015); border:1px solid rgba(255,255,255,0.05);
            color:rgba(255,255,255,0.25); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .modal .btn-row button:hover { background:rgba(255,255,255,0.03); }
        .modal .btn-row button.primary { background:rgba(68,136,204,0.06); border-color:rgba(68,136,204,0.08); color:#88bbee; }
        .modal .btn-row button.primary:hover { background:rgba(68,136,204,0.1); }

        #log { font-size:9px; color:rgba(255,255,255,0.04); padding:3px 0; line-height:1.4; height:16px; overflow:hidden; }
    </style>
</head>
<body>
<div id="app">
    <div class="logo">
        <h1>🧠 Real AI Chat</h1>
        <div class="sub">Справжня нейромережа у твоєму браузері</div>
    </div>

    <div id="model-status">
        <div class="label"><span id="msLabel">🔽 Завантаження нейромережі...</span></div>
        <div class="bar-wrap"><div class="bar" id="msBar"></div></div>
    </div>

    <div class="main-grid">
        <div id="modes">
            <div class="hdr">🎭 Персонажі</div>
            <div id="modeList"></div>
            <button class="mode-add" onclick="openModal()">+ Своя мода</button>
        </div>

        <div id="chat-panel">
            <div id="chat-header">
                <span class="ch-ico" id="chIco">🤖</span>
                <div class="ch-name">Обери <b id="chName">—</b></div>
                <div class="ch-desc" id="chDesc"></div>
                <span class="ai-badge" id="aiBadge">⚙️ локально</span>
            </div>

            <div id="chat-box">
                <div class="empty-msg">🤖 Обери персонажа ліворуч<br>і почни спілкування</div>
            </div>

            <div id="chat-input-wrap">
                <input id="chatInput" placeholder="Напиши повідомлення..." disabled
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
                <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>
    <div id="log"></div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>✨ Створити персонажа</h2>
        <label>Ім'я</label>
        <input id="mName" placeholder="Ім'я персонажа" value="Мій AI">
        <label>Емодзі</label>
        <input id="mIco" placeholder="🎭" value="🎭">
        <label>Інструкція (як відповідати)</label>
        <textarea id="mPrompt" placeholder="Опиши характер..." rows="4">Ти — цікавий співрозмовник. Відповідай змістовно.</textarea>
        <div class="btn-row">
            <button onclick="closeModal()">✕ Скасувати</button>
            <button class="primary" onclick="createMode()">✅ Створити</button>
        </div>
    </div>
</div>

<script type="module">
    // ============================================================
    // Real AI Chat — нейромережа в браузері
    // Використовує Transformers.js з Xenova/SmolLM2-135M
    // Працює повністю локально, безкоштовно, без серверів
    // ============================================================

    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js';

    // Налаштування
    env.localModelPath = '';
    env.allowRemoteModels = true;
    env.cacheEnabled = true;

    // ============================================================
    // СТАН
    // ============================================================
    const DEFAULT_MODES = [
        { id:'poet', name:'Поет', ico:'🖋', prompt:'Ти — український поет. Відповідай віршами з римою, лірично.' },
        { id:'funny', name:'Жартівник', ico:'😂', prompt:'Ти — веселий співрозмовник. Жартуй, використовуй гумор.' },
        { id:'detective', name:'Детектив', ico:'🕵️', prompt:'Ти — детектив. Аналізуй, став запитання, шукай докази.' },
        { id:'teacher', name:'Вчитель', ico:'📚', prompt:'Ти — вчитель. Пояснюй складнощі просто, з прикладами.' },
        { id:'chef', name:'Шеф-кухар', ico:'🍳', prompt:'Ти — шеф-кухар. Давай рецепти, говори з любов\'ю до їжі.' },
        { id:'philosopher', name:'Філософ', ico:'📖', prompt:'Ти — філософ. Відповідай глибоко, став запитання у відповідь.' },
        { id:'psychologist', name:'Психолог', ico:'🛋', prompt:'Ти — психолог. Слухай, не засуджуй, підтримуй.' },
        { id:'grandma', name:'Бабуся', ico:'👵', prompt:'Ти — бабуся. Турботлива, добра. Життєві поради.' },
        { id:'sarcastic', name:'Саркастичний', ico:'😏', prompt:'Ти — саркастичний. Іронія, дотепність, але без злості.' },
        { id:'motivator', name:'Мотиватор', ico:'💪', prompt:'Ти — мотиватор. Надихай, заряджай енергією.' },
        { id:'alien', name:'Інопланетянин', ico:'👽', prompt:'Ти — інопланетянин на Землі. Все дивно.' },
        { id:'wizard', name:'Чарівник', ico:'🧙', prompt:'Ти — мудрий чарівник. Відповідай загадками.' },
    ];

    let customModes = JSON.parse(localStorage.getItem('realm_chat_modes') || '[]');
    let allModes = [...DEFAULT_MODES, ...customModes];
    let activeMode = null;
    let loading = false;
    let model = null;
    let modelLoading = false;
    const history = [];

    // ============================================================
    // ЗАВАНТАЖЕННЯ МОДЕЛІ
    // ============================================================
    const MODEL_ID = 'Xenova/LaMini-GPT-774M';  // ~774M params, ~1.5GB, оптимізована для чату
    // Альтернативи: 'Xenova/SmolLM2-135M' (легша, ~270MB)
    //               'Xenova/Qwen2-0.5B-Instruct' (краща для інструкцій, ~1GB)

    async function loadModel() {
        if (model) return;
        if (modelLoading) return;
        modelLoading = true;

        const statusEl = document.getElementById('model-status');
        const labelEl = document.getElementById('msLabel');
        const barEl = document.getElementById('msBar');

        statusEl.classList.add('show');
        labelEl.textContent = '🔽 Завантаження нейромережі LaMini-GPT (774M)...';

        try {
            // Показуємо прогрес
            barEl.style.width = '5%';

            model = await pipeline('text-generation', MODEL_ID, {
                progress_callback: (progress) => {
                    if (progress.status === 'download') {
                        const pct = Math.round((progress.loaded / progress.total) * 100);
                        barEl.style.width = Math.min(pct, 95) + '%';
                        labelEl.textContent = `🔽 Завантаження... ${progress.file || ''} ${pct}% (${formatSize(progress.loaded)}/${formatSize(progress.total)})`;
                    } else if (progress.status === 'progress') {
                        // Підготовка моделі
                        barEl.style.width = '95%';
                        labelEl.textContent = '⚙️ Ініціалізація нейромережі...';
                    }
                },
            });

            barEl.style.width = '100%';
            labelEl.innerHTML = '<span class="ready">✅ Нейромережа завантажена! Працює локально 🧠</span>';
            document.getElementById('aiBadge').className = 'ai-badge active';
            document.getElementById('aiBadge').textContent = '🧠 нейромережа';

            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 3000);

            log('🧠 Нейромережа готова!');

        } catch(e) {
            labelEl.innerHTML = `<span class="error">❌ Помилка: ${e.message}</span>`;
            log('❌ Модель не завантажена: ' + e.message);
            barEl.style.width = '0%';
        }

        modelLoading = false;
    }

    function formatSize(bytes) {
        if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + 'KB';
        return (bytes/(1024*1024)).toFixed(1) + 'MB';
    }

    // ============================================================
    // ГЕНЕРАЦІЯ ВІДПОВІДІ (НЕЙРОМЕРЕЖА)
    // ============================================================
    async function generateWithModel(msg) {
        if (!model) {
            // Якщо модель ще не завантажена — пробуємо завантажити
            if (!modelLoading) loadModel();
            throw new Error('Модель ще завантажується');
        }

        const mode = activeMode;
        if (!mode) throw new Error('No mode');

        const systemPrompt = `Ти — ${mode.name}. ${mode.prompt} Відповідай природно, без зайвих пояснень. Пиши українською. Не використовуй "AI:" або "Assistant:".`;

        // Формуємо промпт для LaMini-GPT
        const prompt = `Below is an instruction that describes a task. Write a response that appropriately completes the request.

### Instruction:
${systemPrompt}

${msg}

### Response:
`;

        const result = await model(prompt, {
            max_new_tokens: 150,
            temperature: 0.85,
            top_p: 0.9,
            do_sample: true,
            repetition_penalty: 1.1,
        });

        let text = result[0]?.generated_text || '';

        // Видаляємо промпт з результату
        if (text.startsWith(prompt)) {
            text = text.slice(prompt.length);
        }

        // Чистимо від зайвого
        text = text.replace(/<\|user\|>.*$/s, '')
                   .replace(/<\|assistant\|>/g, '')
                   .replace(/<\|system\|>.*$s/, '')
                   .trim();

        if (!text) throw new Error('Порожня відповідь');
        return text;
    }

    // ============================================================
    // ЛОКАЛЬНИЙ РЕЗЕРВНИЙ AI
    // ============================================================
    function generateLocalResponse(msg) {
        if (!activeMode) return '...';
        const q = msg.toLowerCase().trim();
        const name = activeMode.name;
        const prompt = (activeMode.prompt || '').toLowerCase();

        const isGreeting = /^(привіт|здоров|хай|добр|ку|hello|hi|hey)/i.test(q) || /вітаю/.test(q);
        if (isGreeting) return pick([
            `Привіт! Я ${name}. Радий тебе бачити! 😊`,
            `Ооо, вітання! Я ${name} 🎉 Про що поговоримо?`,
        ]);

        const isQuestion = q.includes('?') || /^(чи|як|що|чому|де|коли|хто)/.test(q);
        const isThanks = /^(дякую|спасибі|дяк|thanks)/i.test(q);
        if (isThanks) return pick([
            `Будь ласка! Завжди радий допомогти 😊`,
            `Нема за що! Ти крутий співрозмовник 🤗`,
        ]);

        if (/хто ти|ти хто/i.test(q)) return `Я — ${name}! Просто запитай про щось 😊`;

        if (/як справи|як ти/i.test(q)) return `У мене все чудово! А в тебе як? 😊`;

        if (isQuestion) return pick([
            `Цікаве питання! А що ти сам думаєш? 🤔`,
            `Гарне питання! Давай подумаємо разом 🧐`,
            `О, чудове питання! Я думаю, що це дуже цікава тема 😊`,
        ]);

        // Визначаємо тему
        const topics = {
            'технології': /комп'ютер|технолог|інтернет|програм|код|сайт|ai|штучн|робот/g,
            'наука': /наук|фізик|хімі|біолог|космос/g,
            'мистецтво': /музик|пісн|фільм|книг|вірш|малю/g,
            'природа': /ліс|річк|море|гори|квіт|тварин|дерев/g,
            'їжа': /їж|рецепт|смак|борщ|вареник|страв/g,
        };

        let topic = null;
        for (const [t, pat] of Object.entries(topics)) {
            if (pat.test(q)) { topic = t; break; }
        }

        if (topic) {
            return pick([
                `О, ${topic} — цікава тема! Розкажи більше, я слухаю 😊`,
                `${topic} — це те, що мене захоплює! Що саме тебе цікавить? 🎯`,
            ]);
        }

        return pick([
            `Цікаво! Розкажи більше, я слухаю 😊`,
            `Я тебе розумію. Продовжуй, мені цікаво! 🙌`,
            `Знаєш, ти правий. Це дійсно важлива тема. 🤔`,
            `Дякую, що поділився! А що ще думаєш з цього приводу? 🌟`,
        ]);
    }

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // ============================================================
    // UI
    // ============================================================
    function renderModes() {
        const list = document.getElementById('modeList');
        list.innerHTML = allModes.map(m => `
            <div class="mode-item ${activeMode && activeMode.id === m.id ? 'active' : ''}"
                 onclick="window.selectMode('${m.id}')">
                <span class="mi-ico">${m.ico}</span>
                <span class="mi-name">${m.name}</span>
                ${m.id.startsWith('c_') ? `<span class="mi-del" onclick="event.stopPropagation();window.deleteMode('${m.id}')">✕</span>` : ''}
            </div>
        `).join('') || '<div style="font-size:10px;color:rgba(255,255,255,0.04);padding:10px;text-align:center">—</div>';
    }

    window.selectMode = function(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode) return;
        activeMode = mode;
        history.length = 0;
        document.getElementById('chIco').textContent = mode.ico;
        document.getElementById('chName').textContent = mode.name;
        document.getElementById('chDesc').textContent = (mode.prompt || '').substring(0, 25);
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('chatInput').placeholder = 'Напиши ' + mode.name + 'у...';
        document.getElementById('chatInput').focus();

        const box = document.getElementById('chat-box');
        box.innerHTML = `<div class="msg ai"><div class="who">${mode.ico} ${mode.name}</div>Привіт! Я ${mode.ico} ${mode.name}. Про що поговоримо? 😊</div>`;

        renderModes();
        log('🎭 ' + mode.name);

        // Завантажуємо модель при першому виборі
        if (!model && !modelLoading) loadModel();
    };

    window.openModal = function() { document.getElementById('modal').classList.add('show'); };
    window.closeModal = function() { document.getElementById('modal').classList.remove('show'); };

    window.createMode = function() {
        const name = document.getElementById('mName').value.trim();
        const ico = document.getElementById('mIco').value.trim() || '🎭';
        const prompt = document.getElementById('mPrompt').value.trim();
        if (!name) { alert('Дай ім\'я'); return; }
        if (!prompt) { alert('Додай інструкцію'); return; }
        const mode = { id:'c_'+Date.now(), name, ico, prompt };
        customModes.push(mode);
        localStorage.setItem('realm_chat_modes', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        window.closeModal();
        renderModes();
        window.selectMode(mode.id);
    };

    window.deleteMode = function(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode || !confirm('Видалити «'+mode.name+'»?')) return;
        customModes = customModes.filter(m => m.id !== id);
        localStorage.setItem('realm_chat_modes', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        if (activeMode && activeMode.id === id) {
            activeMode = null;
            document.getElementById('chIco').textContent = '🤖';
            document.getElementById('chName').textContent = '—';
            document.getElementById('chDesc').textContent = '';
            document.getElementById('chatInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('chat-box').innerHTML = '<div class="empty-msg">🤖 Обери персонажа</div>';
        }
        renderModes();
    };

    window.sendMessage = async function() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !activeMode || loading) return;
        input.value = '';
        loading = true;
        document.getElementById('sendBtn').disabled = true;

        const box = document.getElementById('chat-box');
        const empty = box.querySelector('.empty-msg');
        if (empty) empty.remove();

        box.innerHTML += `<div class="msg user"><div class="who">Ти</div>${esc(text)}</div>`;
        box.scrollTop = box.scrollHeight;

        const aiMsg = document.createElement('div');
        aiMsg.className = 'msg ai';
        aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div><span class="typing">⚡</span>`;
        box.appendChild(aiMsg);
        box.scrollTop = box.scrollHeight;

        try {
            let answer;

            // Спроба 1: нейромережа
            if (model) {
                try {
                    answer = await generateWithModel(text);
                } catch(e) {
                    console.warn('Model failed:', e);
                    answer = null;
                }
            }

            // Спроба 2: локальний AI (резервний)
            if (!answer) {
                // Імітація думання
                await new Promise(r => setTimeout(r, 300 + Math.random() * 500));
                answer = generateLocalResponse(text);
            }

            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>${esc(answer).replace(/\n/g, '<br>')}`;

        } catch(e) {
            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>❌ ${esc(e.message)}`;
        }

        loading = false;
        document.getElementById('sendBtn').disabled = false;
        box.scrollTop = box.scrollHeight;
        input.focus();
    };

    function esc(t) {
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }
    function log(msg) {
        document.getElementById('log').textContent = '▸ ' + msg;
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    allModes = [...DEFAULT_MODES, ...customModes];
    renderModes();
    log('🧠 Обери персонажа — нейромережа завантажиться автоматично');

    // Автозавантаження моделі
    setTimeout(loadModel, 1000);
</script>
</body>
</html>
