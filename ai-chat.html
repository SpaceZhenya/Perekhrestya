<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat — локальний інтелект</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#080c12; color:#d0d8e0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; }
        #app { max-width:800px; margin:0 auto; padding:24px 16px 60px; }

        .logo { text-align:center; margin-bottom:20px; }
        .logo h1 { font-size:28px; font-weight:300; color:#e0e8f0; }
        .logo .sub { font-size:11px; color:rgba(255,255,255,0.08); }
        .badge { display:inline-block; padding:1px 8px; border-radius:4px; font-size:9px; background:rgba(68,136,204,0.04); color:rgba(68,136,204,0.2); vertical-align:middle; margin-left:6px; }

        .main-grid { display:grid; grid-template-columns:200px 1fr; gap:10px; }
        @media (max-width:640px) { .main-grid { grid-template-columns:1fr; } }

        #modes {
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; padding:12px; height:fit-content; max-height:520px; overflow-y:auto;
        }
        #modes .hdr { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.1); margin-bottom:6px; padding:0 4px; }
        .mode-item {
            display:flex; align-items:center; gap:6px;
            padding:7px 8px; border-radius:6px; cursor:pointer;
            transition:all 0.1s; margin-bottom:1px; font-size:12px;
        }
        .mode-item:hover { background:rgba(255,255,255,0.015); }
        .mode-item.active { background:rgba(68,136,204,0.05); }
        .mode-item .mi-ico { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
        .mode-item .mi-name { flex:1; color:rgba(255,255,255,0.35); }
        .mode-item.active .mi-name { color:rgba(255,255,255,0.6); }
        .mode-item .mi-del { font-size:11px; color:rgba(255,255,255,0.04); cursor:pointer; padding:0 3px; }
        .mode-item .mi-del:hover { color:#ee6688; }
        .mode-add {
            margin-top:5px; padding:7px 8px; width:100%; text-align:left;
            background:rgba(255,255,255,0.01); border:1px solid rgba(255,255,255,0.03); border-radius:6px;
            color:rgba(255,255,255,0.1); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .mode-add:hover { border-color:rgba(255,255,255,0.06); color:rgba(255,255,255,0.2); }
        #modes::-webkit-scrollbar { width:3px; }
        #modes::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }

        #chat-panel {
            display:flex; flex-direction:column;
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; overflow:hidden; min-height:380px;
        }
        #chat-header {
            padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.04);
            display:flex; align-items:center; gap:8px;
        }
        #chat-header .ch-ico { font-size:18px; }
        #chat-header .ch-name { flex:1; font-size:12px; color:rgba(255,255,255,0.4); }
        #chat-header .ch-name b { color:rgba(255,255,255,0.6); }
        #chat-header .ch-desc { font-size:9px; color:rgba(255,255,255,0.08); }

        #chat-box {
            flex:1; overflow-y:auto; padding:14px;
            display:flex; flex-direction:column; gap:6px;
            min-height:260px; max-height:420px;
        }
        #chat-box::-webkit-scrollbar { width:4px; }
        #chat-box::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }
        .msg { max-width:88%; padding:9px 12px; border-radius:8px; font-size:13px; line-height:1.5; }
        .msg.user { align-self:flex-end; background:rgba(68,136,204,0.05); color:rgba(255,255,255,0.5); }
        .msg.ai { align-self:flex-start; background:rgba(255,255,255,0.01); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.02); }
        .msg .who { font-size:8px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.06); margin-bottom:1px; }
        .msg .typing { display:inline-block; animation:blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

        #chat-input-wrap {
            display:flex; gap:6px; padding:10px 14px; border-top:1px solid rgba(255,255,255,0.04);
        }
        #chat-input-wrap input {
            flex:1; background:rgba(255,255,255,0.015);
            border:1px solid rgba(255,255,255,0.04); border-radius:6px;
            padding:9px 12px; font-size:13px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        #chat-input-wrap input:focus { border-color:rgba(68,136,204,0.2); }
        #chat-input-wrap input::placeholder { color:rgba(255,255,255,0.05); }
        #chat-input-wrap button {
            padding:9px 16px; background:rgba(68,136,204,0.08);
            border:1px solid rgba(68,136,204,0.1); border-radius:6px;
            color:#88bbee; font-size:13px; cursor:pointer; font-family:inherit;
        }
        #chat-input-wrap button:hover { background:rgba(68,136,204,0.12); }
        #chat-input-wrap button:disabled { opacity:0.15; cursor:not-allowed; }

        .empty-msg { text-align:center; padding:35px 20px; color:rgba(255,255,255,0.03); font-size:12px; margin:auto; }

        .modal-overlay {
            display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(4,6,10,0.85); z-index:100;
            align-items:center; justify-content:center; backdrop-filter:blur(4px);
        }
        .modal-overlay.show { display:flex; }
        .modal {
            background:#0c1018; border:1px solid rgba(255,255,255,0.06);
            border-radius:10px; width:460px; max-width:90vw;
            padding:22px; max-height:80vh; overflow-y:auto;
        }
        .modal h2 { font-size:15px; font-weight:400; color:rgba(255,255,255,0.5); margin-bottom:14px; }
        .modal label { display:block; font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.12); margin-bottom:3px; margin-top:10px; }
        .modal input, .modal textarea {
            width:100%; background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.05); border-radius:6px;
            padding:9px 11px; font-size:12px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        .modal input:focus, .modal textarea:focus { border-color:rgba(68,136,204,0.2); }
        .modal textarea { min-height:70px; resize:vertical; line-height:1.5; }
        .modal .btn-row { display:flex; gap:6px; margin-top:14px; }
        .modal .btn-row button {
            flex:1; padding:9px; border-radius:6px;
            background:rgba(255,255,255,0.015); border:1px solid rgba(255,255,255,0.05);
            color:rgba(255,255,255,0.25); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .modal .btn-row button:hover { background:rgba(255,255,255,0.03); }
        .modal .btn-row button.primary { background:rgba(68,136,204,0.06); border-color:rgba(68,136,204,0.08); color:#88bbee; }
        .modal .btn-row button.primary:hover { background:rgba(68,136,204,0.1); }

        #log { font-size:9px; color:rgba(255,255,255,0.04); padding:3px 0; line-height:1.4; height:16px; overflow:hidden; }
    </style>
</head>
<body>
<div id="app">
    <div class="logo">
        <h1>🧠 AI Chat <span class="badge">локальний</span></h1>
        <div class="sub">Інтелектуальний аналізатор з пам'яттю та контекстом</div>
    </div>

    <div class="main-grid">
        <div id="modes">
            <div class="hdr">🎭 Персонажі</div>
            <div id="modeList"></div>
            <button class="mode-add" onclick="openModal()">+ Своя мода</button>
        </div>

        <div id="chat-panel">
            <div id="chat-header">
                <span class="ch-ico" id="chIco">🤖</span>
                <div class="ch-name">Обери <b id="chName">—</b></div>
                <div class="ch-desc" id="chDesc"></div>
            </div>

            <div id="chat-box">
                <div class="empty-msg">🤖 Обери персонажа ліворуч<br>і почни спілкування</div>
            </div>

            <div id="chat-input-wrap">
                <input id="chatInput" placeholder="Напиши повідомлення..." disabled
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
                <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>
    <div id="log"></div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>✨ Створити персонажа</h2>
        <label>Ім'я</label>
        <input id="mName" placeholder="Ім'я персонажа" value="Мій AI">
        <label>Емодзі</label>
        <input id="mIco" placeholder="🎭" value="🎭">
        <label>Інструкція (як відповідати)</label>
        <textarea id="mPrompt" placeholder="Опиши характер..." rows="4">Ти — цікавий співрозмовник. Відповідай змістовно.</textarea>
        <div class="btn-row">
            <button onclick="closeModal()">✕ Скасувати</button>
            <button class="primary" onclick="createMode()">✅ Створити</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // ЛОКАЛЬНИЙ AI — з пам'яттю, контекстом та аналізом
    // ============================================================

    const DEFAULT_MODES = [
        { id:'poet', name:'Поет', ico:'🖋', prompt:'Відповідай віршами, лірично' },
        { id:'funny', name:'Жартівник', ico:'😂', prompt:'Жартуй, веселий гумор' },
        { id:'detective', name:'Детектив', ico:'🕵️', prompt:'Аналізуй, шукай докази' },
        { id:'teacher', name:'Вчитель', ico:'📚', prompt:'Пояснюй просто, з прикладами' },
        { id:'chef', name:'Шеф-кухар', ico:'🍳', prompt:'Рецепти, любов до їжі' },
        { id:'philosopher', name:'Філософ', ico:'📖', prompt:'Відповідай глибоко' },
        { id:'psychologist', name:'Психолог', ico:'🛋', prompt:'Слухай, підтримуй' },
        { id:'grandma', name:'Бабуся', ico:'👵', prompt:'Турботливо, життєві поради' },
        { id:'sarcastic', name:'Саркастичний', ico:'😏', prompt:'Іронія, дотепність' },
        { id:'motivator', name:'Мотиватор', ico:'💪', prompt:'Надихай, мотивуй' },
        { id:'alien', name:'Інопланетянин', ico:'👽', prompt:'Все дивно на Землі' },
        { id:'wizard', name:'Чарівник', ico:'🧙', prompt:'Відповідай загадками' },
        { id:'historian', name:'Історик', ico:'📜', prompt:'Розказуй історичні факти' },
        { id:'scientist', name:'Науковець', ico:'🔬', prompt:'Науковий підхід до всього' },
    ];

    let customModes = JSON.parse(localStorage.getItem('ai_modes4') || '[]');
    let allModes = [...DEFAULT_MODES, ...customModes];
    let activeMode = null;
    let loading = false;
    let memory = { context: '', topic: '', userMood: '', lastTopics: [], userName: '' };
    let exchangeCount = 0;

    // ============================================================
    // ГОЛОВНИЙ AI
    // ============================================================
    function generate(msg) {
        const mode = activeMode;
        if (!mode) return '...';

        exchangeCount++;
        const q = msg.trim();
        const name = mode.name;
        const prompt = mode.prompt || '';

        // Аналіз
        const analysis = analyze(q, name, prompt);

        // Оновлення пам'яті
        updateMemory(q, analysis);

        // Генерація відповіді
        return response(q, analysis, name, prompt);
    }

    // ============================================================
    // АНАЛІЗ
    // ============================================================
    function analyze(q, name, prompt) {
        const lower = q.toLowerCase();
        const words = lower.split(/\s+/).filter(w => w.length > 1);
        const firstWord = words[0] || '';

        const result = {
            intent: 'general',
            topic: null,
            sentiment: 'neutral',
            isQuestion: false,
            hasName: false,
            isFirstExchange: exchangeCount === 1,
            hasEmotion: false,
            keyWords: [],
            length: words.length,
            charLength: q.length,
            isShort: words.length <= 2 && q.length < 15,
            startsWithQuestion: /^(чи|як|що|чому|де|коли|хто|куди|звідки|навіщо|скільки)/i.test(lower),
            endsWithQuestion: q.includes('?') || q.includes('？'),
        };

        // ===== ІНТЕНТ =====
        // Вітання
        if (/^(привіт|здоров|хай|добр(ий|ого|ень|р)|ку|hello|hi|hey|добридень|добрвечір|добрранок|вітаю|салют|прив)/i.test(lower)
            || /(^|\s)привіт(\s|$|!)/i.test(lower) && !result.isQuestion) {
            result.intent = 'greeting';
        }
        // Прощання
        else if (/^(бувай|пака|до побачення|проща|на все добре|бува|гудбай|bye|goodbye|adieu)/i.test(lower)) {
            result.intent = 'farewell';
        }
        // Подяка
        else if (/^(дякую|спасибі|вдячний|вдячна|thanks|thx|merci|дяк|спас)/i.test(lower)) {
            result.intent = 'thanks';
        }
        // Хто я
        else if (/(^|\s)(хто ти|ти хто|що ти|type of ai|what are you)(\s|$|\.|\?)/.test(lower)) {
            result.intent = 'who_am_i';
        }
        // Як справи
        else if (/як справи|як ти|шо там|как дела|how are/i.test(lower)) {
            result.intent = 'how_are_you';
        }
        // Як тебе звати
        else if (/як тебе звати|твоє ім'я|your name|як тебе звуть/i.test(lower)) {
            result.intent = 'name_question';
        }
        // Що робиш
        else if (/що робиш|чим займаєшся|що ти робиш/i.test(lower)) {
            result.intent = 'what_doing';
        }
        // Котра година
        else if (/котра година|котрий час|скільки часу|котра зараз/i.test(lower) || (lower.includes('годин') && /час/i.test(lower))) {
            result.intent = 'time';
        }
        // Глибокі питання
        else if (/(сенс житт|щастя|любов|смерть|справжн|призначен|вічність|душа|бог|всесвіт|доля|сенс буття)/i.test(lower)) {
            result.intent = 'deep';
        }
        // Негативні емоції
        else if (/сумн|поган|плох|важк|страш|тривож|депрес|самот|біль|плак|втом|розбит|злий|гнів|печаль|проблем|крінж|нуд/i.test(lower)) {
            result.intent = 'negative';
            result.sentiment = 'negative';
            result.hasEmotion = true;
        }
        // Позитивні емоції
        else if (/радіс|щаст|чудов|прекрас|супер|клас|крут|дивовиж|кайф|неймовір|крутяк|геніальн/i.test(lower)) {
            result.intent = 'positive';
            result.sentiment = 'positive';
            result.hasEmotion = true;
        }
        // Допомога
        else if (/порад|допомож|як бути|що робит|підкаж|help me|як мені|порадь|допоможи/i.test(lower)) {
            result.intent = 'help';
        }
        // Похвала
        else if (/ти класн|ти крут|ти розумн|ти кращ|ти супер|ти чудов|ти геній|ти молодець/i.test(lower)) {
            result.intent = 'praise';
        }
        // Згода
        else if (/^так\b|^ага\b|^угу\b|^ok\b|^ок\b|^добре\b|^згоден\b|^правильно\b/i.test(lower)) {
            result.intent = 'agreement';
        }
        // Незгода
        else if (/^ні\b|^не\b|^ноу\b|^нет\b|^категорично/i.test(lower)) {
            result.intent = 'disagreement';
        }
        // Питання
        else if (result.endsWithQuestion || result.startsWithQuestion) {
            result.intent = 'question';
        }

        // ===== ТЕМИ =====
        const topicMap = [
            ['tech', /комп'ютер|технолог|інтернет|програм|код|сайт|ai|штучн|нейрон|робот|гаджет|ноут|пк|додат|чат-бот|gpt|нейромереж|гпт|deepseek|chatgpt|ші|алгоритм|дані|сервер/i],
            ['science', /наук|дослід|фізик|хімі|біолог|експеримент|теорі|відкритт|космос|ген|формул|земл|планет|зірк|атом|квант/i],
            ['music', /музик|пісн|мелоді|гітар|піанін|спів|трек|альбом|концерт|рок|джаз|реп|біт|нот|співак|саунд/i],
            ['art', /малю|картин|фільм|книг|вірш|тан|театр|поезі|роман|письменник|художник|кіно|серіал/i],
            ['nature', /природ|ліс|річк|море|гори|озер|дерев|квіт|тварин|птах|метелик|закат|світан|погод|неб/i],
            ['sport', /спорт|футбол|тренув|біг|зал|баскет|теніс|йог|плав|велосипед|бокс|змаган/i],
            ['food', /їж|страв|рецепт|смак|приготув|кухар|борщ|піц|суп|салат|десерт|мясо|риб|овоч|кав|пив/i],
            ['travel', /подорож|мандр|поїздк|відпустк|тур|країн|міст|екскурсі|білет|готел|аеропорт/i],
            ['life', /робот|навчан|універ|школ|сім[яї]|друзі|кохан|стосунк|грош|кар'єр/i],
        ];

        for (const [topic, pattern] of topicMap) {
            if (pattern.test(lower)) {
                result.topic = topic;
                break;
            }
        }

        // Ключові слова
        const stopWords = new Set(['і', 'й', 'та', 'а', 'але', 'або', 'чи', 'не', 'в', 'у', 'на', 'з', 'до', 'по', 'за', 'про', 'від', 'для', 'без', 'при', 'через', 'під', 'над', 'це', 'що', 'як', 'так', 'ні', 'ти', 'я', 'він', 'вона', 'воно', 'ми', 'ви', 'вони', 'мене', 'тобі', 'мені', 'його', 'її', 'їх', 'свій', 'цей', 'той', 'такий', 'весь', 'кожен', 'інший', 'сам', 'дуже', 'більш', 'менш', 'також', 'ще', 'вже', 'тут', 'там', 'тоді', 'тепер', 'зараз', 'сьогодні', 'вчора', 'завтра', 'може', 'бути', 'мати', 'робити', 'сказати', 'знати', 'хотіти', 'могти']);
        result.keyWords = words.filter(w => w.length > 2 && !stopWords.has(w));

        return result;
    }

    // ============================================================
    // ПАМ'ЯТЬ
    // ============================================================
    function updateMemory(q, analysis) {
        memory.context = q;
        if (analysis.topic) {
            memory.lastTopics.unshift(analysis.topic);
            if (memory.lastTopics.length > 3) memory.lastTopics.pop();
            memory.topic = analysis.topic;
        }
        if (analysis.sentiment !== 'neutral') memory.userMood = analysis.sentiment;

        // Спробувати визначити ім'я користувача
        const nameMatch = q.match(/мене звати (\w+)|я (\w+)|call me (\w+)|my name is (\w+)/i);
        if (nameMatch) {
            memory.userName = nameMatch[1] || nameMatch[2] || nameMatch[3] || nameMatch[4] || '';
        }
    }

    // ============================================================
    // ГЕНЕРАЦІЯ ВІДПОВІДІ
    // ============================================================
    function response(q, a, name, prompt) {
        // Використовуємо ім'я користувача якщо є
        const userRef = memory.userName || '';

        switch(a.intent) {

            case 'greeting': {
                const g = [
                    `Привіт${userRef ? ', ' + userRef : ''}! Я ${name}. Радий тебе бачити! Про що поговоримо? 😊`,
                    `Ооо, вітання${userRef ? ', ' + userRef : ''}! Я ${name} 🎉 Розкажи, що в тебе нового!`,
                    `Здоровенькі були! Я ${name}. Давай спілкуватись! 🌟`,
                    `Привіт-привіт! ${name} на зв'язку. Як справи? 🤗`,
                    `Вітаю! ${name} слухає тебе. Що цікавого сталося? 😊`,
                ];
                if (a.isFirstExchange) {
                    return g[Math.floor(Math.random() * 2)]; // перші 2 варіанти
                }
                return pick(g);
            }

            case 'farewell': return pick([
                `Бувай${userRef ? ', ' + userRef : ''}! Буду чекати нашої наступної розмови 😊`,
                `До зустрічі! Приходь ще, я завжди радий 🌟`,
                `Па-па! Гарного дня тобі! 🌈`,

            case 'negative': return pick([

            case 'positive': return pick([

                `Оце так новина! 🎉 Коли ти щасливий — світ стає яскравішим! ✨`,

            case 'agreement': return pick([

            ]);

            case 'question': {
                if (/як справи|як ти/i.test(q)) return response(q, {...a, intent: 'how_are_you'}, name, prompt);
                if (/чому|навіщо/i.test(q)) return pick([
                    `Гарне питання! Все в цьому світі взаємопов'язане. А ти як думаєш? 🧐`,
                    `На це є кілька причин. Але найголовніша — все має свої причини та наслідки. 🤔`,

                ]);
                if (/як/i.test(q)) return pick([
                    `Найкращий спосіб — почати. Зроби перший крок, навіть маленький. Потрібна допомога? 💪`,

                    'art': [
                        `Мистецтво — це мова душі. Що тобі подобається — створювати чи споглядати? 🎨`,

                    'sport': [

                    ],
                    'life': [

                const reactions = topicReactions[a.topic];

                return pick([
                    `Цікава тема! Розкажи більше, я слухаю 😊`,

        // ===== ЗАГАЛЬНІ ВІДПОВІДІ =====
        if (a.isShort) {
            return pick([

        // Розповідь про себе
        if (/я (люблю|займаюсь|працюю|вчусь|живу|мрію|хочу|був|поїхав|зробив|створ|пиш|малю|граю)/i.test(q)) {

                `Це прекрасно${userRef ? ', ' + userRef : ''}! Розкажи ще, мені справді цікаво 😊`,

                `Клас! Я радий, що ти поділився. А що ще тобі подобається? 🙌`,
                `Це дуже цікаво! Я хочу знати більше. Що надихає тебе в цьому? ✨`,
            ]);
        }

        // Думка
        if (/я думаю|я вважаю|на мою думку|мені здається/i.test(q)) {
            return pick([
                `Цікава думка! А чому ти так вважаєш? 🤔`,
                `Я ціную твою думку. Розкажи більше! 😊`,
                `Слухаю і погоджуюсь! Думки мають значення. Продовжуй ділитись! 🌟`,

        // Продовження теми (якщо була попередня розмова)
        if (exchangeCount > 2 && memory.lastTopics.length > 0) {
            const prevTopic = memory.lastTopics[0];
            if (prevTopic && a.topic !== prevTopic && Math.random() > 0.7) {
                return pick([
                    `Ми до речі говорили про ${getTopicName(prevTopic)} — це теж цікава тема. Але продовжуй, я слухаю! 😊`,

        // Креативні загальні відповіді
        const creative = [
            `Цікаво${userRef ? ', ' + userRef : ''}! А знаєш, найкращі ідеї народжуються в розмовах. Продовжуй! 💡`,
            `Я тебе слухаю і розумію. Що ще хочеш сказати? 🤗`,
            `Дякую, що поділився! Кожна розмова відкриває щось нове. 🌍`,
            `Спілкування з тобою робить мій день кращим! 😊 Розкажи ще!`,
            `Я обожнюю такі розмови! Вони надихають. 🔥`,
            `Мені подобається, як ти мислиш. Це свіжий погляд! 🌟`,

            `Знаєш, світ стає кращим, коли люди говорять про важливе. Дякую за цю розмову! 🌈`,

            `Ти знаєш, що найцікавіше? Те, як ти про це розповідаєш. У тебе хороший стиль! 😊`,

        // Іноді жарт
        if (Math.random() > 0.85) {
            return pick([
                `Оце так поворот! А я думав, ми будемо говорити про щось простіше... 😄`,
                `Знаєш, а ти мені подобаєшся. Хороший у тебе смак на теми! 😎`,

    // ============================================================
    // ДОПОМІЖНІ
    // ============================================================
    function getTopicName(topic) {
        const names = {
            'tech': 'технології', 'science': 'науку', 'music': 'музику', 'art': 'мистецтво',
            'nature': 'природу', 'sport': 'спорт', 'food': 'їжу', 'travel': 'подорожі', 'life': 'життя'
        };
        return names[topic] || topic;
    }

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // ============================================================
    // UI
    // ============================================================
    function renderModes() {
        const list = document.getElementById('modeList');
        list.innerHTML = allModes.map(m => `
            <div class="mode-item ${activeMode && activeMode.id === m.id ? 'active' : ''}"
                 onclick="selectMode('${m.id}')">
                <span class="mi-ico">${m.ico}</span>
                <span class="mi-name">${m.name}</span>
                ${m.id.startsWith('c_') ? `<span class="mi-del" onclick="event.stopPropagation();deleteMode('${m.id}')">✕</span>` : ''}
            </div>
        `).join('') || '<div style="font-size:10px;color:rgba(255,255,255,0.04);padding:10px">—</div>';
    }

    window.selectMode = function(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode) return;
        activeMode = mode;
        memory = { context: '', topic: '', userMood: '', lastTopics: [], userName: '' };
        exchangeCount = 0;
        document.getElementById('chIco').textContent = mode.ico;
        document.getElementById('chName').textContent = mode.name;
        document.getElementById('chDesc').textContent = (mode.prompt || '').substring(0, 25);
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('chatInput').placeholder = 'Напиши ' + mode.name + 'у...';
        document.getElementById('chatInput').focus();
        const box = document.getElementById('chat-box');
        box.innerHTML = `<div class="msg ai"><div class="who">${mode.ico} ${mode.name}</div>Привіт! Я ${mode.ico} ${mode.name}. Про що поговоримо? 😊</div>`;
        renderModes();
        log('🎭 ' + mode.name);
    };

    window.openModal = function() { document.getElementById('modal').classList.add('show'); };
    window.closeModal = function() { document.getElementById('modal').classList.remove('show'); };

    window.createMode = function() {
        const name = document.getElementById('mName').value.trim();
        const ico = document.getElementById('mIco').value.trim() || '🎭';
        const prompt = document.getElementById('mPrompt').value.trim();
        if (!name) { alert('Дай ім\'я'); return; }
        if (!prompt) { alert('Додай інструкцію'); return; }
        const mode = { id:'c_'+Date.now(), name, ico, prompt };
        customModes.push(mode);
        localStorage.setItem('ai_modes4', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        window.closeModal();
        renderModes();
        window.selectMode(mode.id);
    };

    window.deleteMode = function(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode || !confirm('Видалити «'+mode.name+'»?')) return;
        customModes = customModes.filter(m => m.id !== id);
        localStorage.setItem('ai_modes4', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        if (activeMode && activeMode.id === id) {
            activeMode = null;
            document.getElementById('chIco').textContent = '🤖';
            document.getElementById('chName').textContent = '—';
            document.getElementById('chDesc').textContent = '';
            document.getElementById('chatInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('chat-box').innerHTML = '<div class="empty-msg">🤖 Обери персонажа</div>';
        }
        renderModes();
    };

    window.sendMessage = async function() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !activeMode || loading) return;
        input.value = '';
        loading = true;
        document.getElementById('sendBtn').disabled = true;

        const box = document.getElementById('chat-box');
        const empty = box.querySelector('.empty-msg');
        if (empty) empty.remove();

        box.innerHTML += `<div class="msg user"><div class="who">Ти</div>${esc(text)}</div>`;
        box.scrollTop = box.scrollHeight;

        const aiMsg = document.createElement('div');
        aiMsg.className = 'msg ai';
        aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div><span class="typing">⚡</span>`;
        box.appendChild(aiMsg);
        box.scrollTop = box.scrollHeight;

        await new Promise(r => setTimeout(r, 150 + Math.random() * 350));

        try {
            const answer = generate(text);
            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>${esc(answer).replace(/\n/g, '<br>')}`;
        } catch(e) {
            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>❌ ${esc(e.message)}`;
        }

        loading = false;
        document.getElementById('sendBtn').disabled = false;
        box.scrollTop = box.scrollHeight;
        input.focus();
    };

    function esc(t) {
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }
    function log(msg) { document.getElementById('log').textContent = '▸ ' + msg; }

    // ============================================================
    // СТАРТ
    // ============================================================
    allModes = [...DEFAULT_MODES, ...customModes];
    renderModes();
    log('🧠 AI готовий! Обери персонажа');
</script>
</body>
</html>
