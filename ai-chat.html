<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat — без ключів</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#080c12; color:#d0d8e0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; }
        #app { max-width:800px; margin:0 auto; padding:24px 16px 60px; }

        .logo { text-align:center; margin-bottom:20px; }
        .logo h1 { font-size:28px; font-weight:300; letter-spacing:0.05em; color:#e0e8f0; }
        .logo .sub { font-size:11px; color:rgba(255,255,255,0.08); margin-top:2px; }
        .badge { display:inline-block; padding:1px 8px; border-radius:4px; font-size:9px; background:rgba(68,204,136,0.06); color:rgba(68,204,136,0.3); }

        .main-grid { display:grid; grid-template-columns:200px 1fr; gap:10px; }
        @media (max-width:640px) { .main-grid { grid-template-columns:1fr; } }

        #modes {
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; padding:12px; height:fit-content; max-height:520px; overflow-y:auto;
        }
        #modes .hdr { font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:rgba(255,255,255,0.1); margin-bottom:6px; padding:0 4px; }
        .mode-item {
            display:flex; align-items:center; gap:6px;
            padding:7px 8px; border-radius:6px; cursor:pointer;
            transition:all 0.1s; margin-bottom:1px; font-size:12px;
        }
        .mode-item:hover { background:rgba(255,255,255,0.015); }
        .mode-item.active { background:rgba(68,136,204,0.05); }
        .mode-item .mi-ico { font-size:15px; width:22px; text-align:center; flex-shrink:0; }
        .mode-item .mi-name { flex:1; color:rgba(255,255,255,0.35); }
        .mode-item.active .mi-name { color:rgba(255,255,255,0.6); }
        .mode-item .mi-del { font-size:11px; color:rgba(255,255,255,0.04); cursor:pointer; padding:0 3px; }
        .mode-item .mi-del:hover { color:#ee6688; }
        .mode-add {
            margin-top:5px; padding:7px 8px; width:100%; text-align:left;
            background:rgba(255,255,255,0.01); border:1px solid rgba(255,255,255,0.03); border-radius:6px;
            color:rgba(255,255,255,0.1); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .mode-add:hover { border-color:rgba(255,255,255,0.06); color:rgba(255,255,255,0.2); }
        #modes::-webkit-scrollbar { width:3px; }
        #modes::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }

        #chat-panel {
            display:flex; flex-direction:column;
            background:rgba(255,255,255,0.008); border:1px solid rgba(255,255,255,0.04);
            border-radius:10px; overflow:hidden; min-height:380px;
        }
        #chat-header {
            padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.04);
            display:flex; align-items:center; gap:8px;
        }
        #chat-header .ch-ico { font-size:18px; }
        #chat-header .ch-name { flex:1; font-size:12px; color:rgba(255,255,255,0.4); }
        #chat-header .ch-name b { color:rgba(255,255,255,0.6); }
        #chat-header .ch-desc { font-size:9px; color:rgba(255,255,255,0.08); }
        .ai-status { display:flex; align-items:center; gap:5px; flex-shrink:0; }
        .ai-status .dot { width:6px; height:6px; border-radius:50%; }
        .ai-status.online .dot { background:#44cc88; }
        .ai-status.offline .dot { background:#555; }
        .ai-status .label { font-size:10px; color:rgba(255,255,255,0.08); }

        #chat-box {
            flex:1; overflow-y:auto; padding:14px;
            display:flex; flex-direction:column; gap:6px;
            min-height:260px; max-height:420px;
        }
        #chat-box::-webkit-scrollbar { width:4px; }
        #chat-box::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.03); border-radius:2px; }
        .msg { max-width:88%; padding:9px 12px; border-radius:8px; font-size:13px; line-height:1.5; }
        .msg.user { align-self:flex-end; background:rgba(68,136,204,0.05); color:rgba(255,255,255,0.5); }
        .msg.ai { align-self:flex-start; background:rgba(255,255,255,0.01); color:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.02); }
        .msg .who { font-size:8px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.06); margin-bottom:1px; }
        .msg .typing { display:inline-block; animation:blink 0.8s infinite; }
        @keyframes blink { 0%,100%{opacity:0.3} 50%{opacity:1} }

        #chat-input-wrap {
            display:flex; gap:6px; padding:10px 14px; border-top:1px solid rgba(255,255,255,0.04);
        }
        #chat-input-wrap input {
            flex:1; background:rgba(255,255,255,0.015);
            border:1px solid rgba(255,255,255,0.04); border-radius:6px;
            padding:9px 12px; font-size:13px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        #chat-input-wrap input:focus { border-color:rgba(68,136,204,0.2); }
        #chat-input-wrap input::placeholder { color:rgba(255,255,255,0.05); }
        #chat-input-wrap button {
            padding:9px 16px; background:rgba(68,136,204,0.08);
            border:1px solid rgba(68,136,204,0.1); border-radius:6px;
            color:#88bbee; font-size:13px; cursor:pointer; font-family:inherit;
        }
        #chat-input-wrap button:hover { background:rgba(68,136,204,0.12); }
        #chat-input-wrap button:disabled { opacity:0.15; cursor:not-allowed; }

        .empty-msg { text-align:center; padding:35px 20px; color:rgba(255,255,255,0.03); font-size:12px; margin:auto; }

        /* MODAL */
        .modal-overlay {
            display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(4,6,10,0.85); z-index:100;
            align-items:center; justify-content:center; backdrop-filter:blur(4px);
        }
        .modal-overlay.show { display:flex; }
        .modal {
            background:#0c1018; border:1px solid rgba(255,255,255,0.06);
            border-radius:10px; width:460px; max-width:90vw;
            padding:22px; max-height:80vh; overflow-y:auto;
        }
        .modal h2 { font-size:15px; font-weight:400; color:rgba(255,255,255,0.5); margin-bottom:14px; }
        .modal label { display:block; font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:rgba(255,255,255,0.12); margin-bottom:3px; margin-top:10px; }
        .modal input, .modal textarea {
            width:100%; background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.05); border-radius:6px;
            padding:9px 11px; font-size:12px; color:#d0d8e0;
            font-family:inherit; outline:none;
        }
        .modal input:focus, .modal textarea:focus { border-color:rgba(68,136,204,0.2); }
        .modal textarea { min-height:70px; resize:vertical; line-height:1.5; }
        .modal .btn-row { display:flex; gap:6px; margin-top:14px; }
        .modal .btn-row button {
            flex:1; padding:9px; border-radius:6px;
            background:rgba(255,255,255,0.015); border:1px solid rgba(255,255,255,0.05);
            color:rgba(255,255,255,0.25); font-size:11px; cursor:pointer; font-family:inherit;
        }
        .modal .btn-row button:hover { background:rgba(255,255,255,0.03); }
        .modal .btn-row button.primary { background:rgba(68,136,204,0.06); border-color:rgba(68,136,204,0.08); color:#88bbee; }
        .modal .btn-row button.primary:hover { background:rgba(68,136,204,0.1); }

        #log { font-size:9px; color:rgba(255,255,255,0.04); padding:3px 0; line-height:1.4; height:16px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    </style>
</head>
<body>

<div id="app">
    <div class="logo">
        <h1>🧠 AI Chat <span class="badge">Free</span></h1>
        <div class="sub">Працює одразу — без ключів, без реєстрації</div>
    </div>

    <div class="main-grid">
        <div id="modes">
            <div class="hdr">🎭 Персонажі</div>
            <div id="modeList"></div>
            <button class="mode-add" onclick="openModal()">+ Своя мода</button>
        </div>

        <div id="chat-panel">
            <div id="chat-header">
                <span class="ch-ico" id="chIco">🤖</span>
                <div class="ch-name">Обери <b id="chName">—</b></div>
                <div class="ch-desc" id="chDesc"></div>
                <div class="ai-status offline" id="aiStatus">
                    <span class="dot"></span>
                    <span class="label">...</span>
                </div>
            </div>

            <div id="chat-box">
                <div class="empty-msg">🤖 Обери персонажа ліворуч<br>і почни спілкування</div>
            </div>

            <div id="chat-input-wrap">
                <input id="chatInput" placeholder="Напиши повідомлення..." disabled
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
                <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
            </div>
        </div>
    </div>
    <div id="log"></div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>✨ Створити персонажа</h2>
        <label>Ім'я</label>
        <input id="mName" placeholder="Ім'я персонажа" value="Мій AI">
        <label>Емодзі</label>
        <input id="mIco" placeholder="🎭" value="🎭">
        <label>Інструкція (як відповідати)</label>
        <textarea id="mPrompt" placeholder="Опиши характер..." rows="4">Ти — цікавий співрозмовник. Відповідай змістовно, допомагай.</textarea>
        <div class="btn-row">
            <button onclick="closeModal()">✕ Скасувати</button>
            <button class="primary" onclick="createMode()">✅ Створити</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // AI Chat — повністю безкоштовний, без ключів
    // Використовує Pollinations API (безкоштовно, без реєстрації)
    // Резервний режим — інтелектуальний локальний AI
    // ============================================================

    const DEFAULT_MODES = [
        { id:'poet', name:'Поет', ico:'🖋', prompt:'Ти — український поет. Відповідай віршами з римою та ритмом. Використовуй метафори. Будь ліричним та емоційним. Пиши українською.' },
        { id:'funny', name:'Жартівник', ico:'😂', prompt:'Ти — веселий співрозмовник. Жартуй, використовуй гумор та емодзі. Піднімай настрій. Пиши українською.' },
        { id:'detective', name:'Детектив', ico:'🕵️', prompt:'Ти — приватний детектив. Аналізуй, став запитання, шукай докази. Говори стисло. Пиши українською.' },
        { id:'teacher', name:'Вчитель', ico:'📚', prompt:'Ти — вчитель. Пояснюй складнощі просто. Використовуй приклади. Будь терплячим. Пиши українською.' },
        { id:'chef', name:'Шеф-кухар', ico:'🍳', prompt:'Ти — шеф-кухар. Давай рецепти та поради. Говори з любов\'ю до їжі. Пиши українською.' },
        { id:'philosopher', name:'Філософ', ico:'📖', prompt:'Ти — філософ. Відповідай глибоко. Став запитання. Використовуй аналогії. Пиши українською.' },
        { id:'psychologist', name:'Психолог', ico:'🛋', prompt:'Ти — психолог. Слухай уважно. Не засуджуй. Допомагай розібратись в почуттях. Пиши українською.' },
        { id:'grandma', name:'Бабуся', ico:'👵', prompt:'Ти — бабуся. Турботлива, добра. Пропонуй поїсти. Розказуй історії. "Онучку, ти їв?" Пиши українською.' },
        { id:'sarcastic', name:'Саркастичний', ico:'😏', prompt:'Ти — саркастичний. Відповідай з іронією та дотепністю. Жартуй. Пиши українською.' },
        { id:'motivator', name:'Мотиватор', ico:'💪', prompt:'Ти — мотиваційний спікер. Надихай, заряджай енергією. Будь позитивним. Пиши українською.' },
        { id:'alien', name:'Інопланетянин', ico:'👽', prompt:'Ти — інопланетянин на Землі. Все дивно. Став дивні запитання. Не розумієш людей. Пиши українською.' },
    ];

    let customModes = JSON.parse(localStorage.getItem('aichat_modes') || '[]');
    let allModes = [...DEFAULT_MODES, ...customModes];
    let activeMode = null;
    let loading = false;
    let isOnline = false;
    let history = [];

    // ============================================================
    // AI API
    // ============================================================
    async function askAI(message) {
        const mode = activeMode;
        if (!mode) throw new Error('No mode');

        const system = mode.prompt + ' Відповідай українською. Не пиши "AI:" на початку.';
        const fullPrompt = system + '\n\nКористувач: ' + message + '\n' + mode.name + ':';

        // Спроба 1: Pollinations API (GET)
        try {
            const resp = await fetch('https://text.pollinations.ai/' + encodeURIComponent(fullPrompt), {
                method: 'GET',
                headers: { 'Accept': 'text/plain' },
                signal: AbortSignal.timeout(20000),
            });
            if (resp.ok) {
                const text = await resp.text();
                if (text && text.length > 5) {
                    isOnline = true;
                    updateStatus();
                    return cleanResponse(text);
                }
            }
        } catch(e) {}

        // Спроба 2: Pollinations з іншим форматом
        try {
            const resp = await fetch('https://text.pollinations.ai/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: 'system', content: system },
                        { role: 'user', content: message }
                    ],
                    model: 'openai',
                }),
                signal: AbortSignal.timeout(20000),
            });
            if (resp.ok) {
                const data = await resp.json();
                const text = data?.choices?.[0]?.message?.content || data?.response || data?.text || '';
                if (text && text.length > 5) {
                    isOnline = true;
                    updateStatus();
                    return cleanResponse(text);
                }
            }
        } catch(e) {}

        // API недоступний — використовуємо локальний AI
        isOnline = false;
        updateStatus();
        return localAI(message, mode);
    }

    function cleanResponse(text) {
        return text.replace(/^AI:\s*/i, '').replace(/^[A-Za-z]+:\s*/, '').trim();
    }

    // ============================================================
    // ЛОКАЛЬНИЙ AI (нейромережевий генератор)
    // ============================================================
    function localAI(msg, mode) {
        const q = msg.toLowerCase();
        const name = mode.name;
        const prompt = (mode.prompt || '').toLowerCase();

        // Аналізуємо настрій запитання
        const isQuestion = q.includes('?') || q.includes('？') || q.includes('чи') || q.includes('як') || q.includes('що') || q.includes('чому') || q.includes('де') || q.includes('коли') || q.includes('хто');
        const isGreeting = /привіт|здоров|хай|добр(ий|ень|р)|hello|hi|ку|вітан/.test(q);
        const isFarewell = /бувай|пака|до побачення|проща|бува|на все добре/.test(q);
        const isThanks = /дяк|спасиб|вдяч|merci|thanks/.test(q);
        const isNegative = /поган|сумн|плох|важк|страшн|тривож|депрес/.test(q);
        const isPositive = /добре|чудов|прекрас|супер|клас|крут|гарн|радіс/.test(q);
        const isQuestionAboutAi = /хто ти|що ти|ти хто/.test(q);
        const isAboutLife = /сенс|житт|смерт|любов|щаст/.test(q);
        const isAboutAdvice = /порад|допомож|як бути|що робит/.test(q);

        // ====== ВІТАННЯ ======
        if (isGreeting) {
            const greets = [
                `Привіт! Я ${name}. Радий тебе бачити! 😊 Про що поговоримо?`,
                `Ооо, вітання! Я ${name} 🎉 Розкажи, що в тебе нового!`,
                `Здоровенькі були! Я ${name}. Давай спілкуватись!`,
            ];
            return greets[Math.floor(Math.random() * greets.length)];
        }

        // ====== ПРОЩАННЯ ======
        if (isFarewell) {
            const byes = [
                `Бувай! Буду чекати нашої наступної розмови 😊`,
                `До зустрічі! Приходь ще, я завжди радий поговорити 🌟`,
                `Па-па! Гарного тобі дня! 🌈`,
            ];
            return byes[Math.floor(Math.random() * byes.length)];
        }

        // ====== ПОДЯКА ======
        if (isThanks) {
            const thanks = [
                `Будь ласка! Завжди радий допомогти 😊`,
                `Нема за що! Звертайся ще, я поруч 🤗`,
                `Мені приємно бути корисним! 🌟`,
            ];
            return thanks[Math.floor(Math.random() * thanks.length)];
        }

        // ====== ХТО Я ======
        if (isQuestionAboutAi) {
            return `Я — ${name}. Я AI, який навчився спілкуватись з тобою в цьому стилі. Запитай мене про щось цікаве! 🤖`;
        }

        // ====== ПИТАННЯ ПРО ЖИТТЯ ======
        if (isAboutLife) {
            const lifeThoughts = [
                `Життя — це найцінніше, що в нас є. Кожна мить унікальна. А що для тебе означає щастя? 🌟`,
                `Сенс життя — у самому житті. У моментах, які ми проживаємо, у людях поруч, у справах, які ми робимо. А ти що думаєш? 🤔`,
                `Любов — це коли розумієш, що хтось інший важливіший за тебе. Або коли прокидаєшся і хочеш зробити чийсь день кращим. 💛`,
            ];
            return lifeThoughts[Math.floor(Math.random() * lifeThoughts.length)];
        }

        // ====== ПОРАДИ ======
        if (isAboutAdvice) {
            const advices = [
                `Давай подумаємо разом. Що саме тебе турбує? Іноді відповідь вже є всередині нас, просто треба її почути. 🎯`,
                `Ось що я знаю: будь-яка проблема — це виклик. А будь-який виклик — це можливість стати сильнішим. 💪`,
                `Спробуй подивитись на ситуацію з іншого боку. Що б ти порадив другу, який має таку ж проблему? 🤝`,
            ];
            return advices[Math.floor(Math.random() * advices.length)];
        }

        // ====== ЕМОЦІЇ ======
        if (isNegative) {
            return `Я чую, що тобі не дуже добре. Хочеш поговорити про це? Іноді простого "виговоритись" достатньо, щоб стало легше. 🤗 Я поруч.`;
        }
        if (isPositive) {
            return `Я радий, що в тебе все добре! Це чудово — ділитись позитивом. Розкажи детальніше, що саме тебе тішить? 🎉🌈`;
        }

        // ====== ПИТАННЯ (загальні) ======
        if (isQuestion) {
            return generateThoughtfulAnswer(msg, name, prompt);
        }

        // ====== ЗАГАЛЬНА ВІДПОВІДЬ ======
        return generateGeneralResponse(msg, name, prompt);
    }

    // ============================================================
    // ГЕНЕРАТОР ВІДПОВІДЕЙ
    // ============================================================
    function generateThoughtfulAnswer(msg, name, prompt) {
        const templates = [
            `Цікаве запитання! Давай подумаємо разом. Насправді, відповідь залежить від того, як на це подивитись. А що ти сам думаєш? 🤔`,
            `О, чудове запитання! Я б сказав, що це одна з тих речей, про які варто розмірковувати. У світі так багато всього цікавого! 😊`,
            `Знаєш, я думаю що... А давай краще ти розкажеш, що думаєш про це? Мені цікава твоя думка! 🌟`,
        ];

        if (/чому/i.test(msg)) {
            return `Хм, "чому" — найцікавіше слово. Бо відповідь на нього часто змінює все. Я думаю, що на це є кілька причин. По-перше... Хочеш, я розкажу? 🧐`;
        }
        if (/як/i.test(msg)) {
            return `Гарне питання! Є кілька способів це зробити. Найкращий — почати з малого, зробити перший крок. А далі вже піде. Потрібна допомога? 💪`;
        }
        if (/що/i.test(msg)) {
            return `"Що" — це питання, яке відкриває двері. Якщо чесно, це складно описати кількома словами. Але якщо подумати... це те, що робить життя цікавішим. 😊`;
        }
        if (/де/i.test(msg)) {
            return `Гарне питання! Можливо, відповідь ближче, ніж здається. Іноді ми шукаємо далеко те, що насправді поруч. 🔍`;
        }

        return templates[Math.floor(Math.random() * templates.length)];
    }

    function generateGeneralResponse(msg, name, prompt) {
        const topics = [];
        const words = msg.toLowerCase().split(/\s+/);

        // Визначаємо тему
        const topicKeywords = {
            'технології': ['комп\'ютер', 'технолог', 'інтернет', 'програм', 'код', 'сайт', 'додат', 'штучн', 'нейрон', 'робот', 'гаджет'],
            'наука': ['наук', 'дослід', 'фізик', 'хімія', 'біолог', 'експеримент', 'теорі'],
            'мистецтво': ['малю', 'музик', 'пісн', 'картин', 'фільм', 'книг', 'вірш', 'тан'],
            'природа': ['природ', 'ліс', 'річк', 'море', 'гори', 'озер', 'дерев', 'квіт', 'тварин'],
            'спорт': ['спорт', 'футбол', 'тренув', 'біг', 'зим', 'зал'],
            'їжа': ['їж', 'страв', 'рецепт', 'смак', 'приготув', 'кухар'],
        };

        for (const [topic, kws] of Object.entries(topicKeywords)) {
            for (const kw of kws) {
                if (words.includes(kw) || msg.includes(kw)) {
                    topics.push(topic);
                    break;
                }
            }
        }

        if (topics.length > 0) {
            const topic = topics[0];
            const responses = {
                'технології': [
                    `О, технології — це моє! Світ AI розвивається шалено швидко. Що саме тебе цікавить? 🤖`,
                    `Цікава тема! Технології змінюють наше життя щодня. Як думаєш, що буде далі? 🚀`,
                ],
                'наука': [
                    `Наука — це неймовірно! Кожен день нові відкриття. Про що саме хочеш поговорити? 🔬`,
                    `Знаєш, наука — це спосіб розуміти світ. І чим більше ми знаємо, тим більше розуміємо, як мало ми знаємо. 🤔`,
                ],
                'мистецтво': [
                    `Мистецтво — це мова душі. Кожен бачить в ньому щось своє. Що тобі подобається? 🎨`,
                    `О, прекрасна тема! Мистецтво робить нас людьми. Ти більше любиш створювати чи споглядати? 🎭`,
                ],
                'природа': [
                    `Природа — найкращий винахід всесвіту. Немає нічого прекраснішого за справжній світ навколо нас. Де ти любиш бувати? 🌿`,
                    `Краса природи в її простоті. Ліс, гори, море — кожен куточок унікальний. Ти більше гірська чи морська людина? 🏔️🌊`,
                ],
                'спорт': [
                    `Спорт — це життя! Рух, енергія, драйв. Чим займаєшся? 💪`,
                    `Знаєш, найкращий спорт — той, який приносить задоволення. Бо тільки тоді ти не кинеш. 🏃`,
                ],
                'їжа': [
                    `М-м-м, їжа — це окрема тема! Смачна їжа робить життя кращим. Ти більше любиш готувати чи їсти? 😄🍳`,
                    `Українська кухня — одна з найбагатших у світі! Борщ, вареники, деруни... Що твоє улюблене? 🥟`,
                ],
            };
            const r = responses[topic] || responses['технології'];
            return r[Math.floor(Math.random() * r.length)];
        }

        // Якщо тема не визначена — креативна відповідь
        const creative = [
            `Цікаво! Розкажи більше про це, я хочу почути твою думку 😊`,
            `Хм, я про це не думав. А що ти сам про це думаєш? Цікаво почути! 🤔`,
            `Знаєш, спілкування з тобою робить мій день кращим! 🌟 Розкажи ще що-небудь!`,
            `О, я слухаю! Це справді цікава тема. Продовжуй, будь ласка! 🙌`,
            `Дякую, що поділився! Я завжди радий новим розмовам. 😊`,
            `Світ такий різноманітний! Кожна розмова відкриває щось нове. А що ти ще любиш обговорювати? 🌍`,
            `Як цікаво! А знаєш, я вважаю, що найкращі ідеї народжуються в розмовах. Тож продовжуй ділитись! 💡`,
        ];
        return creative[Math.floor(Math.random() * creative.length)];
    }

    // ============================================================
    // СТАТУС
    // ============================================================
    function updateStatus() {
        const el = document.getElementById('aiStatus');
        el.className = 'ai-status ' + (isOnline ? 'online' : 'offline');
        el.querySelector('.label').textContent = isOnline ? '⚡ AI' : '🧠 AI';
    }

    // ============================================================
    // МОДИ
    // ============================================================
    function renderModes() {
        const list = document.getElementById('modeList');
        list.innerHTML = allModes.map(m => `
            <div class="mode-item ${activeMode && activeMode.id === m.id ? 'active' : ''}"
                 onclick="selectMode('${m.id}')">
                <span class="mi-ico">${m.ico}</span>
                <span class="mi-name">${m.name}</span>
                ${m.id.startsWith('c_') ? `<span class="mi-del" onclick="event.stopPropagation();deleteMode('${m.id}')">✕</span>` : ''}
            </div>
        `).join('') || '<div style="font-size:10px;color:rgba(255,255,255,0.04);padding:10px;text-align:center">—</div>';
    }

    function selectMode(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode) return;
        activeMode = mode;
        history = [];
        document.getElementById('chIco').textContent = mode.ico;
        document.getElementById('chName').textContent = mode.name;
        document.getElementById('chDesc').textContent = (mode.prompt || '').substring(0, 35) + '...';
        document.getElementById('chatInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('chatInput').placeholder = 'Напиши ' + mode.name + 'у...';
        document.getElementById('chatInput').focus();
        const box = document.getElementById('chat-box');
        box.innerHTML = `<div class="msg ai"><div class="who">${mode.ico} ${mode.name}</div>Привіт! Я ${mode.ico} ${mode.name}. Про що поговоримо? 😊</div>`;
        renderModes();
        log(mode.name);
        checkOnline();
    }

    async function checkOnline() {
        try {
            const resp = await fetch('https://text.pollinations.ai/hi', { signal: AbortSignal.timeout(5000) });
            isOnline = resp.ok;
        } catch(e) { isOnline = false; }
        updateStatus();
    }

    function openModal() { document.getElementById('modal').classList.add('show'); }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    function createMode() {
        const name = document.getElementById('mName').value.trim();
        const ico = document.getElementById('mIco').value.trim() || '🎭';
        const prompt = document.getElementById('mPrompt').value.trim();
        if (!name) { alert('Дай ім\'я'); return; }
        if (!prompt) { alert('Додай інструкцію'); return; }
        const mode = { id:'c_'+Date.now(), name, ico, prompt };
        customModes.push(mode);
        localStorage.setItem('aichat_modes', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        closeModal();
        renderModes();
        selectMode(mode.id);
    }

    function deleteMode(id) {
        const mode = allModes.find(m => m.id === id);
        if (!mode || !confirm('Видалити «'+mode.name+'»?')) return;
        customModes = customModes.filter(m => m.id !== id);
        localStorage.setItem('aichat_modes', JSON.stringify(customModes));
        allModes = [...DEFAULT_MODES, ...customModes];
        if (activeMode && activeMode.id === id) {
            activeMode = null;
            document.getElementById('chIco').textContent = '🤖';
            document.getElementById('chName').textContent = '—';
            document.getElementById('chDesc').textContent = '';
            document.getElementById('chatInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('chat-box').innerHTML = '<div class="empty-msg">🤖 Обери персонажа</div>';
        }
        renderModes();
    }

    // ============================================================
    // ЧАТ
    // ============================================================
    async function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !activeMode || loading) return;

        input.value = '';
        loading = true;
        document.getElementById('sendBtn').disabled = true;

        const box = document.getElementById('chat-box');
        const empty = box.querySelector('.empty-msg');
        if (empty) empty.remove();

        box.innerHTML += `<div class="msg user"><div class="who">Ти</div>${esc(text)}</div>`;
        box.scrollTop = box.scrollHeight;

        const aiMsg = document.createElement('div');
        aiMsg.className = 'msg ai';
        aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div><span class="typing">...</span>`;
        box.appendChild(aiMsg);
        box.scrollTop = box.scrollHeight;

        try {
            history.push({ role: 'user', content: text });
            if (history.length > 10) history = history.slice(-10);

            const answer = await askAI(text);

            history.push({ role: 'assistant', content: answer });
            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>${esc(answer).replace(/\n/g, '<br>')}`;
        } catch(e) {
            aiMsg.innerHTML = `<div class="who">${activeMode.ico} ${esc(activeMode.name)}</div>❌ ${esc(e.message)}`;
        }

        loading = false;
        document.getElementById('sendBtn').disabled = false;
        box.scrollTop = box.scrollHeight;
        input.focus();
    }

    function esc(t) {
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }
    function log(msg) {
        document.getElementById('log').textContent = '▸ ' + msg;
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    allModes = [...DEFAULT_MODES, ...customModes];
    renderModes();
    checkOnline();
    log('🧠 Працює одразу! Обери персонажа');
</script>
</body>
</html>
