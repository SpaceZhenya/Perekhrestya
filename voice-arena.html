<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Arena — прототип</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a12;
            color: #e0d5c0;
            font-family: 'Courier New', monospace;
        }
        #startScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,10,18,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
        }
        #startScreen h1 {
            font-size: 3em;
            letter-spacing: 0.2em;
            font-weight: normal;
            margin-bottom: 0.2em;
        }
        #startScreen p {
            opacity: 0.6;
            margin: 0.3em 0;
        }
        #startScreen .key {
            margin-top: 1.5em;
            padding: 12px 40px;
            border: 1px solid rgba(224,213,192,0.3);
            border-radius: 6px;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        #startScreen .key:hover {
            background: rgba(224,213,192,0.1);
            border-color: rgba(224,213,192,0.6);
        }
        #canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        #hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(224,213,192,0.15);
            border-radius: 10px;
            padding: 12px 24px;
            display: none;
            align-items: center;
            gap: 24px;
            z-index: 5;
            backdrop-filter: blur(4px);
        }
        #hud.visible { display: flex; }
        .hud-item {
            text-align: center;
        }
        .hud-item .label {
            font-size: 0.6em;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .hud-item .value {
            font-size: 1.4em;
            font-weight: bold;
        }
        .hud-item .value.attack { color: #ff6644; }
        .hud-item .value.stealth { color: #6688cc; }
        .hud-item .value.shield { color: #44dd88; }
        .hud-item .value.idle { color: #888; }

        #waveform {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            height: 60px;
            display: none;
            z-index: 5;
        }
        #waveform.visible { display: block; }
        #gestureLabel {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5em;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 30px currentColor;
        }
        #gestureLabel.visible { opacity: 1; }
        #gestureLabel.attack { color: #ff6644; }
        #gestureLabel.stealth { color: #6688cc; }
        #gestureLabel.shield { color: #44dd88; }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>🎙️ VOICE ARENA</h1>
        <p>Керуй грою голосом</p>
        <p style="font-size:0.8em; opacity:0.4; margin-top:1em;">🔊 Крик → атака • 🤫 Тиша → невидимка • 🎵 Спів → щит</p>
        <div class="key">🚀 Почати бій</div>
    </div>

    <canvas id="canvas"></canvas>

    <canvas id="waveform"></canvas>

    <div id="gestureLabel">🔥</div>

    <div id="hud">
        <div class="hud-item">
            <div class="label">Гучність</div>
            <div class="value idle" id="volDisplay">0%</div>
        </div>
        <div class="hud-item">
            <div class="label">Частота</div>
            <div class="value idle" id="freqDisplay">0 Hz</div>
        </div>
        <div class="hud-item">
            <div class="label">Жест</div>
            <div class="value idle" id="gestureDisplay">—</div>
        </div>
    </div>

    <script>
        // ============================================================
        // ЕТАП 1 — Мікрофон + аналіз звуку
        // ============================================================

        let audioCtx, analyser, micStream;
        let dataArray, bufferLength;
        let isRunning = false;

        const volDisplay = document.getElementById('volDisplay');
        const freqDisplay = document.getElementById('freqDisplay');
        const gestureDisplay = document.getElementById('gestureDisplay');
        const gestureLabel = document.getElementById('gestureLabel');
        const hud = document.getElementById('hud');
        const startScreen = document.getElementById('startScreen');
        const waveformCanvas = document.getElementById('waveform');
        const wfCtx = waveformCanvas.getContext('2d');

        // --- Canvas для візуалізації ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            waveformCanvas.width = waveformCanvas.clientWidth || 600;
            waveformCanvas.height = waveformCanvas.clientHeight || 60;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Стан ---
        let currentGesture = 'idle';
        let smoothedVolume = 0;
        let smoothedPitch = 0;

        // --- Запуск мікрофона ---
        async function startMic() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                startScreen.style.display = 'none';
                canvas.style.pointerEvents = 'auto';
                hud.classList.add('visible');
                waveformCanvas.classList.add('visible');
                isRunning = true;
                analyze();
                draw();
            } catch (err) {
                alert('Потрібен доступ до мікрофона! Дозволь у браузері.');
                console.error(err);
            }
        }

        startScreen.addEventListener('click', startMic);

        // --- Аналіз звуку ---
        function analyze() {
            if (!isRunning) return;
            analyser.getByteTimeDomainData(dataArray);

            // Гучність (RMS)
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
                const val = (dataArray[i] - 128) / 128;
                sum += val * val;
            }
            const rms = Math.sqrt(sum / bufferLength);
            smoothedVolume += (rms - smoothedVolume) * 0.3;
            const volumePercent = Math.min(100, Math.round(smoothedVolume * 200));

            // Частота (пік в спектрі)
            analyser.getByteFrequencyData(dataArray);
            let maxVal = 0;
            let maxIdx = 0;
            for (let i = 0; i < bufferLength; i++) {
                if (dataArray[i] > maxVal) {
                    maxVal = dataArray[i];
                    maxIdx = i;
                }
            }
            const pitch = maxVal > 30 ? (maxIdx * audioCtx.sampleRate / 2 / bufferLength) : 0;
            smoothedPitch += (pitch - smoothedPitch) * 0.3;

            // Класифікація жесту
            let gesture = 'idle';
            if (volumePercent > 65 && smoothedPitch < 300) {
                gesture = 'attack';
            } else if (volumePercent > 50 && smoothedPitch > 600) {
                gesture = 'shield';
            } else if (volumePercent < 15) {
                gesture = 'stealth';
            }
            currentGesture = gesture;

            // Оновлення HUD
            volDisplay.textContent = volumePercent + '%';
            volDisplay.className = 'value ' + gesture;
            freqDisplay.textContent = Math.round(smoothedPitch) + ' Hz';
            freqDisplay.className = 'value ' + gesture;

            const gestureNames = { attack: '🔥 Крик', shield: '🎵 Спів', stealth: '🤫 Тиша', idle: '—' };
            gestureDisplay.textContent = gestureNames[gesture];
            gestureDisplay.className = 'value ' + gesture;

            // Гecтyра-лейбл
            gestureLabel.textContent = gesture === 'attack' ? '🔥' : gesture === 'shield' ? '🛡️' : gesture === 'stealth' ? '👻' : '';
            gestureLabel.className = gesture !== 'idle' ? 'visible ' + gesture : '';

            requestAnimationFrame(analyze);
        }

        // --- Візуалізація ---
        function draw() {
            if (!isRunning) return;

            // Очистка
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Арена
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            // Коло арени
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(224,213,192,0.15)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Внутрішнє коло
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.6, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(224,213,192,0.08)';
            ctx.stroke();

            // Візуалізація гучності (пульсуюче коло)
            const pulseRadius = 20 + smoothedVolume * 80;
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulseRadius);
            if (currentGesture === 'attack') {
                gradient.addColorStop(0, 'rgba(255,70,40,0.3)');
                gradient.addColorStop(1, 'rgba(255,70,40,0)');
            } else if (currentGesture === 'shield') {
                gradient.addColorStop(0, 'rgba(68,221,136,0.3)');
                gradient.addColorStop(1, 'rgba(68,221,136,0)');
            } else if (currentGesture === 'stealth') {
                gradient.addColorStop(0, 'rgba(80,120,200,0.2)');
                gradient.addColorStop(1, 'rgba(80,120,200,0)');
            } else {
                gradient.addColorStop(0, 'rgba(224,213,192,0.1)');
                gradient.addColorStop(1, 'rgba(224,213,192,0)');
            }
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy, pulseRadius, 0, Math.PI * 2);
            ctx.fill();

            // Персонаж (центр)
            ctx.fillStyle = currentGesture === 'attack' ? '#ff6644' :
                           currentGesture === 'shield' ? '#44dd88' :
                           currentGesture === 'stealth' ? '#6688cc' : '#e0d5c0';
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.fill();

            // Індикатор стану
            const statusText = currentGesture === 'attack' ? '⚔️ АТАКА' :
                              currentGesture === 'shield' ? '🛡️ ЩИТ' :
                              currentGesture === 'stealth' ? '👻 НЕВИДИМКА' : '';
            if (statusText) {
                ctx.fillStyle = 'rgba(224,213,192,0.5)';
                ctx.font = '14px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(statusText, cx, cy + 40);
            }

            // --- Waveform ---
            if (analyser) {
                const w = waveformCanvas.width;
                const h = waveformCanvas.height;
                wfCtx.fillStyle = 'rgba(10,10,18,0.4)';
                wfCtx.fillRect(0, 0, w, h);

                analyser.getByteTimeDomainData(dataArray);

                wfCtx.lineWidth = 2;
                wfCtx.strokeStyle = currentGesture === 'attack' ? '#ff6644' :
                                    currentGesture === 'shield' ? '#44dd88' :
                                    currentGesture === 'stealth' ? '#6688cc' : 'rgba(224,213,192,0.5)';
                wfCtx.beginPath();

                const sliceWidth = w / bufferLength;
                let x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * h / 2;
                    if (i === 0) wfCtx.moveTo(x, y);
                    else wfCtx.lineTo(x, y);
                    x += sliceWidth;
                }
                wfCtx.stroke();

                // Лінія центру
                wfCtx.strokeStyle = 'rgba(224,213,192,0.1)';
                wfCtx.lineWidth = 1;
                wfCtx.beginPath();
                wfCtx.moveTo(0, h/2);
                wfCtx.lineTo(w, h/2);
                wfCtx.stroke();
            }

            requestAnimationFrame(draw);
        }

        // Початковий рендер
        draw();
    </script>
</body>
</html>
