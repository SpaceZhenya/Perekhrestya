<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Company — мульти-агентна розробка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06080a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            color: #d0d0d0;
            height: 100vh;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        /* ========== САЙДБАР (компанія) ========== */
        #sidebar {
            width: 260px;
            background: #0a0e12;
            border-right: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }
        #sidebar .header {
            padding: 20px 16px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        #sidebar .header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        #sidebar .header .status {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #sidebar .header .status .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #44cc66;
            display: inline-block;
        }

        #org-chart {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }
        .org-node {
            margin-bottom: 6px;
            position: relative;
        }
        .org-node .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .org-node .card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.1);
        }
        .org-node .card.active {
            border-color: rgba(100,150,255,0.3);
            background: rgba(100,150,255,0.04);
        }
        .org-node .card .name {
            font-size: 13px;
            font-weight: 500;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .org-node .card .name .avatar {
            width: 24px; height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .org-node .card .role {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
            padding-left: 32px;
        }
        .org-node .card .status-badge {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.25);
        }
        .org-node .card .status-badge.working { background: rgba(68,204,102,0.12); color: #44cc66; }
        .org-node .card .status-badge.done { background: rgba(100,150,255,0.1); color: #6699ff; }

        .org-line {
            width: 1px;
            height: 10px;
            background: rgba(255,255,255,0.08);
            margin-left: 20px;
        }

        .org-node.children {
            padding-left: 24px;
            margin-top: 0;
        }

        /* ========== ОСНОВНА ЗОНА ========== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #chat .empty {
            text-align: center;
            color: rgba(255,255,255,0.15);
            margin-top: 80px;
            font-size: 14px;
            line-height: 1.8;
        }
        #chat .empty .icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
        #chat .empty .hint { font-size: 12px; opacity: 0.5; margin-top: 4px; }

        .msg {
            display: flex;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.15s;
            max-width: 800px;
            animation: msgIn 0.3s ease-out;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg:hover { background: rgba(255,255,255,0.02); }
        .msg .msg-avatar {
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .msg .msg-body { flex: 1; min-width: 0; }
        .msg .msg-body .msg-header {
            display: flex; align-items: baseline; gap: 8px;
            margin-bottom: 2px;
        }
        .msg .msg-body .msg-header .msg-name {
            font-size: 12px; font-weight: 600; color: #ccc;
        }
        .msg .msg-body .msg-header .msg-role {
            font-size: 10px; color: rgba(255,255,255,0.2);
        }
        .msg .msg-body .msg-header .msg-time {
            font-size: 10px; color: rgba(255,255,255,0.15);
            margin-left: auto;
        }
        .msg .msg-body .msg-text {
            font-size: 13px;
            line-height: 1.5;
            color: rgba(255,255,255,0.75);
            white-space: pre-wrap;
        }
        .msg .msg-body .msg-text .typing {
            display: inline-block;
            animation: blink 0.8s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .msg.system .msg-text {
            color: rgba(255,255,255,0.3);
            font-style: italic;
            font-size: 12px;
        }
        .msg.system { padding: 4px 12px; }

        .msg.code-block {
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            padding: 12px 16px;
            margin: 4px 0;
        }
        .msg.code-block .msg-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }

        /* Input */
        #input-area {
            padding: 14px 24px 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            background: #080c10;
        }
        #input-row {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 4px;
        }
        #input-row:focus-within {
            border-color: rgba(100,150,255,0.3);
            background: rgba(255,255,255,0.06);
        }
        #input-row input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            padding: 10px 14px;
            font-size: 14px;
            color: #e0e0e0;
            font-family: inherit;
        }
        #input-row input::placeholder { color: rgba(255,255,255,0.2); }
        #input-row button {
            background: rgba(100,150,255,0.15);
            border: none;
            color: #88aaff;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        #input-row button:hover { background: rgba(100,150,255,0.25); }
        #input-row button:disabled { opacity: 0.3; cursor: not-allowed; }

        #clear-btn {
            position: absolute;
            right: 16px;
            top: 16px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.15);
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 4px;
        }
        #clear-btn:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.3); }

        /* Скрол */
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 3px; }
        #chat::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.1); }

        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
    </style>
</head>
<body>

<div id="app">
    <!-- Сайдбар -->
    <div id="sidebar">
        <div class="header">
            <h1>🏢 AI Company</h1>
            <div class="status"><span class="dot"></span> Працює</div>
        </div>
        <div id="org-chart">
            <!-- генерится JS -->
        </div>
    </div>

    <!-- Основна частина -->
    <div id="main">
        <div id="chat">
            <div class="empty">
                <div class="icon">🏢</div>
                <div>AI Company готова до роботи</div>
                <div class="hint">Напиши задачу — агенти розподілять і зроблять</div>
            </div>
        </div>
        <div id="input-area">
            <div id="input-row">
                <input id="taskInput" type="text" placeholder="Наприклад: зроби Todo App з React" autofocus>
                <button id="sendBtn">→ Відправити</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // ДАНІ КОМПАНІЇ
    // ============================================================
    const AGENTS = [
        { id: 'ceo',        name: 'Олексій',  role: 'CEO',         avatar: '🧑‍💼', color: '#ff6644', level: 0 },
        { id: 'techlead',   name: 'Марія',    role: 'Tech Lead',   avatar: '👩‍🔬', color: '#44aaff', level: 1 },
        { id: 'backend',    name: 'Дмитро',   role: 'Backend',     avatar: '👨‍💻', color: '#44dd88', level: 2 },
        { id: 'frontend',   name: 'Анна',     role: 'Frontend',    avatar: '👩‍🎨', color: '#cc66ff', level: 2 },
        { id: 'designer',   name: 'Катя',     role: 'Designer',    avatar: '🎨',   color: '#ffaa44', level: 2 },
        { id: 'qa',         name: 'Іван',     role: 'QA',          avatar: '🧪',   color: '#44ddcc', level: 2 },
        { id: 'devops',     name: 'Павло',    role: 'DevOps',      avatar: '🔧',   color: '#ff6688', level: 2 },
    ];

    const AGENT_MAP = {};
    AGENTS.forEach(a => AGENT_MAP[a.id] = a);

    // ============================================================
    // СТАН
    // ============================================================
    let isWorking = false;
    let messageCount = 0;

    // ============================================================
    // РЕНДЕР ОРГАНІЗАЦІЙНОЇ СТРУКТУРИ
    // ============================================================
    function renderOrg() {
        const container = document.getElementById('org-chart');
        container.innerHTML = '';
        AGENTS.forEach((agent, i) => {
            const node = document.createElement('div');
            node.className = 'org-node';
            node.id = 'org-' + agent.id;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="name">
                    <span class="avatar" style="background:${agent.color}22;color:${agent.color}">${agent.avatar}</span>
                    ${agent.name}
                </div>
                <div class="role">${agent.role}</div>
                <div class="status-badge" id="badge-${agent.id}">⏳</div>
            `;
            card.addEventListener('click', () => {
                filterByAgent(agent.id);
            });
            node.appendChild(card);

            if (i < AGENTS.length - 1 && agent.level < AGENTS[i+1].level) {
                // Дочірній рівень — лінія + відступ
                for (let j = i + 1; j < AGENTS.length; j++) {
                    if (AGENTS[j].level <= agent.level) break;
                    const line = document.createElement('div');
                    line.className = 'org-line';
                    node.appendChild(line);
                }
            }

            container.appendChild(node);
        });
    }

    function setAgentStatus(agentId, status) {
        const badge = document.getElementById('badge-' + agentId);
        if (!badge) return;
        const statuses = {
            'idle': '⏳',
            'working': '🔄',
            'done': '✅',
            'thinking': '🤔',
        };
        badge.textContent = statuses[status] || '⏳';
        badge.className = 'status-badge' + (status === 'working' ? ' working' : status === 'done' ? ' done' : '');
    }

    // ============================================================
    // ЧАТ
    // ============================================================
    const chatEl = document.getElementById('chat');
    const input = document.getElementById('taskInput');
    const sendBtn = document.getElementById('sendBtn');
    let filterAgent = null;

    function filterByAgent(agentId) {
        filterAgent = filterAgent === agentId ? null : agentId;
        document.querySelectorAll('.org-node .card').forEach(c => c.classList.remove('active'));
        if (filterAgent) {
            const card = document.querySelector(`#org-${filterAgent} .card`);
            if (card) card.classList.add('active');
        }
        // Show/hide messages
        document.querySelectorAll('.msg').forEach(m => {
            if (!filterAgent) { m.style.display = 'flex'; return; }
            m.style.display = m.dataset.agent === filterAgent ? 'flex' : 'none';
        });
    }

    function addMessage(agentId, text, type = 'normal') {
        if (document.querySelector('.empty')) {
            document.querySelector('.empty').remove();
        }

        const agent = AGENT_MAP[agentId];
        const msg = document.createElement('div');
        msg.className = 'msg' + (type === 'system' ? ' system' : '') + (type === 'code' ? ' code-block' : '');
        msg.dataset.agent = agentId || 'system';

        const time = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });

        if (type === 'system') {
            msg.innerHTML = `<div class="msg-body"><div class="msg-text">${text}</div></div>`;
        } else if (agent) {
            const avatarColor = agent.color;
            msg.innerHTML = `
                <div class="msg-avatar" style="background:${avatarColor}22;color:${avatarColor}">${agent.avatar}</div>
                <div class="msg-body">
                    <div class="msg-header">
                        <span class="msg-name">${agent.name}</span>
                        <span class="msg-role">${agent.role}</span>
                        <span class="msg-time">${time}</span>
                    </div>
                    <div class="msg-text">${text}</div>
                </div>
            `;
        }

        chatEl.appendChild(msg);
        chatEl.scrollTop = chatEl.scrollHeight;
        messageCount++;

        if (filterAgent && filterAgent !== agentId) {
            msg.style.display = 'none';
        }

        return msg;
    }

    function addTypingMessage(agentId) {
        const msg = addMessage(agentId, '<span class="typing">...</span>');
        return msg;
    }

    function updateMessageText(msgEl, text) {
        const textEl = msgEl.querySelector('.msg-text');
        if (textEl) textEl.innerHTML = text;
    }

    function addCodeBlock(lang, code) {
        const msg = document.createElement('div');
        msg.className = 'msg code-block';
        msg.dataset.agent = 'system';
        msg.innerHTML = `<div class="msg-body"><div class="msg-text"><span style="color:rgba(255,255,255,0.2);font-size:10px;text-transform:uppercase;letter-spacing:0.1em">${lang}</span>\n${code}</div></div>`;
        chatEl.appendChild(msg);
        chatEl.scrollTop = chatEl.scrollHeight;
    }

    function clearChat() {
        chatEl.innerHTML = `
            <div class="empty">
                <div class="icon">🏢</div>
                <div>AI Company готова до роботи</div>
                <div class="hint">Напиши задачу — агенти розподілять і зроблять</div>
            </div>
        `;
        messageCount = 0;
        document.querySelectorAll('.org-node .card').forEach(c => c.classList.remove('active'));
        filterAgent = null;
        AGENTS.forEach(a => setAgentStatus(a.id, 'idle'));
    }

    // ============================================================
    // СИМУЛЯЦІЯ РОБОТИ КОМПАНІЇ
    // ============================================================
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function runCompany(task) {
        if (isWorking) return;
        isWorking = true;
        sendBtn.disabled = true;
        input.disabled = true;

        addMessage('system', `📋 Нова задача: "${task}"`);

        // 1. CEO аналізує
        setAgentStatus('ceo', 'working');
        const ceoMsg = addTypingMessage('ceo');
        await sleep(800);
        updateMessageText(ceoMsg, `Аналізую задачу: "${task}". Потрібно: планування архітектури, бекенд, фронтенд, дизайн, тестування. Передаю Tech Lead.`);
        setAgentStatus('ceo', 'done');
        await sleep(400);

        // 2. Tech Lead планує
        setAgentStatus('techlead', 'working');
        const tlMsg = addTypingMessage('techlead');
        await sleep(1000);
        updateMessageText(tlMsg, `Створюю план:
• Backend: API + база даних (Express + SQLite)
• Frontend: React + компоненти
• Design: UI Kit + кольори
• QA: тест-кейси
• DevOps: деплой`);
        setAgentStatus('techlead', 'done');
        await sleep(500);

        // 3. Designer
        setAgentStatus('designer', 'working');
        const dsMsg = addTypingMessage('designer');
        await sleep(900);
        updateMessageText(dsMsg, `Дизайн-система:
• Палітра: #6366f1, #22c55e, #f59e0b
• Шрифт: Inter, 14-16px
• Компоненти: Card, Button, Input, Modal
• Стани: empty, loading, error, success`);
        setAgentStatus('designer', 'done');
        await sleep(400);

        // 4. Backend
        setAgentStatus('backend', 'working');
        const beMsg = addTypingMessage('backend');
        await sleep(1200);
        updateMessageText(beMsg, `Створю API:
• GET /api/tasks — список
• POST /api/tasks — створити
• PUT /api/tasks/:id — оновити
• DELETE /api/tasks/:id — видалити
• SQLite для зберігання`);
        addCodeBlock('javascript', `// server.js
const express = require('express');
const cors = require('cors');
const app = express();
app.use(cors(), express.json());

const tasks = [];
app.get('/api/tasks', (req, res) => res.json(tasks));
app.post('/api/tasks', (req, res) => {
    const task = { id: Date.now(), ...req.body, done: false };
    tasks.push(task);
    res.json(task);
});
app.listen(3001);`);
        setAgentStatus('backend', 'done');
        await sleep(600);

        // 5. Frontend
        setAgentStatus('frontend', 'working');
        const feMsg = addTypingMessage('frontend');
        await sleep(1300);
        updateMessageText(feMsg, `Реалізую UI:
• Компонент TaskList — відображення списку
• Компонент TaskForm — додавання
• Компонент TaskItem — редагування/видалення
• Стан: завантаження, порожньо, помилка`);
        addCodeBlock('jsx', `// App.jsx
function App() {
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    fetch('/api/tasks')
      .then(r => r.json())
      .then(setTasks)
      .finally(() => setLoading(false));
  }, []);

  const addTask = async (title) => {
    const res = await fetch('/api/tasks', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ title })
    });
    setTasks([...tasks, await res.json()]);
  };

  return (
    <div className="app">
      <h1>📋 Todo App</h1>
      <TaskForm onSubmit={addTask} />
      {loading ? <Spinner /> : <TaskList tasks={tasks} />}
    </div>
  );
}`);
        setAgentStatus('frontend', 'done');
        await sleep(500);

        // 6. QA
        setAgentStatus('qa', 'working');
        const qaMsg = addTypingMessage('qa');
        await sleep(700);
        updateMessageText(qaMsg, `Тест-кейси:
1. Створення задачі — OK
2. Відображення списку — OK
3. Порожній список — OK
4. Видалення задачі — OK
5. Помилка сервера — OK (тост)
Усі тести пройдено ✅`);
        setAgentStatus('qa', 'done');
        await sleep(400);

        // 7. DevOps
        setAgentStatus('devops', 'working');
        const devopsMsg = addTypingMessage('devops');
        await sleep(600);
        updateMessageText(devopsMsg, `Деплой:
• Dockerfile + docker-compose
• Vercel (frontend) + Railway (backend)
• Healthcheck endpoint
• CI: GitHub Actions`);
        addCodeBlock('yaml', `# docker-compose.yml
version: '3'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data`);
        setAgentStatus('devops', 'done');
        await sleep(300);

        // Фінал — CEO підбиває підсумок
        setAgentStatus('ceo', 'working');
        const finalMsg = addTypingMessage('ceo');
        await sleep(600);
        updateMessageText(finalMsg, `✅ Задача виконана! Todo App готовий:

📦 Backend: Express + SQLite — порт 3001
🎨 Frontend: React + дизайн-система — порт 3000
🧪 QA: 5/5 тестів пройдено
🚀 DevOps: Docker + CI готовий

Час виконання: ~8 секунд`);
        setAgentStatus('ceo', 'done');

        addMessage('system', '🏁 Команда завершила роботу. Готові до наступної задачі.');

        isWorking = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
    }

    // ============================================================
    // ВІДПРАВЛЕННЯ
    // ============================================================
    async function handleSubmit() {
        const task = input.value.trim();
        if (!task || isWorking) return;
        input.value = '';
        await runCompany(task);
    }

    sendBtn.addEventListener('click', handleSubmit);
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSubmit();
    });

    // ============================================================
    // ІНІЦІАЛІЗАЦІЯ
    // ============================================================
    renderOrg();
    AGENTS.forEach(a => setAgentStatus(a.id, 'idle'));

    console.log('✅ AI Company завантажено');
    console.log('👥 Агенти:', AGENTS.map(a => a.name + ' (' + a.role + ')').join(', '));
</script>
</body>
</html>
