<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіні — реалістичний шутер</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body { background:#020304; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        #wrap {
            position:relative; width:800px; max-width:100vw; height:600px; max-height:100vh;
            border:1px solid rgba(255,255,255,0.03); border-radius:6px; overflow:hidden;
            box-shadow:0 0 80px rgba(0,0,0,0.5);
        }
        canvas { display:block; width:100%; height:100%; background:#040608; cursor:crosshair; }

        #hud {
            position:absolute; top:0; left:0; right:0;
            padding:8px 12px; pointer-events:none;
        }
        #hud .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
        #hud .row:last-child { margin-bottom:0; }
        #hud .val { font-size:11px; letter-spacing:0.03em; }
        #hud .val b { color:rgba(255,255,255,0.5); font-weight:400; }
        #hud .val .num { color:rgba(255,255,255,0.25); }

        #hpbarWrap { width:130px; height:5px; background:rgba(255,255,255,0.03); border-radius:3px; overflow:hidden; position:relative; }
        #hpbar { height:100%; width:100%; border-radius:3px; transition:width 0.1s; }
        #hpbar.health { background:linear-gradient(90deg,#3a7a5a,#5a8a6a); }
        #hpbar.damage { background:linear-gradient(90deg,#8a2a2a,#aa3a3a); }

        #ammo { font-size:11px; }
        #ammo b { font-size:14px; }

        #overlay {
            display:none; position:absolute; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.7); z-index:20;
            flex-direction:column; align-items:center; justify-content:center; gap:12px;
        }
        #overlay.show { display:flex; }
        #overlay h1 { font-size:24px; font-weight:300; color:rgba(255,255,255,0.15); letter-spacing:0.15em; }
        #overlay .sub { font-size:11px; color:rgba(255,255,255,0.06); }
        #overlay .big-num { font-size:36px; color:rgba(255,255,255,0.1); font-weight:200; }
        #overlay button {
            padding:8px 28px; margin-top:4px;
            background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05);
            border-radius:6px; color:rgba(255,255,255,0.2); font-size:12px;
            cursor:pointer; font-family:inherit; transition:0.15s;
        }
        #overlay button:hover { background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.4); }

        #minimap {
            position:absolute; bottom:10px; right:10px;
            width:80px; height:80px; border-radius:4px;
            border:1px solid rgba(255,255,255,0.03);
            background:rgba(0,0,0,0.4); overflow:hidden; pointer-events:none;
        }
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud">
        <div class="row">
            <div class="val"><b id="hpNum">100</b> <span class="num">HP</span></div>
            <div class="val"><span class="num">🌊</span> <b id="wave">0</b></div>
        </div>
        <div class="row">
            <div id="hpbarWrap"><div id="hpbar" class="health"></div></div>
            <div class="val" id="ammo"><b id="score">0</b> <span class="num">очок</span></div>
        </div>
    </div>
    <div id="overlay" class="show">
        <h1>🌑 ТІНІ</h1>
        <div class="sub">Ліва кнопка — стріляти | WASD — рух</div>
        <button onclick="startGame()">▶ ПОЧАТИ</button>
    </div>
    <canvas id="minimap" width="80" height="80"></canvas>
</div>
<script>
    // ============================================================
    // ТІНІ — реалістичний топ-даун шутер
    // ============================================================

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('minimap');
    const miniCtx = miniCanvas.getContext('2d');

    let W, H;

    function resize() {
        W = canvas.parentElement.clientWidth;
        H = canvas.parentElement.clientHeight;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    // ============================================================
    // ЗВУКИ (Web Audio API — синтезовані)
    // ============================================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playShoot() {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.08);
        } catch(e) {}
    }

    function playHit() {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.05);
        } catch(e) {}
    }

    function playDeath() {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.3);
            // Noise burst
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const ng = audioCtx.createGain();
            ng.gain.setValueAtTime(0.02, audioCtx.currentTime);
            ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            noise.connect(ng);
            ng.connect(audioCtx.destination);
            noise.start(audioCtx.currentTime);
        } catch(e) {}
    }

    function playExplosion() {
        try {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            noise.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(audioCtx.currentTime);
        } catch(e) {}
    }

    // ============================================================
    // СТАН
    // ============================================================
    const game = { running: false, score: 0, wave: 0, kills: 0, timer: 0, shake: 0 };
    const player = {
        x: 0, y: 0, r: 9, hp: 100, maxHp: 100,
        speed: 2.5, angle: 0, alive: true,
        shootCooldown: 0, shootDelay: 6,
        invincible: 0,
    };
    const keys = {};
    let mx = 0, my = 0, mouseDown = false;

    const enemies = [];
    const bullets = [];
    const particles = [];
    const damageNums = [];
    const pickups = [];
    let enemySpawned = 0, enemyCount = 0, spawnTimer = 0;

    // ============================================================
    // ВОРОГИ
    // ============================================================
    const ENEMY_TYPES = {
        // Швидкий легкий
        runner: {
            r: 7, hp: 1, speed: 3.0, score: 10, damage: 8,
            color: '#5a8aba', bodyColor: 'rgba(60,120,180,0.6)',
        },
        // Звичайний
        stalker: {
            r: 10, hp: 2, speed: 1.6, score: 15, damage: 12,
            color: '#ba5a3a', bodyColor: 'rgba(180,80,40,0.7)',
        },
        // Танк
        brute: {
            r: 15, hp: 6, speed: 0.9, score: 35, damage: 20,
            color: '#7a3a5a', bodyColor: 'rgba(120,40,60,0.8)',
        },
        // Стріляючий (RANGED)
        sniper: {
            r: 9, hp: 2, speed: 1.2, score: 25, damage: 8,
            color: '#3a7a5a', bodyColor: 'rgba(40,120,80,0.7)',
            ranged: true, shootTimer: 0, shootDelay: 90,
        },
        // Вибуховий
        exploder: {
            r: 12, hp: 3, speed: 1.8, score: 20, damage: 30,
            color: '#9a6a2a', bodyColor: 'rgba(180,100,30,0.8)',
            explosion: true, explosionRadius: 80, explosionTimer: 0,
        },
    };

    class Enemy {
        constructor(x, y, type) {
            const def = ENEMY_TYPES[type];
            this.x = x; this.y = y;
            this.type = type;
            this.r = def.r;
            this.hp = def.hp; this.maxHp = def.hp;
            this.speed = def.speed;
            this.score = def.score;
            this.damage = def.damage;
            this.color = def.color;
            this.bodyColor = def.bodyColor;
            this.angle = 0;
            this.hitFlash = 0;
            this.state = 'move'; // move, attack, charge
            this.stateTimer = 0;
            this.attackCooldown = 0;
            this.eyeAngle = 0;
            this.wobble = Math.random() * Math.PI * 2;

            // Спеціальні
            if (def.ranged) {
                this.shootTimer = def.shootDelay * 0.5 * Math.random();
                this.shootDelay = def.shootDelay;
            }
            if (def.explosion) {
                this.explosionRadius = def.explosionRadius;
                this.exploding = false;
                this.explosionTimer = 0;
                this.beepTimer = 0;
            }
        }

        update() {
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            this.angle = Math.atan2(dy, dx);

            if (this.hitFlash > 0) this.hitFlash--;
            this.wobble += 0.03;
            this.eyeAngle = this.angle + Math.sin(this.wobble) * 0.1;

            // Поведінка
            if (this.type === 'exploder' && dist < 100 && !this.exploding) {
                this.exploding = true;
                this.explosionTimer = 40;
            }

            if (this.exploding) {
                this.explosionTimer--;
                this.beepTimer++;
                if (this.beepTimer > 10) {
                    this.beepTimer = 0;
                    this.hitFlash = 3; // блимає перед вибухом
                }
                if (this.explosionTimer <= 0) {
                    this.explode();
                    return true; // мертвий
                }
                // Біжить до гравця швидше
                if (dist > 1) {
                    this.x += Math.cos(this.angle) * this.speed * 1.5;
                    this.y += Math.sin(this.angle) * this.speed * 1.5;
                }
            } else if (this.type === 'sniper') {
                this.shootTimer++;
                if (this.shootTimer >= this.shootDelay && dist < 350) {
                    this.shootTimer = 0;
                    // Стріляє кулею в гравця
                    const bAngle = this.angle;
                    game.bullets.push(new EnemyBullet(this.x, this.y, bAngle));
                }
                // Трохи відступає
                if (dist < 120) {
                    this.x -= Math.cos(this.angle) * this.speed * 0.5;
                    this.y -= Math.sin(this.angle) * this.speed * 0.5;
                } else {
                    this.x += Math.cos(this.angle) * this.speed * 0.3;
                    this.y += Math.sin(this.angle) * this.speed * 0.3;
                }
            } else if (this.type === 'brute' && dist < 150) {
                // Таран — прискорення
                this.state = 'charge';
                this.speed = ENEMY_TYPES.brute.speed + Math.max(0, 2 - dist/100);
                if (dist > 1) {
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;
                }
            } else {
                // Звичайний рух до гравця
                if (dist > 1) {
                    const spd = this.type === 'runner' ? this.speed :
                                this.type === 'stalker' ? this.speed + Math.sin(this.wobble) * 0.2 : this.speed;
                    this.x += Math.cos(this.angle) * spd;
                    this.y += Math.sin(this.angle) * spd;
                }
            }

            return false; // живий
        }

        explode() {
            playExplosion();
            // Шкода в радіусі
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < this.explosionRadius) {
                const falloff = 1 - dist / this.explosionRadius;
                player.hp -= this.damage * falloff;
                game.shake = 8;
            }
            // Частинки вибуху
            for (let i = 0; i < 25; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 1 + Math.random() * 4;
                particles.push(new Particle(this.x, this.y,
                    Math.cos(a) * s, Math.sin(a) * s,
                    `hsl(${30 + Math.random() * 30}, 100%, ${40 + Math.random() * 40}%)`,
                    20 + Math.random() * 15, 2 + Math.random() * 3));
            }
            for (let i = 0; i < 10; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 1 + Math.random() * 2;
                particles.push(new Particle(this.x, this.y,
                    Math.cos(a) * s, Math.sin(a) * s,
                    'rgba(200,200,200,0.5)',
                    10 + Math.random() * 10, 1 + Math.random() * 2));
            }
            removeEnemy(this);
        }

        takeDamage(dmg) {
            this.hp -= dmg;
            this.hitFlash = 6;
            return this.hp <= 0;
        }

        draw(cx, cy) {
            ctx.save();
            ctx.translate(cx, cy);

            const flash = this.hitFlash > 0;
            const isExploding = this.exploding;
            const scale = isExploding ? 1 + (1 - this.explosionTimer / 40) * 0.3 : 1;
            ctx.scale(scale, scale);

            // Тінь
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(2, 3, this.r * 0.9, this.r * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();

            if (flash) {
                // Спалах при попаданні
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(0, 0, this.r + 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Тіло
            const grad = ctx.createRadialGradient(-this.r*0.2, -this.r*0.2, 0, 0, 0, this.r);
            if (flash) {
                grad.addColorStop(0, 'rgba(255,255,255,0.6)');
                grad.addColorStop(0.5, this.bodyColor.replace('0.7','0.3'));
                grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            } else if (isExploding) {
                const pulse = 0.7 + Math.sin(this.explosionTimer * 0.5) * 0.3;
                grad.addColorStop(0, `rgba(255,200,100,${pulse * 0.5})`);
                grad.addColorStop(0.5, `rgba(200,80,30,${pulse * 0.6})`);
                grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            } else {
                grad.addColorStop(0, this.bodyColor.replace('0.7','0.4').replace('0.8','0.5').replace('0.6','0.3'));
                grad.addColorStop(0.5, this.bodyColor);
                grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            }
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            // Обводка
            ctx.strokeStyle = flash ? 'rgba(255,255,255,0.3)' :
                             (isExploding ? `rgba(255,200,100,${0.3 + Math.sin(this.explosionTimer * 0.5) * 0.2})` : 'rgba(255,255,255,0.05)');
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.stroke();

            // Деталі залежно від типу
            if (this.type === 'runner') {
                // Вузькі очі
                ctx.fillStyle = flash ? '#fff' : 'rgba(200,230,255,0.6)';
                const ex = Math.cos(this.eyeAngle) * this.r * 0.4;
                const ey = Math.sin(this.eyeAngle) * this.r * 0.4;
                ctx.fillRect(ex - 2, ey - 1, 4, 2);
            } else if (this.type === 'stalker') {
                // Два ока
                ctx.fillStyle = flash ? '#fff' : 'rgba(255,200,150,0.4)';
                for (let side = -1; side <= 1; side += 2) {
                    const ex = Math.cos(this.eyeAngle) * this.r * 0.3 + Math.cos(this.eyeAngle + Math.PI/2) * side * 3;
                    const ey = Math.sin(this.eyeAngle) * this.r * 0.3 + Math.sin(this.eyeAngle + Math.PI/2) * side * 3;
                    ctx.beginPath();
                    ctx.arc(ex, ey, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (this.type === 'brute') {
                // Чотири ока, великі
                ctx.fillStyle = flash ? '#fff' : 'rgba(200,100,120,0.5)';
                for (let side = -1; side <= 1; side += 2) {
                    for (let row = 0; row < 2; row++) {
                        const off = row === 0 ? 0.2 : 0.5;
                        const ex = Math.cos(this.eyeAngle) * this.r * off + Math.cos(this.eyeAngle + Math.PI/2) * side * 4;
                        const ey = Math.sin(this.eyeAngle) * this.r * off + Math.sin(this.eyeAngle + Math.PI/2) * side * 4;
                        ctx.beginPath();
                        ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            } else if (this.type === 'sniper') {
                // Одне велике око + щупальця
                ctx.fillStyle = flash ? '#fff' : 'rgba(100,200,150,0.5)';
                ctx.beginPath();
                ctx.arc(Math.cos(this.eyeAngle) * this.r * 0.3, Math.sin(this.eyeAngle) * this.r * 0.3, 3, 0, Math.PI * 2);
                ctx.fill();
                // Щупальця
                ctx.strokeStyle = flash ? 'rgba(255,255,255,0.3)' : this.bodyColor.replace('0.7','0.3');
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    const a = this.eyeAngle + Math.PI * (0.5 + i / 4) + Math.sin(this.wobble + i) * 0.1;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * this.r * 0.5, Math.sin(a) * this.r * 0.5);
                    ctx.quadraticCurveTo(
                        Math.cos(a + 0.2) * this.r * 1.2, Math.sin(a + 0.2) * this.r * 1.2,
                        Math.cos(a) * this.r * 1.5, Math.sin(a) * this.r * 1.5);
                    ctx.stroke();
                }
            } else if (this.type === 'exploder') {
                // Пульсуюча середина
                const pulse = isExploding ? 0.5 + Math.sin(this.explosionTimer * 0.5) * 0.3 : 0.3;
                ctx.fillStyle = `rgba(255,200,50,${pulse})`;
                ctx.beginPath();
                ctx.arc(0, 0, this.r * 0.5, 0, Math.PI * 2);
                ctx.fill();
                // Тріщини
                ctx.strokeStyle = `rgba(255,200,50,${pulse * 0.5})`;
                ctx.lineWidth = 0.5;
                for (let i = 0; i < 6; i++) {
                    const a = i * Math.PI / 3 + Math.sin(this.wobble) * 0.2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * this.r * 0.7, Math.sin(a) * this.r * 0.7);
                    ctx.stroke();
                }
            }

            // HP бар (якщо не повне)
            if (this.hp < this.maxHp && !this.exploding) {
                const bw = this.r * 2;
                const bh = 2;
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(-bw/2, -this.r - 6, bw, bh);
                ctx.fillStyle = `rgba(200,80,80,0.5)`;
                ctx.fillRect(-bw/2, -this.r - 6, bw * (this.hp / this.maxHp), bh);
            }

            ctx.restore();
        }
    }

    // ============================================================
    // КУЛІ ГРАВЦЯ
    // ============================================================
    class Bullet {
        constructor(x, y, angle) {
            this.x = x; this.y = y;
            this.angle = angle;
            this.speed = 9;
            this.r = 3;
            this.life = 50;
            this.trail = [];
        }

        update() {
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 6) this.trail.shift();
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.life--;
        }

        isDead() { return this.life <= 0 || this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30; }

        draw(cx, cy) {
            for (let i = 0; i < this.trail.length; i++) {
                const a = (i / this.trail.length) * 0.4;
                ctx.fillStyle = `rgba(150,200,255,${a * 0.3})`;
                ctx.beginPath();
                ctx.arc(this.trail[i].x + (cx - this.x), this.trail[i].y + (cy - this.y), 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = 'rgba(200,230,255,0.9)';
            ctx.shadowColor = 'rgba(150,200,255,0.3)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(cx, cy, this.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // ============================================================
    // КУЛІ ВОРОГІВ
    // ============================================================
    class EnemyBullet {
        constructor(x, y, angle) {
            this.x = x; this.y = y;
            this.angle = angle;
            this.speed = 4;
            this.r = 4;
            this.life = 80;
            this.trail = [];
        }

        update() {
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 8) this.trail.shift();
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.life--;
        }

        isDead() { return this.life <= 0 || this.x < -30 || this.x > W + 30 || this.y < -30 || this.y > H + 30; }

        draw(cx, cy) {
            for (let i = 0; i < this.trail.length; i++) {
                const a = (i / this.trail.length) * 0.5;
                ctx.fillStyle = `rgba(100,255,150,${a * 0.3})`;
                ctx.beginPath();
                ctx.arc(this.trail[i].x + (cx - this.x), this.trail[i].y + (cy - this.y), 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = 'rgba(100,255,150,0.7)';
            ctx.shadowColor = 'rgba(100,255,150,0.2)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(cx, cy, this.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    // ============================================================
    // ЧАСТИНКИ
    // ============================================================
    class Particle {
        constructor(x, y, vx, vy, color, life, r) {
            this.x = x; this.y = y;
            this.vx = vx; this.vy = vy;
            this.color = color;
            this.life = life || 20;
            this.maxLife = this.life;
            this.r = r || 2;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.97;
            this.vy *= 0.97;
            this.vy += 0.02; // гравітація
            this.life--;
        }

        isDead() { return this.life <= 0; }

        draw() {
            const a = this.life / this.maxLife;
            ctx.globalAlpha = a;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r * (0.5 + a * 0.5), 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    // ============================================================
    // ПОШКОДЖЕННЯ (числа)
    // ============================================================
    class DamageNum {
        constructor(x, y, amount) {
            this.x = x; this.y = y;
            this.amount = Math.round(amount);
            this.life = 30;
            this.maxLife = 30;
            this.vy = -1.5;
        }

        update() { this.y += this.vy; this.vy += 0.02; this.life--; }
        isDead() { return this.life <= 0; }

        draw() {
            const a = this.life / this.maxLife;
            ctx.fillStyle = `rgba(255,200,100,${a * 0.6})`;
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(this.amount, this.x, this.y);
        }
    }

    // ============================================================
    // ПІДБОРИ
    // ============================================================
    class Pickup {
        constructor(x, y, type) {
            this.x = x; this.y = y;
            this.type = type; // 'hp', 'ammo'
            this.r = 7;
            this.life = 300;
            this.wobble = Math.random() * Math.PI * 2;
        }

        update() {
            this.wobble += 0.05;
            this.life--;
        }

        isDead() { return this.life <= 0; }

        draw() {
            const bob = Math.sin(this.wobble) * 2;
            ctx.save();
            ctx.translate(this.x, this.y + bob);

            // Сяйво
            const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 15);
            if (this.type === 'hp') {
                glow.addColorStop(0, 'rgba(60,200,100,0.08)');
                glow.addColorStop(1, 'transparent');
            } else {
                glow.addColorStop(0, 'rgba(200,200,100,0.08)');
                glow.addColorStop(1, 'transparent');
            }
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = this.type === 'hp' ? 'rgba(60,200,100,0.3)' : 'rgba(200,200,100,0.3)';
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = this.type === 'hp' ? 'rgba(60,200,100,0.15)' : 'rgba(200,200,100,0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.type === 'hp' ? '+' : '⚡', 0, 0);

            ctx.restore();
        }
    }

    // ============================================================
    // ГРАВЕЦЬ
    // ============================================================
    function drawPlayer(cx, cy) {
        ctx.save();
        ctx.translate(cx, cy);

        // Сяйво
        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 40);
        glow.addColorStop(0, 'rgba(100,150,200,0.04)');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, Math.PI * 2);
        ctx.fill();

        // Тінь
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.ellipse(2, 3, player.r * 0.8, player.r * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Тіло
        const grad = ctx.createRadialGradient(-2, -2, 0, 0, 0, player.r);
        grad.addColorStop(0, 'rgba(200,230,255,0.15)');
        grad.addColorStop(0.6, 'rgba(160,200,240,0.08)');
        grad.addColorStop(1, 'rgba(100,150,200,0.02)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, player.r, 0, Math.PI * 2);
        ctx.fill();

        // Обводка
        ctx.strokeStyle = `rgba(160,210,255,${0.15 + Math.sin(Date.now() * 0.003) * 0.05})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, player.r, 0, Math.PI * 2);
        ctx.stroke();

        // Лінія напрямку
        ctx.strokeStyle = 'rgba(160,210,255,0.08)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(player.angle) * player.r * 1.8, Math.sin(player.angle) * player.r * 1.8);
        ctx.stroke();

        // "Очі"
        for (let side = -1; side <= 1; side += 2) {
            const ex = Math.cos(player.angle) * player.r * 0.3 + Math.cos(player.angle + Math.PI/2) * side * 3;
            const ey = Math.sin(player.angle) * player.r * 0.3 + Math.sin(player.angle + Math.PI/2) * side * 3;
            ctx.fillStyle = 'rgba(180,220,255,0.25)';
            ctx.beginPath();
            ctx.arc(ex, ey, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    // ============================================================
    // ЛОГІКА
    // ============================================================
    shootCount = 0;

    function update() {
        if (!game.running || !player.alive) return;

        // Рух
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy = -1;
        if (keys['s'] || keys['arrowdown']) dy = 1;
        if (keys['a'] || keys['arrowleft']) dx = -1;
        if (keys['d'] || keys['arrowright']) dx = 1;

        if (dx && dy) { dx *= 0.707; dy *= 0.707; }

        // Присідання (shift — повільніше)
        const sprint = keys['shift'] ? 0.5 : 1;
        player.x = Math.max(player.r, Math.min(W - player.r, player.x + dx * player.speed * sprint));
        player.y = Math.max(player.r, Math.min(H - player.r, player.y + dy * player.speed * sprint));

        if (player.invincible > 0) player.invincible--;

        // Кут до миші
        const rect = canvas.getBoundingClientRect();
        player.angle = Math.atan2(my - player.y, mx - player.x);

        // Стрільба
        if (player.shootCooldown > 0) player.shootCooldown--;

        // Хвилі
        if (enemySpawned < enemyCount) {
            spawnTimer++;
            const rate = Math.max(12, 35 - game.wave * 2);
            if (spawnTimer >= rate) {
                spawnTimer = 0;
                spawnEnemy();
            }
        }

        // Вороги
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            const dead = e.update();
            if (dead) {
                enemies.splice(i, 1);
                continue;
            }

            // Зіткнення з гравцем
            const d = Math.sqrt((player.x - e.x) ** 2 + (player.y - e.y) ** 2);
            if (d < player.r + e.r && player.invincible <= 0) {
                player.hp -= e.damage;
                player.invincible = 15;
                game.shake = Math.max(game.shake, 4);
                // Відкидання
                const angle = Math.atan2(e.y - player.y, e.x - player.x);
                player.x += Math.cos(angle) * 8;
                player.y += Math.sin(angle) * 8;
                particles.push(new Particle(player.x, player.y,
                    Math.cos(angle) * 2, Math.sin(angle) * 2,
                    'rgba(200,50,50,0.3)', 10, 3));
                if (player.hp <= 0) {
                    player.hp = 0;
                    player.alive = false;
                    endGame();
                    return;
                }
            }

            // Кулі гравця по ворогах
            for (let j = bullets.length - 1; j >= 0; j--) {
                const b = bullets[j];
                const bd = Math.sqrt((b.x - e.x) ** 2 + (b.y - e.y) ** 2);
                if (bd < e.r + b.r) {
                    const killed = e.takeDamage(1);
                    bullets.splice(j, 1);
                    playHit();
                    // Частинки
                    for (let k = 0; k < 4; k++) {
                        const a = Math.random() * Math.PI * 2;
                        particles.push(new Particle(b.x, b.y,
                            Math.cos(a) * (1 + Math.random() * 2), Math.sin(a) * (1 + Math.random() * 2),
                            'rgba(150,200,255,0.3)', 10, 1 + Math.random() * 2));
                    }
                    if (killed) {
                        game.score += e.score;
                        game.kills++;
                        damageNums.push(new DamageNum(e.x, e.y - e.r - 5, e.score));
                        playDeath();
                        // Велика кількість частинок
                        for (let k = 0; k < 12; k++) {
                            const a = Math.random() * Math.PI * 2;
                            const s = 1 + Math.random() * 3;
                            particles.push(new Particle(e.x, e.y,
                                Math.cos(a) * s, Math.sin(a) * s,
                                e.bodyColor.replace('0.7','0.5').replace('0.8','0.5').replace('0.6','0.4'),
                                15 + Math.random() * 10, 1 + Math.random() * 3));
                        }
                        // Підбір
                        if (Math.random() < 0.2) {
                            pickups.push(new Pickup(e.x, e.y, Math.random() < 0.5 ? 'hp' : 'ammo'));
                        }
                        enemies.splice(i, 1);
                        document.getElementById('score').textContent = game.score;
                    }
                    break;
                }
            }
        }

        // Кулі ворогів по гравцю
        for (let i = game.bullets.length - 1; i >= 0; i--) {
            const b = game.bullets[i];
            b.update();
            if (b.isDead()) { game.bullets.splice(i, 1); continue; }
            const d = Math.sqrt((player.x - b.x) ** 2 + (player.y - b.y) ** 2);
            if (d < player.r + b.r && player.invincible <= 0) {
                player.hp -= 8;
                player.invincible = 10;
                game.shake = 5;
                damageNums.push(new DamageNum(player.x, player.y - 15, 8));
                for (let k = 0; k < 6; k++) {
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(b.x, b.y,
                        Math.cos(a) * 2, Math.sin(a) * 2,
                        'rgba(100,255,150,0.3)', 10, 2));
                }
                game.bullets.splice(i, 1);
                if (player.hp <= 0) {
                    player.hp = 0;
                    player.alive = false;
                    endGame();
                    return;
                }
            }
        }

        // Кулі гравця
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            if (bullets[i].isDead()) bullets.splice(i, 1);
        }

        // Частинки
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].isDead()) particles.splice(i, 1);
        }

        // Damage nums
        for (let i = damageNums.length - 1; i >= 0; i--) {
            damageNums[i].update();
            if (damageNums[i].isDead()) damageNums.splice(i, 1);
        }

        // Підбори
        for (let i = pickups.length - 1; i >= 0; i--) {
            const p = pickups[i];
            p.update();
            const d = Math.sqrt((player.x - p.x) ** 2 + (player.y - p.y) ** 2);
            if (d < player.r + p.r) {
                if (p.type === 'hp') {
                    player.hp = Math.min(player.maxHp, player.hp + 25);
                } else {
                    // Додаткові очки
                    game.score += 5;
                }
                pickups.splice(i, 1);
            }
            if (p.isDead()) pickups.splice(i, 1);
        }

        // Перевірка хвилі
        if (enemySpawned >= enemyCount && enemies.length === 0 && game.running) {
            startWave();
        }

        // Тряска
        if (game.shake > 0) game.shake--;

        // HUD
        document.getElementById('hpNum').textContent = Math.round(player.hp);
        const hpPct = player.hp / player.maxHp * 100;
        document.getElementById('hpbar').style.width = hpPct + '%';
        document.getElementById('hpbar').className = 'health';
        if (hpPct < 30) document.getElementById('hpbar').classList.add('damage');
    }

    // ============================================================
    // ХВИЛІ
    // ============================================================
    function startWave() {
        game.wave++;
        enemySpawned = 0;
        enemyCount = 4 + game.wave * 3;
        spawnTimer = 0;
        document.getElementById('wave').textContent = game.wave;
    }

    function spawnEnemy() {
        let x, y;
        const side = Math.floor(Math.random() * 4);
        switch(side) {
            case 0: x = -25; y = Math.random() * H; break;
            case 1: x = W + 25; y = Math.random() * H; break;
            case 2: x = Math.random() * W; y = -25; break;
            case 3: x = Math.random() * W; y = H + 25; break;
        }

        // Вибір типу
        let type = 'stalker';
        const r = Math.random();
        const w = game.wave;
        if (w >= 2 && r < 0.2) type = 'runner';
        else if (w >= 3 && r < 0.15) type = 'brute';
        else if (w >= 4 && r < 0.12) type = 'sniper';
        else if (w >= 3 && r < 0.08) type = 'runner';
        if (w >= 2 && type === 'stalker' && Math.random() < 0.1) type = 'exploder';

        enemies.push(new Enemy(x, y, type));
        enemySpawned++;
    }

    // ============================================================
    // РЕНДЕР
    // ============================================================
    function render() {
        ctx.clearRect(0, 0, W, H);

        // Тряска
        ctx.save();
        if (game.shake > 0) {
            const s = game.shake * 0.4;
            ctx.translate(Math.random() * s - s/2, Math.random() * s - s/2);
        }

        // Фон
        const bgGrad = ctx.createRadialGradient(player.x, player.y, 10, player.x, player.y, 500);
        bgGrad.addColorStop(0, '#0a0e14');
        bgGrad.addColorStop(1, '#040608');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Туман
        ctx.fillStyle = 'rgba(0,0,0,0.02)';
        for (let i = 0; i < 3; i++) {
            const fx = (Math.sin(Date.now() * 0.0001 + i * 2) * 0.5 + 0.5) * W;
            const fy = (Math.cos(Date.now() * 0.00015 + i * 3) * 0.5 + 0.5) * H;
            const grad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 150 + i * 50);
            grad.addColorStop(0, 'rgba(20,30,40,0.03)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
        }

        // Підбори
        for (const p of pickups) p.draw();

        // Частинки
        for (const p of particles) p.draw();

        // Вороги
        for (const e of enemies) e.draw(e.x, e.y);

        // Кулі ворогів
        for (const b of game.bullets) b.draw(b.x, b.y);

        // Кулі гравця
        for (const b of bullets) b.draw(b.x, b.y);

        // Гравець
        if (player.alive) {
            drawPlayer(player.x, player.y);
        }

        // Damage nums
        for (const d of damageNums) d.draw();

        // Темні краї (vignette)
        const vigGrad = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.8);
        vigGrad.addColorStop(0, 'transparent');
        vigGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, W, H);

        ctx.restore();

        // Мінімапа
        drawMinimap();
    }

    // ============================================================
    // МІНІМАПА
    // ============================================================
    function drawMinimap() {
        const mw = 80, mh = 80;
        miniCtx.fillStyle = 'rgba(0,0,0,0.6)';
        miniCtx.fillRect(0, 0, mw, mh);

        const sx = mw / W, sy = mh / H;

        // Вороги
        for (const e of enemies) {
            miniCtx.fillStyle = 'rgba(200,80,80,0.4)';
            miniCtx.beginPath();
            miniCtx.arc(e.x * sx, e.y * sy, 2, 0, Math.PI * 2);
            miniCtx.fill();
        }

        // Гравець
        if (player.alive) {
            miniCtx.fillStyle = 'rgba(150,200,255,0.5)';
            miniCtx.beginPath();
            miniCtx.arc(player.x * sx, player.y * sy, 2.5, 0, Math.PI * 2);
            miniCtx.fill();
        }

        // Кордони
        miniCtx.strokeStyle = 'rgba(255,255,255,0.03)';
        miniCtx.lineWidth = 0.5;
        miniCtx.strokeRect(0, 0, mw, mh);
    }

    // ============================================================
    // СТРІЛЬБА
    // ============================================================
    function shoot() {
        if (!game.running || !player.alive || player.shootCooldown > 0) return;
        player.shootCooldown = player.shootDelay;
        playShoot();
        // Невеликий розкид
        const spread = (Math.random() - 0.5) * 0.05;
        const b = new Bullet(player.x, player.y, player.angle + spread);
        bullets.push(b);
        // Віддача
        player.x -= Math.cos(player.angle) * 1.2;
        player.y -= Math.sin(player.angle) * 1.2;
    }

    // ============================================================
    // УПРАВЛІННЯ
    // ============================================================
    document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ') { e.preventDefault(); if (game.running && !player.alive) restartGame(); }
    });
    document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mx = (e.clientX - rect.left) / rect.width * W;
        my = (e.clientY - rect.top) / rect.height * H;
    });

    canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (e.button === 0) { mouseDown = true; shoot(); }
    });
    canvas.addEventListener('mouseup', () => mouseDown = false);
    canvas.addEventListener('mouseleave', () => mouseDown = false);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ============================================================
    // ЦИКЛ
    // ============================================================
    function gameLoop() {
        if (mouseDown && game.running) shoot();
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // СТАРТ / СТОП
    // ============================================================
    function startGame() {
        document.getElementById('overlay').classList.remove('show');
        game.running = true;
        game.score = 0;
        game.wave = 0;
        game.kills = 0;
        game.shake = 0;
        player.hp = player.maxHp;
        player.alive = true;
        player.x = W/2;
        player.y = H/2;
        player.invincible = 0;
        enemies.length = 0;
        bullets.length = 0;
        particles.length = 0;
        damageNums.length = 0;
        pickups.length = 0;
        game.bullets = []; // кулі ворогів
        document.getElementById('score').textContent = '0';
        document.getElementById('hpNum').textContent = '100';
        document.getElementById('hpbar').style.width = '100%';
        startWave();
        gameLoop();
    }

    window.startGame = startGame;

    function restartGame() { startGame(); }

    function endGame() {
        game.running = false;
        document.getElementById('overlay').classList.add('show');
        document.getElementById('overlay').innerHTML = `
            <h1>💀 ЗАГИБЕЛЬ</h1>
            <div class="big-num">${game.score}</div>
            <div class="sub">🎯 ${game.score} очок · 🌊 ${game.wave} хвиль</div>
            <button onclick="restartGame()">↺ ЩЕ РАЗ</button>
        `;
    }

    function removeEnemy(e) {
        const idx = enemies.indexOf(e);
        if (idx >= 0) enemies.splice(idx, 1);
    }
</script>
</body>
