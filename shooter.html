<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D шутер — люди</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none}
        body{background:#111;overflow:hidden;font-family:'Segoe UI',sans-serif}
        canvas{display:block;width:100%;height:100%}

        #ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
        #crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
        #crosshair span{display:block;width:16px;height:16px;border:1.5px solid rgba(255,255,255,0.3);border-radius:50%;position:relative}
        #crosshair span::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:2px;background:rgba(255,255,255,0.3);border-radius:50%}

        #hud{position:absolute;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-end}
        #hpSec .label{font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:2px}
        #hpBarW{width:160px;height:5px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden}
        #hpBar{height:100%;background:#44aa66;border-radius:2px;transition:width 0.1s}

        #scoreSec{text-align:right}
        #scoreSec .num{font-size:26px;color:rgba(255,255,255,0.15);font-weight:300}
        #scoreSec .num b{color:rgba(255,255,255,0.4)}
        #scoreSec .wave{font-size:11px;color:rgba(255,255,255,0.08)}

        #startOverlay{
            position:fixed;top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.85);z-index:100;
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
        }
        #startOverlay h1{font-size:30px;font-weight:300;color:rgba(255,255,255,0.12);letter-spacing:0.15em}
        #startOverlay .sub{font-size:11px;color:rgba(255,255,255,0.06)}
        #startOverlay button{
            padding:9px 28px;margin-top:6px;
            background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);
            border-radius:5px;color:rgba(255,255,255,0.12);font-size:13px;
            cursor:pointer;pointer-events:auto;font-family:inherit
        }
        #startOverlay button:hover{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.25)}
        #startOverlay .note{font-size:9px;color:rgba(255,255,255,0.02)}
        #startOverlay.hidden{display:none}
    </style>
</head>
<body>

<div id="startOverlay">
    <h1>🎯 АРЕНА</h1>
    <div class="sub">3D шутер · знищуй хвилі ворогів-людей</div>
    <button onclick="startGame()">▶ ГРАТИ</button>
    <div class="note">WASD — рух · Миша — огляд · ЛКМ — стріляти · Shift — біг</div>
</div>

<div id="ui">
    <div id="crosshair"><span></span></div>
    <div id="hud">
        <div id="hpSec">
            <div class="label">❤️ HP</div>
            <div id="hpBarW"><div id="hpBar"></div></div>
        </div>
        <div id="scoreSec">
            <div class="num"><b id="scr">0</b></div>
            <div class="wave" id="wave">ХВИЛЯ 0</div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // ============================================================
    // 3D ШУТЕР — люди, стрільба, ходьба
    // ============================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x88aacc);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================
    // СВІТЛО
    // ============================================================
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(20, 40, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 1024;
    sun.shadow.mapSize.height = 1024;
    scene.add(sun);

    // ============================================================
    // ЗЕМЛЯ
    // ============================================================
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(200, 40, 0x88aacc, 0x667788);
    grid.position.y = 0.05;
    scene.add(grid);

    // ============================================================
    // ПЕРЕШКОДИ (стіни, ящики)
    // ============================================================
    const walls = [];
    function addWall(x, z, w, h, d, color) {
        const m = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, d),
            new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
        );
        m.position.set(x, h/2, z);
        m.castShadow = true;
        m.receiveShadow = true;
        scene.add(m);
        walls.push(m);
        return m;
    }

    // Арена — коло стін
    for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2;
        addWall(Math.cos(a)*42, Math.sin(a)*42, 2, 2.5, 2, 0x445566);
    }

    // Ящики
    for (let i = 0; i < 15; i++) {
        const a = Math.random()*Math.PI*2;
        const d = 5+Math.random()*30;
        addWall(Math.cos(a)*d, Math.sin(a)*d, 1.2+Math.random()*0.5, 0.6+Math.random()*0.6, 1.2+Math.random()*0.5, 0x667788);
    }

    // ============================================================
    // ЛЮДИ (вороги)
    // ============================================================
    function createHumanoid(color, height) {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5, emissive: color, emissiveIntensity: 0.1 });

        // Тіло
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.6, 6), mat);
        body.position.y = 0.3;
        body.castShadow = true;
        g.add(body);

        // Голова
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 6, 6), mat);
        head.position.y = 0.7;
        head.castShadow = true;
        g.add(head);

        // Ноги
        const legMat = new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.7 });
        for (let side of [-1, 1]) {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.3, 4), legMat);
            leg.position.set(side * 0.08, 0.15, 0);
            g.add(leg);
        }

        // Руки
        const armMat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
        for (let side of [-1, 1]) {
            const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.35, 4), armMat);
            arm.position.set(side * 0.25, 0.5, 0);
            arm.rotation.z = side * 0.3;
            g.add(arm);
        }

        return g;
    }

    // ============================================================
    // ПАРАМЕТРИ ВОРОГІВ
    // ============================================================
    const ENEMY_TYPES = [
        { name:'stalker', hp:2, speed:2.0, score:15, damage:10, color:0xdd5533, h:0.7 },
        { name:'runner',  hp:1, speed:4.5, score:10, damage:8,  color:0x33aadd, h:0.6 },
        { name:'brute',   hp:8, speed:1.2, score:40, damage:20, color:0xdd3355, h:0.9 },
        { name:'sniper',  hp:2, speed:1.5, score:30, damage:8,  color:0x33dd77, h:0.7, ranged:true },
        { name:'exploder',hp:3, speed:3.0, score:25, damage:40, color:0xddaa33, h:0.7, explosion:true },
    ];

    class Enemy {
        constructor(x, z, def) {
            this.def = def;
            this.hp = def.hp;
            this.maxHp = def.hp;
            this.speed = def.speed;
            this.score = def.score;
            this.damage = def.damage;
            this.alive = true;
            this.hitFlash = 0;
            this.wobble = Math.random() * 6.28;

            this.group = createHumanoid(def.color, def.h);
            this.group.position.set(x, 0, z);
            const s = def.name === 'brute' ? 1.4 : def.name === 'runner' ? 0.8 : 1;
            this.group.scale.set(s, s, s);
            scene.add(this.group);

            this.r = s * 0.25;

            if (def.ranged) {
                this.shootTimer = Math.random() * 2;
                this.shootDelay = 2.0;
            }
            if (def.explosion) {
                this.exploding = false;
                this.explosionTimer = 0;
            }
        }

        update(dt) {
            if (!this.alive) return;
            this.hitFlash = Math.max(0, this.hitFlash - dt * 15);
            this.wobble += dt * 5;

            const dx = player.x - this.group.position.x;
            const dz = player.z - this.group.position.z;
            const dist = Math.sqrt(dx*dx + dz*dz);
            const angle = Math.atan2(dx, dz);

            let spd = this.speed;

            if (this.def.explosion && dist < 10 && !this.exploding) {
                this.exploding = true;
                this.explosionTimer = 1.5;
            }
            if (this.exploding) {
                this.explosionTimer -= dt;
                if (this.explosionTimer <= 0) { this.explode(); return; }
                spd = this.speed * 2;
                // Блимає
                this.group.children.forEach(c => { if (c.isMesh) c.material.emissiveIntensity = 0.5 + Math.sin(this.explosionTimer*20)*0.5; });
            }
            if (this.def.ranged) {
                this.shootTimer += dt;
                if (this.shootTimer >= this.shootDelay && dist < 30 && dist > 3) {
                    this.shootTimer = 0;
                    this.shoot(angle);
                }
                if (dist < 4) spd = -this.speed * 0.5;
            }
            if (this.def.name === 'brute' && dist < 6) spd *= 3;

            if (dist > 0.5) {
                this.group.position.x += Math.sin(angle) * spd * dt;
                this.group.position.z += Math.cos(angle) * spd * dt;
            }

            // Обертання до гравця
            this.group.lookAt(player.x, 0, player.z);

            // Хитання при ходьбі
            this.group.position.y = Math.abs(Math.sin(this.wobble * 3)) * 0.04;

            // Зіткнення
            if (player.invincible <= 0) {
                const d = Math.sqrt((player.x - this.group.position.x)**2 + (player.z - this.group.position.z)**2);
                if (d < this.r + 0.4) {
                    player.hp -= this.damage;
                    player.invincible = 0.5;
                    if (player.hp <= 0) { player.hp = 0; player.alive = false; endGame(); }
                }
            }
        }

        shoot(angle) {
            spawnEnemyBullet(this.group.position.x, this.group.position.z, angle);
        }

        takeDamage(dmg) {
            this.hp -= dmg;
            this.hitFlash = 1;
            this.group.children.forEach(c => {
                if (c.isMesh) c.material.emissiveIntensity = 0.5;
            });
            if (this.hp <= 0) { this.die(); return true; }
            return false;
        }

        die() {
            this.alive = false;
            game.score += this.score;
            game.kills++;
            showDmg(this.score);
            playDeath();

            // Розкидати частини
            const parts = [...this.group.children];
            for (const part of parts) {
                if (part.isMesh) {
                    scene.add(part);
                    part.position.copy(this.group.position).add(part.position);
                    const a = Math.random()*6.28;
                    const s = 1+Math.random()*3;
                    part.userData = { vx: Math.cos(a)*s, vy: Math.random()*3+1, vz: Math.sin(a)*s, life: 1 };
                    game.flyingParts.push(part);
                }
            }
            scene.remove(this.group);
        }

        explode() {
            playExplosion();
            const d = Math.sqrt((player.x - this.group.position.x)**2 + (player.z - this.group.position.z)**2);
            if (d < 5) {
                player.hp -= this.damage * (1 - d/5);
                if (player.hp <= 0) { player.hp = 0; player.alive = false; endGame(); }
            }
            for (let i = 0; i < 20; i++) {
                const a = Math.random()*6.28, s = 1+Math.random()*4;
                const m = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.1), new THREE.MeshBasicMaterial({color:0xff6600}));
                m.position.copy(this.group.position);
                m.position.y += 0.3;
                scene.add(m);
                m.userData = { vx:Math.cos(a)*s, vy:Math.random()*3+2, vz:Math.sin(a)*s, life:1.5 };
                game.flyingParts.push(m);
            }
            game.shake = 0.3;
            scene.remove(this.group);
            this.alive = false;
        }
    }

    // ============================================================
    // КУЛІ
    // ============================================================
    function spawnBullet(x, z, angle) {
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(0.06, 6, 6),
            new THREE.MeshBasicMaterial({ color: 0x88ccff })
        );
        m.position.set(x, 1.5, z);
        scene.add(m);
        game.bullets.push({
            mesh: m, x, z, angle,
            speed: 30, life: 1.5, alive: true,
            update(dt) {
                this.x += Math.sin(this.angle) * this.speed * dt;
                this.z += Math.cos(this.angle) * this.speed * dt;
                this.mesh.position.set(this.x, 1.5, this.z);
                this.life -= dt;
                if (this.life <= 0) { this.remove(); return; }
                for (const e of game.enemies) {
                    if (!e.alive) continue;
                    const d = Math.sqrt((this.x - e.group.position.x)**2 + (this.z - e.group.position.z)**2);
                    if (d < e.r + 0.15) {
                        playHit();
                        const killed = e.takeDamage(1);
                        if (killed) game.score = game.score + 0; // updated in die()
                        this.remove();
                        break;
                    }
                }
            },
            remove() { this.alive=false; scene.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh.material.dispose(); }
        });
    }

    function spawnEnemyBullet(x, z, angle) {
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(0.1, 6, 6),
            new THREE.MeshBasicMaterial({ color: 0x66ffaa })
        );
        m.position.set(x, 1.2, z);
        scene.add(m);
        game.enemyBullets.push({
            mesh: m, x, z, angle,
            speed: 8, life: 3, alive: true,
            update(dt) {
                this.x += Math.sin(this.angle)*this.speed*dt;
                this.z += Math.cos(this.angle)*this.speed*dt;
                this.mesh.position.set(this.x, 1.2, this.z);
                this.life -= dt;
                if (this.life <= 0) { this.remove(); return; }
                const d = Math.sqrt((player.x-this.x)**2 + (player.z-this.z)**2);
                if (d < 0.4 && player.invincible <= 0) {
                    player.hp -= 8; player.invincible = 0.3; showDmg(8); this.remove();
                }
            },
            remove() { this.alive=false; scene.remove(this.mesh); this.mesh.geometry.dispose(); this.mesh.material.dispose(); }
        });
    }

    // ============================================================
    // СТАН
    // ============================================================
    const player = {
        hp: 100, maxHp: 100,
        x: 0, z: 0,
        speed: 6, sprintMult: 1.7,
        height: 1.8,
        shootCooldown: 0, shootDelay: 0.1,
        alive: true, invincible: 0,
    };

    const game = {
        score: 0, wave: 0, kills: 0, timer: 0, shake: 0,
        running: false,
        enemies: [], bullets: [], enemyBullets: [], flyingParts: [],
        enemySpawned: 0, enemyCount: 0, spawnTimer: 0,
    };

    // ============================================================
    // ЗВУКИ
    // ============================================================
    let actx = null;
    function a() { if(!actx) actx=new(window.AudioContext||webkitAudioContext)(); return actx; }
    function playShoot() { try{const c=a(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='square';o.frequency.setValueAtTime(800,c.currentTime);o.frequency.exponentialRampToValueAtTime(100,c.currentTime+0.04);g.gain.setValueAtTime(0.01,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.04);o.start();o.stop(c.currentTime+0.04)}catch(e){} }
    function playHit() { try{const c=a(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(500,c.currentTime);o.frequency.exponentialRampToValueAtTime(100,c.currentTime+0.03);g.gain.setValueAtTime(0.008,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.03);o.start();o.stop(c.currentTime+0.03)}catch(e){} }
    function playDeath() { try{const c=a(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(300,c.currentTime);o.frequency.exponentialRampToValueAtTime(20,c.currentTime+0.2);g.gain.setValueAtTime(0.015,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.2);o.start();o.stop(c.currentTime+0.2)}catch(e){} }
    function playExplosion() { try{const c=a(),b=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.1));const n=c.createBufferSource(),g=c.createGain();n.buffer=b;n.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.02,c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.3);n.start()}catch(e){} }

    // ============================================================
    // DAMAGE
    // ============================================================
    const dmgEl = document.getElementById('dmgs');
    function showDmg(n) {
        const el = document.createElement('div');
        el.textContent = '+'+n;
        el.style.cssText = 'font-size:18px;font-weight:600;color:rgba(255,200,100,0.5);text-shadow:0 0 8px rgba(255,200,100,0.1);transition:all 0.4s';
        dmgEl.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; el.style.transform='translateY(-15px)'; setTimeout(()=>el.remove(),400); }, 100);
    }

    // ============================================================
    // ХВИЛІ
    // ============================================================
    function startWave() {
        game.wave++;
        game.enemySpawned = 0;
        game.enemyCount = 3 + game.wave * 2;
        game.spawnTimer = 0;
        document.getElementById('wave').textContent = 'ХВИЛЯ ' + game.wave;
    }

    function spawnEnemy() {
        const a = Math.random()*6.28;
        const d = 12 + Math.random()*8;
        const x = player.x + Math.cos(a)*d;
        const z = player.z + Math.sin(a)*d;
        let idx = 0;
        const r = Math.random(), w = game.wave;
        if (w>=2 && r<0.2) idx=1;
        else if (w>=3 && r<0.1) idx=2;
        else if (w>=4 && r<0.12) idx=3;
        else if (w>=3 && r<0.15) idx=1;
        if (w>=5 && r<0.08) idx=4;
        const def = ENEMY_TYPES[idx];
        const e = new Enemy(x, z, def);
        game.enemies.push(e);
        game.enemySpawned++;
    }

    // ============================================================
    // КЕРУВАННЯ
    // ============================================================
    const keys = {};
    document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // Керування мишею — працює завжди!
    let mouseDown = false;
    let pointerLocked = false;

    document.addEventListener('pointerlockchange', () => {
        pointerLocked = !!document.pointerLockElement;
    });

    document.addEventListener('click', () => {
        if (game.running) renderer.domElement.requestPointerLock();
    });

    // Зберігаємо попередню позицію миші для режиму без pointer lock
    let prevMouseX = 0, prevMouseY = 0;

    document.addEventListener('mousemove', e => {
        if (!game.running) return;

        const sens = 0.002;

        if (document.pointerLockElement) {
            // Режим pointer lock — використовуємо movementX/Y
            camera.rotation.y -= e.movementX * sens;
            camera.rotation.x -= e.movementY * sens;
        } else if (mouseDown) {
            // Без pointer lock — використовуємо різницю позицій
            if (prevMouseX !== 0 || prevMouseY !== 0) {
                const dx = e.clientX - prevMouseX;
                const dy = e.clientY - prevMouseY;
                camera.rotation.y -= dx * sens;
                camera.rotation.x -= dy * sens;
            }
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        } else {
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        }

        camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x));
    });

    document.addEventListener('mousedown', e => {
        if (e.button === 0) {
            mouseDown = true;
            if (game.running) {
                shoot();
                renderer.domElement.requestPointerLock();
            }
        }
    });
    document.addEventListener('mouseup', e => { if (e.button === 0) { mouseDown = false; prevMouseX = 0; prevMouseY = 0; } });

    function shoot() {
        if (!game.running || !player.alive || player.shootCooldown > 0) return;
        player.shootCooldown = player.shootDelay;
        playShoot();
        const a = camera.rotation.y + (Math.random()-0.5)*0.03;
        spawnBullet(player.x, player.z, a);
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    window.startGame = function() {
        document.getElementById('startOverlay').classList.add('hidden');

        // Скидання
        player.hp = player.maxHp; player.alive = true;
        player.x = 0; player.z = 0; player.invincible = 1;
        camera.position.set(0, player.height, 0);
        camera.rotation.set(0, 0, 0);

        game.score = 0; game.wave = 0; game.kills = 0; game.shake = 0; game.timer = 0;
        game.enemies = []; game.bullets = []; game.enemyBullets = [];
        for (const p of game.flyingParts) { scene.remove(p); if (p.geometry) p.geometry.dispose(); if (p.material) p.material.dispose(); }
        game.flyingParts = [];

        document.getElementById('scr').textContent = '0';
        document.getElementById('hpBar').style.width = '100%';
        document.getElementById('dmgs').innerHTML = '';

        game.running = true;
        startWave();
    };

    function endGame() {
        game.running = false;
        document.getElementById('startOverlay').classList.remove('hidden');
        document.getElementById('startOverlay').querySelector('h1').textContent = '💀 ЗАГИБЕЛЬ';
        document.getElementById('startOverlay').querySelector('.sub').textContent =
            '🎯 ' + game.score + ' очок · 🌊 ' + game.wave + ' хвиль · 💀 ' + game.kills + ' вбивств';
        document.getElementById('startOverlay').querySelector('button').textContent = '↺ ЩЕ РАЗ';
        document.exitPointerLock();
    }

    // ============================================================
    // ЦИКЛ
    // ============================================================
    let lastTime = 0;

    function loop(time) {
        requestAnimationFrame(loop);

        const dt = Math.min(0.05, (time - (lastTime || time)) / 1000);
        lastTime = time;

        // Оновлення завжди (навіть коли гра не йде — рендер)
        if (game.running) {
            // Рух WASD
            const sprint = keys['shift'] ? player.sprintMult : 1;
            let mx=0, mz=0;
            if (keys['w'] || keys['arrowup']) mz = -1;
            if (keys['s'] || keys['arrowdown']) mz = 1;
            if (keys['a'] || keys['arrowleft']) mx = -1;
            if (keys['d'] || keys['arrowright']) mx = 1;
            if (mx && mz) { mx *= 0.707; mz *= 0.707; }

            const fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
            fwd.y = 0; right.y = 0; fwd.normalize(); right.normalize();

            const spd = player.speed * sprint * dt;
            let nx = player.x + (fwd.x*mz + right.x*mx) * spd;
            let nz = player.z + (fwd.z*mz + right.z*mx) * spd;
            const bnd = 40;
            player.x = Math.max(-bnd, Math.min(bnd, nx));
            player.z = Math.max(-bnd, Math.min(bnd, nz));

            camera.position.x = player.x;
            camera.position.z = player.z;

            // Хитання камери
            const moving = mx !== 0 || mz !== 0;
            if (moving) {
                game.timer += dt * (sprint > 1 ? 7 : 4);
                camera.position.y = player.height + Math.sin(game.timer) * 0.03;
            } else {
                camera.position.y = player.height;
            }

            player.shootCooldown -= dt;
            player.invincible -= dt;
            game.shake = Math.max(0, game.shake - dt);

            // Тряска
            if (game.shake > 0) {
                const s = game.shake * 2;
                camera.position.x += (Math.random()-0.5)*s*0.01;
                camera.position.z += (Math.random()-0.5)*s*0.01;
            }

            // Спавн ворогів
            if (game.enemySpawned < game.enemyCount) {
                game.spawnTimer += dt;
                if (game.spawnTimer >= 0.8) {
                    game.spawnTimer = 0;
                    spawnEnemy();
                }
            }

            // Оновлення ворогів
            for (let i = game.enemies.length-1; i >= 0; i--) {
                const e = game.enemies[i];
                e.update(dt);
                if (!e.alive) game.enemies.splice(i, 1);
            }

            // Кулі гравця
            for (let i = game.bullets.length-1; i >= 0; i--) {
                const b = game.bullets[i];
                b.update(dt);
                if (!b.alive) game.bullets.splice(i, 1);
            }

            // Кулі ворогів
            for (let i = game.enemyBullets.length-1; i >= 0; i--) {
                const b = game.enemyBullets[i];
                if (!b.alive) { game.enemyBullets.splice(i, 1); continue; }
                b.update(dt);
            }

            // Летючі частини
            for (let i = game.flyingParts.length-1; i >= 0; i--) {
                const p = game.flyingParts[i];
                const ud = p.userData;
                p.position.x += ud.vx * dt;
                p.position.y += ud.vy * dt;
                p.position.z += ud.vz * dt;
                ud.vy -= 5 * dt;
                ud.life -= dt;
                if (ud.life <= 0 || p.position.y < -1) {
                    scene.remove(p);
                    if (p.geometry) p.geometry.dispose();
                    if (p.material) p.material.dispose();
                    game.flyingParts.splice(i, 1);
                }
            }

            // Нова хвиля
            if (game.enemySpawned >= game.enemyCount && game.enemies.length === 0) {
                startWave();
            }

            // HUD
            document.getElementById('scr').textContent = game.score;
            const hpPct = player.hp / player.maxHp * 100;
            document.getElementById('hpBar').style.width = Math.max(0, hpPct) + '%';

            // Смерть
            if (!player.alive) { endGame(); return; }

            // Автострільба
            if (mouseDown) shoot();
        }

        renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);

    // ============================================================
    // ЗАСТАВКА
    // ============================================================
    camera.position.set(0, 8, 18);
    camera.lookAt(0, 0, 0);
</script>
</body>
