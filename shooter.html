<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіні — шутер</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        body { background:#05080a; display:flex; justify-content:center; align-items:center; min-height:100vh; overflow:hidden; font-family:'Segoe UI',sans-serif; }
        #wrap {
            position:relative; width:800px; max-width:100vw; height:600px; max-height:100vh;
            border:1px solid rgba(255,255,255,0.03); border-radius:6px; overflow:hidden;
        }
        canvas { display:block; width:100%; height:100%; background:#070a0c; cursor:crosshair; }

        #hud {
            position:absolute; top:0; left:0; right:0;
            display:flex; justify-content:space-between; padding:8px 12px;
            pointer-events:none; font-size:11px; letter-spacing:0.05em;
        }
        #hud .left, #hud .right { display:flex; gap:14px; align-items:center; }
        #hud .val { color:rgba(255,255,255,0.25); }
        #hud .val b { color:rgba(255,255,255,0.5); }
        #hud .danger { color:#d05a5a; }

        #hpbar {
            width:120px; height:4px; background:rgba(255,255,255,0.03); border-radius:2px; overflow:hidden;
        }
        #hpbar .fill { height:100%; width:100%; background:#d05a5a; border-radius:2px; transition:width 0.15s; }

        #overlay {
            display:none; position:absolute; top:0; left:0; right:0; bottom:0;
            background:rgba(2,4,6,0.75); z-index:20;
            flex-direction:column; align-items:center; justify-content:center; gap:10px;
        }
        #overlay.show { display:flex; }
        #overlay h1 { font-size:22px; font-weight:300; color:rgba(255,255,255,0.2); letter-spacing:0.1em; }
        #overlay .sub { font-size:11px; color:rgba(255,255,255,0.06); }
        #overlay button {
            margin-top:8px; padding:8px 28px;
            background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04);
            border-radius:6px; color:rgba(255,255,255,0.15); font-size:12px;
            cursor:pointer; font-family:inherit;
        }
        #overlay button:hover { background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.3); }
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud">
        <div class="left">
            <span class="val">❤️ <b id="hp">100</b></span>
            <div id="hpbar"><div class="fill" id="hpFill"></div></div>
        </div>
        <div class="right">
            <span class="val">🎯 <b id="score">0</b></span>
            <span class="val">🌊 <b id="wave">0</b></span>
        </div>
    </div>
    <div id="overlay" class="show">
        <h1>🌑 ТІНІ</h1>
        <div class="sub">Вбивай тіней, збирай очки, виживай</div>
        <button onclick="startGame()">▶ Грати</button>
    </div>
</div>
<script>
    // ============================================================
    // ТІНІ — топ-даун шутер
    // ============================================================

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 600;

    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // ============================================================
    // СТАН
    // ============================================================
    let game = {
        running: false,
        score: 0,
        wave: 0,
        enemies: [],
        bullets: [],
        particles: [],
        enemyTimer: 0,
        waveTimer: 0,
        enemiesSpawned: 0,
        enemiesInWave: 0,
    };

    const player = {
        x: W/2, y: H/2,
        r: 10,
        hp: 100,
        maxHp: 100,
        speed: 3.5,
        angle: 0,
        shootCooldown: 0,
        shootDelay: 8,
        alive: true,
    };

    const keys = {};
    let mx = W/2, my = H/2;

    // ============================================================
    // ВОРОГИ
    // ============================================================
    class Enemy {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; // 'normal', 'fast', 'tank'
            this.r = type === 'tank' ? 14 : type === 'fast' ? 7 : 10;
            this.hp = type === 'tank' ? 6 : type === 'fast' ? 1 : 2;
            this.maxHp = this.hp;
            this.speed = type === 'fast' ? 2.5 : type === 'tank' ? 0.8 : 1.5;
            this.score = type === 'tank' ? 30 : type === 'fast' ? 15 : 10;
            this.damage = type === 'tank' ? 15 : type === 'fast' ? 5 : 10;
            this.angle = 0;
            this.hitFlash = 0;
            this.id = Math.random();
        }

        update() {
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 1) {
                this.angle = Math.atan2(dy, dx);
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            }
            if (this.hitFlash > 0) this.hitFlash--;
        }

        takeDamage(dmg) {
            this.hp -= dmg;
            this.hitFlash = 6;
            return this.hp <= 0;
        }

        draw(cx, cy, s) {
            const scale = s || 1;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);

            // Тінь
            if (this.hitFlash > 0) {
                ctx.fillStyle = '#fff';
            } else {
                ctx.fillStyle = this.type === 'tank' ? 'rgba(120,40,160,0.7)' :
                                this.type === 'fast' ? 'rgba(60,180,200,0.6)' :
                                'rgba(180,60,60,0.7)';
            }

            // Тіло
            ctx.beginPath();
            ctx.arc(0, 0, this.r, 0, Math.PI * 2);
            ctx.fill();

            // "Очі" (напрям)
            const eAngle = this.angle;
            const glow = Math.max(0.3, 1 - this.hp / this.maxHp * 0.4);
            ctx.fillStyle = `rgba(255,200,100,${glow * 0.5})`;
            ctx.beginPath();
            ctx.arc(Math.cos(eAngle) * this.r * 0.4, Math.sin(eAngle) * this.r * 0.4, 2 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Сяйво навколо
            if (this.hitFlash > 0) {
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.r + 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    // ============================================================
    // КУЛІ
    // ============================================================
    class Bullet {
        constructor(x, y, angle) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.speed = 8;
            this.r = 3;
            this.life = 60;
            this.trail = [];
        }

        update() {
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 5) this.trail.shift();
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.life--;
        }

        isDead() {
            return this.life <= 0 || this.x < -20 || this.x > canvas.width + 20 || this.y < -20 || this.y > canvas.height + 20;
        }

        draw(cx, cy) {
            // Слід
            for (let i = 0; i < this.trail.length; i++) {
                const a = (i / this.trail.length) * 0.3;
                ctx.fillStyle = `rgba(150,200,255,${a * 0.3})`;
                ctx.beginPath();
                ctx.arc(this.trail[i].x + (cx - this.x), this.trail[i].y + (cy - this.y), 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = 'rgba(180,220,255,0.8)';
            ctx.beginPath();
            ctx.arc(cx, cy, this.r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ============================================================
    // ЧАСТИНКИ
    // ============================================================
    class Particle {
        constructor(x, y, color, speed, life) {
            this.x = x;
            this.y = y;
            const a = Math.random() * Math.PI * 2;
            const s = speed * (0.5 + Math.random());
            this.vx = Math.cos(a) * s;
            this.vy = Math.sin(a) * s;
            this.life = life || 20;
            this.maxLife = this.life;
            this.r = 1 + Math.random() * 2;
            this.color = color;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.95;
            this.vy *= 0.95;
            this.life--;
        }

        isDead() { return this.life <= 0; }

        draw() {
            const a = this.life / this.maxLife;
            ctx.fillStyle = this.color || `rgba(255,200,100,${a * 0.5})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r * a, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ============================================================
    // ФІЗИКА СВІТЛА (м'яка підсвітка)
    // ============================================================
    function drawLight() {
        const grad = ctx.createRadialGradient(player.x, player.y, 5, player.x, player.y, 200);
        grad.addColorStop(0, 'rgba(100,150,200,0.02)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // ============================================================
    // ХВИЛІ
    // ============================================================
    function startWave() {
        game.wave++;
        game.enemiesSpawned = 0;
        game.enemiesInWave = 5 + game.wave * 3;
        game.enemyTimer = 0;
        document.getElementById('wave').textContent = game.wave;
    }

    function spawnEnemy() {
        const w = canvas.width, h = canvas.height;
        let x, y;
        const side = Math.floor(Math.random() * 4);
        switch(side) {
            case 0: x = -20; y = Math.random() * h; break; // ліворуч
            case 1: x = w + 20; y = Math.random() * h; break; // праворуч
            case 2: x = Math.random() * w; y = -20; break; // зверху
            case 3: x = Math.random() * w; y = h + 20; break; // знизу
        }

        // Тип ворога залежно від хвилі
        let type = 'normal';
        const r = Math.random();
        if (game.wave >= 3 && r < 0.25) type = 'fast';
        else if (game.wave >= 5 && r < 0.15) type = 'tank';
        else if (game.wave >= 2 && r < 0.3) type = 'fast';

        game.enemies.push(new Enemy(x, y, type));
        game.enemiesSpawned++;
    }

    // ============================================================
    // ОБРОБКА
    // ============================================================
    function update() {
        if (!game.running || !player.alive) return;

        // Рух гравця
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy = -1;
        if (keys['s'] || keys['arrowdown']) dy = 1;
        if (keys['a'] || keys['arrowleft']) dx = -1;
        if (keys['d'] || keys['arrowright']) dx = 1;

        if (dx !== 0 && dy !== 0) {
            dx *= 0.707;
            dy *= 0.707;
        }

        const w = canvas.width, h = canvas.height;
        player.x = Math.max(player.r, Math.min(w - player.r, player.x + dx * player.speed));
        player.y = Math.max(player.r, Math.min(h - player.r, player.y + dy * player.speed));

        // Напрям до миші
        const rect = canvas.getBoundingClientRect();
        const msx = mx || w/2;
        const msy = my || h/2;
        player.angle = Math.atan2(msy - player.y, msx - player.x);

        // Стрільба
        if (player.shootCooldown > 0) player.shootCooldown--;

        // Хвилі
        if (game.enemiesSpawned < game.enemiesInWave) {
            game.enemyTimer++;
            const spawnRate = Math.max(10, 30 - game.wave * 2);
            if (game.enemyTimer >= spawnRate) {
                game.enemyTimer = 0;
                spawnEnemy();
            }
        } else if (game.enemies.length === 0) {
            startWave();
        }

        // Вороги
        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            e.update();

            // Зіткнення з гравцем
            const dist = Math.sqrt((player.x - e.x) ** 2 + (player.y - e.y) ** 2);
            if (dist < player.r + e.r) {
                player.hp -= e.damage * 0.5;
                spawnParticles(e.x, e.y, 'rgba(200,50,50,0.4)', 3, 10);
                game.enemies.splice(i, 1);
                if (player.hp <= 0) {
                    player.hp = 0;
                    player.alive = false;
                    endGame();
                }
                continue;
            }

            // Зіткнення з кулями
            for (let j = game.bullets.length - 1; j >= 0; j--) {
                const b = game.bullets[j];
                const bd = Math.sqrt((b.x - e.x) ** 2 + (b.y - e.y) ** 2);
                if (bd < e.r + b.r) {
                    const killed = e.takeDamage(1);
                    game.bullets.splice(j, 1);
                    spawnParticles(b.x, b.y, 'rgba(150,200,255,0.3)', 2, 8);
                    if (killed) {
                        game.score += e.score;
                        spawnParticles(e.x, e.y, 'rgba(200,100,50,0.5)', 4, 15);
                        game.enemies.splice(i, 1);
                        document.getElementById('score').textContent = game.score;
                    }
                    break;
                }
            }
        }

        // Кулі
        for (let i = game.bullets.length - 1; i >= 0; i--) {
            game.bullets[i].update();
            if (game.bullets[i].isDead()) {
                game.bullets.splice(i, 1);
            }
        }

        // Частинки
        for (let i = game.particles.length - 1; i >= 0; i--) {
            game.particles[i].update();
            if (game.particles[i].isDead()) {
                game.particles.splice(i, 1);
            }
        }

        // HUD
        document.getElementById('hp').textContent = Math.round(player.hp);
        document.getElementById('hpFill').style.width = (player.hp / player.maxHp * 100) + '%';
    }

    // ============================================================
    // СТРІЛЬБА
    // ============================================================
    function shoot() {
        if (!game.running || !player.alive || player.shootCooldown > 0) return;
        player.shootCooldown = player.shootDelay;
        const bullet = new Bullet(player.x, player.y, player.angle);
        game.bullets.push(bullet);

        // Віддача — невеликий імпульс
        player.x -= Math.cos(player.angle) * 0.5;
        player.y -= Math.sin(player.angle) * 0.5;
    }

    // ============================================================
    // ЧАСТИНКИ
    // ============================================================
    function spawnParticles(x, y, color, count, life) {
        for (let i = 0; i < count; i++) {
            game.particles.push(new Particle(x, y, color, 3, life));
        }
    }

    // ============================================================
    // РЕНДЕР
    // ============================================================
    function render() {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        // Фон — глибокий темно-синій
        const bgGrad = ctx.createRadialGradient(player.x, player.y, 50, player.x, player.y, 400);
        bgGrad.addColorStop(0, '#0a1016');
        bgGrad.addColorStop(1, '#05080a');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        // Сітка (атмосфера)
        ctx.strokeStyle = 'rgba(255,255,255,0.01)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x < w; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h);
            ctx.stroke();
        }
        for (let y = 0; y < h; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
        }

        // Світло гравця
        drawLight();

        // Частинки
        for (const p of game.particles) { p.draw(); }

        // Вороги
        for (const e of game.enemies) { e.draw(e.x, e.y); }

        // Кулі
        for (const b of game.bullets) { b.draw(b.x, b.y); }

        // Гравець
        if (player.alive) {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Сяйво
            const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
            glow.addColorStop(0, 'rgba(100,150,200,0.08)');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fill();

            // Тіло
            ctx.fillStyle = 'rgba(180,220,255,0.2)';
            ctx.beginPath();
            ctx.arc(0, 0, player.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(180,220,255,0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, player.r, 0, Math.PI * 2);
            ctx.stroke();

            // "Ствол" (напрям)
            ctx.strokeStyle = 'rgba(180,220,255,0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(player.angle) * player.r * 1.5, Math.sin(player.angle) * player.r * 1.5);
            ctx.stroke();

            ctx.restore();
        }

        // Якщо гра закінчена
        if (!player.alive) {
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(0, 0, w, h);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255,100,100,0.15)';
            ctx.font = '28px sans-serif';
            ctx.fillText('💀', w/2, h/2 - 20);
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.font = '12px sans-serif';
            ctx.fillText('Натисни Пробіл', w/2, h/2 + 20);
        }
    }

    // ============================================================
    // УПРАВЛІННЯ
    // ============================================================
    document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ' && game.running && !player.alive) {
            restartGame();
        }
    });
    document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mx = (e.clientX - rect.left) / rect.width * canvas.width;
        my = (e.clientY - rect.top) / rect.height * canvas.height;
    });

    canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        if (e.button === 0) shoot();
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Авто-стрільба тримаючи кнопку
    let mouseDown = false;
    canvas.addEventListener('mousedown', () => mouseDown = true);
    canvas.addEventListener('mouseup', () => mouseDown = false);
    canvas.addEventListener('mouseleave', () => mouseDown = false);

    // ============================================================
    // ЦИКЛ
    // ============================================================
    function gameLoop() {
        if (mouseDown && game.running) shoot();
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // ЗАПУСК
    // ============================================================
    function startGame() {
        document.getElementById('overlay').classList.remove('show');
        game.running = true;
        player.alive = true;
        player.hp = player.maxHp;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        game.score = 0;
        game.wave = 0;
        game.enemies = [];
        game.bullets = [];
        game.particles = [];
        document.getElementById('score').textContent = '0';
        document.getElementById('hp').textContent = '100';
        document.getElementById('hpFill').style.width = '100%';
        startWave();
        gameLoop();
    }

    window.startGame = startGame;

    function restartGame() {
        startGame();
    }

    function endGame() {
        document.getElementById('overlay').classList.add('show');
        document.getElementById('overlay').innerHTML = `
            <h1>💀 ЗАГИБЕЛЬ</h1>
            <div class="sub">🎯 ${game.score} очок | 🌊 ${game.wave} хвиль</div>
            <button onclick="restartGame()">↺ Ще раз</button>
        `;
        game.running = false;
    }
</script>
</body>
</html>
