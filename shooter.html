<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тінь — 3D шутер</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none}
        body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif}
        canvas{display:block}

        #ui{
            position:fixed;top:0;left:0;right:0;bottom:0;
            pointer-events:none;z-index:10
        }

        #crosshair{
            position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%);
        }
        #crosshair::before,#crosshair::after{
            content:'';display:block;position:absolute;
            background:rgba(255,255,255,0.06);
        }
        #crosshair::before{width:2px;height:12px;top:-6px;left:-1px}
        #crosshair::after{width:12px;height:2px;top:-1px;left:-6px}
        #crosshair span{
            display:block;width:2px;height:2px;
            background:rgba(255,255,255,0.04);
        }

        #hud{
            position:absolute;bottom:20px;left:20px;right:20px;
            display:flex;justify-content:space-between;align-items:flex-end;
        }
        #hpSec{
            display:flex;flex-direction:column;gap:3px;
        }
        #hpSec .label{
            font-size:9px;letter-spacing:0.1em;color:rgba(255,255,255,0.06);
        }
        #hpBarW{
            width:150px;height:4px;background:rgba(255,255,255,0.02);
            border-radius:2px;overflow:hidden;
        }
        #hpBar{height:100%;width:100%;background:#3a7a5a;border-radius:2px;transition:width 0.15s}
        #hpBar.low{background:#8a2a2a}

        #scoreSec{
            text-align:right;
        }
        #scoreSec .num{font-size:22px;color:rgba(255,255,255,0.06);font-weight:200}
        #scoreSec .num b{color:rgba(255,255,255,0.15)}
        #scoreSec .wave{font-size:10px;color:rgba(255,255,255,0.04);letter-spacing:0.05em}

        #dmgs{
            position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            display:flex;flex-direction:column;align-items:center;gap:2px;
        }
        .dmg-num{
            font-size:16px;font-weight:600;
            color:rgba(255,200,100,0.3);text-shadow:0 0 10px rgba(255,200,100,0.1);
            transition:all 0.5s ease-out;
        }

        #startOverlay{
            position:fixed;top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.85);z-index:100;
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
            backdrop-filter:blur(8px);
        }
        #startOverlay h1{
            font-size:28px;font-weight:300;color:rgba(255,255,255,0.08);
            letter-spacing:0.2em;
        }
        #startOverlay .sub{
            font-size:11px;color:rgba(255,255,255,0.04);
        }
        #startOverlay button{
            padding:10px 30px;margin-top:6px;
            background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.04);
            border-radius:6px;color:rgba(255,255,255,0.1);
            font-size:12px;cursor:pointer;pointer-events:auto;font-family:inherit;
            transition:0.15s;
        }
        #startOverlay button:hover{
            background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.2);
        }
        #startOverlay .note{
            font-size:9px;color:rgba(255,255,255,0.02);
        }
        #startOverlay.hidden{display:none}
    </style>
</head>
<body>

<div id="startOverlay">
    <h1>🌑 ТІНЬ</h1>
    <div class="sub">3D шутер — клікни, щоб почати</div>
    <button onclick="startGame()">▶ ГРАТИ</button>
    <div class="note">WASD — рух · Миша — огляд · ЛКМ — стріляти · Shift — біг</div>
</div>

<div id="ui">
    <div id="crosshair"><span></span></div>
    <div id="dmgs"></div>
    <div id="hud">
        <div id="hpSec">
            <div id="hpBarW"><div id="hpBar"></div></div>
        </div>
        <div id="scoreSec">
            <div class="num"><b id="scr">0</b></div>
            <div class="wave" id="wave">ХВИЛЯ 0</div>
        </div>
    </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================
    // СЦЕНА
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040608);
    scene.fog = new THREE.FogExp2(0x040608, 0.0035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.prepend(renderer.domElement);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================
    // СВІТЛО
    // ============================================================
    const ambientLight = new THREE.AmbientLight(0x203050, 0.3);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x446688, 0.4);
    moonLight.position.set(-30, 40, -20);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 1024;
    moonLight.shadow.mapSize.height = 1024;
    scene.add(moonLight);

    const fillLight = new THREE.DirectionalLight(0x334466, 0.2);
    fillLight.position.set(20, 10, 30);
    scene.add(fillLight);

    // ============================================================
    // ЗЕМЛЯ
    // ============================================================
    const groundGeo = new THREE.PlaneGeometry(120, 120);
    const groundMat = new THREE.MeshStandardMaterial({
        color: 0x080c10,
        roughness: 0.95,
        metalness: 0.0,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ============================================================
    // ДЕРЕВА ТА ПЕРЕШКОДИ
    // ============================================================
    function createTree(x, z) {
        const g = new THREE.Group();

        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x181c20, roughness: 0.9 });
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 1.5, 5), trunkMat);
        trunk.position.y = 0.75;
        trunk.castShadow = true;
        g.add(trunk);

        const leafMat = new THREE.MeshStandardMaterial({ color: 0x0a0e12, roughness: 0.8 });
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2, 6), leafMat);
        leaf.position.y = 1.8;
        leaf.castShadow = true;
        g.add(leaf);
        const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.5, 6), leafMat);
        leaf2.position.y = 2.8;
        leaf2.castShadow = true;
        g.add(leaf2);

        g.position.set(x, 0, z);
        const r = Math.random() * Math.PI * 2;
        g.rotation.y = r;
        const s = 0.8 + Math.random() * 0.6;
        g.scale.set(s, s, s);
        return g;
    }

    // Дерева по колу
    for (let i = 0; i < 35; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = 10 + Math.random() * 40;
        const x = Math.cos(a) * d;
        const z = Math.sin(a) * d;
        scene.add(createTree(x, z));
    }

    // Камені-перешкоди
    function createRock(x, z) {
        const mat = new THREE.MeshStandardMaterial({
            color: 0x14181c, roughness: 0.9, metalness: 0.1
        });
        const geo = new THREE.DodecahedronGeometry(0.5 + Math.random() * 0.5);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 0.2, z);
        mesh.rotation.set(Math.random(), Math.random(), Math.random());
        mesh.scale.set(1, 0.6 + Math.random() * 0.3, 1);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
    }
    for (let i = 0; i < 20; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = 5 + Math.random() * 45;
        scene.add(createRock(Math.cos(a) * d, Math.sin(a) * d));
    }

    // ============================================================
    // ГРАВЕЦЬ (FPS камера)
    // ============================================================
    const player = {
        hp: 100,
        maxHp: 100,
        x: 0,
        z: 0,
        angle: 0,
        pitch: 0,
        speed: 5,
        sprintMult: 1.6,
        height: 1.8,
        shootCooldown: 0,
        shootDelay: 0.12, // секунд
        alive: true,
        invincible: 0,
    };

    // ============================================================
    // СТАН ГРИ
    // ============================================================
    const game = {
        score: 0,
        wave: 0,
        kills: 0,
        running: false,
        enemies: [],
        bullets: [],
        particles: [],
        damageNums: [],
        enemySpawned: 0,
        enemyCount: 0,
        spawnTimer: 0,
        timer: 0,
    };

    // ============================================================
    // ВОРОГИ
    // ============================================================
    const ENEMY_DEFS = {
        stalker: {
            r: 0.5, hp: 2, speed: 2.0, score: 15, damage: 10,
            color: 0xcc5533,
        },
        runner: {
            r: 0.35, hp: 1, speed: 4.5, score: 10, damage: 8,
            color: 0x5599cc,
        },
        brute: {
            r: 0.8, hp: 8, speed: 1.2, score: 40, damage: 25,
            color: 0x773355,
        },
        sniper: {
            r: 0.4, hp: 2, speed: 1.3, score: 30, damage: 8,
            color: 0x338855,
            ranged: true,
        },
        exploder: {
            r: 0.6, hp: 3, speed: 3.0, score: 25, damage: 40,
            color: 0xcc8822,
            explosion: true,
        },
    };

    class Enemy3D {
        constructor(x, z, type) {
            this.type = type;
            const def = ENEMY_DEFS[type];
            this.hp = def.hp;
            this.maxHp = def.hp;
            this.speed = def.speed;
            this.score = def.score;
            this.damage = def.damage;
            this.r = def.r;
            this.alive = true;
            this.hitFlash = 0;
            this.targetX = x;
            this.targetZ = z;
            this.angle = 0;
            this.wobble = Math.random() * Math.PI * 2;

            // 3D об'єкт
            this.group = new THREE.Group();
            this.group.position.set(x, 0, z);

            const bodyMat = new THREE.MeshStandardMaterial({
                color: def.color,
                roughness: 0.6,
                metalness: 0.2,
            });

            if (type === 'runner') {
                const body = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 6), bodyMat);
                body.position.y = 0.25;
                body.castShadow = true;
                this.group.add(body);
            } else if (type === 'brute') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.8, 2, 2, 2), bodyMat);
                body.position.y = 0.35;
                body.castShadow = true;
                this.group.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 6), bodyMat);
                head.position.y = 0.75;
                head.castShadow = true;
                this.group.add(head);
            } else if (type === 'exploder') {
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), bodyMat);
                body.position.y = 0.4;
                body.castShadow = true;
                this.group.add(body);
                // Сяйво
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0xffaa33,
                    transparent: true,
                    opacity: 0.2,
                });
                const glow = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), glowMat);
                glow.position.y = 0.4;
                this.group.add(glow);
                this.glowMesh = glow;
            } else if (type === 'sniper') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.6, 6), bodyMat);
                body.position.y = 0.3;
                body.castShadow = true;
                this.group.add(body);
                const eye = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 6, 6),
                    new THREE.MeshBasicMaterial({ color: 0x66ffaa })
                );
                eye.position.set(0, 0.4, 0.3);
                this.group.add(eye);
            } else {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 0.6, 6), bodyMat);
                body.position.y = 0.3;
                body.castShadow = true;
                this.group.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), bodyMat);
                head.position.y = 0.6;
                head.castShadow = true;
                this.group.add(head);
            }

            // Тінь під ногами
            const shadowMat = new THREE.MeshBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 0.15,
            });
            const shadow = new THREE.Mesh(new THREE.CircleGeometry(this.r, 8), shadowMat);
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = 0.01;
            this.group.add(shadow);
            this.shadowMesh = shadow;

            scene.add(this.group);

            // Спеціальні параметри
            if (def.ranged) {
                this.shootTimer = Math.random() * 2;
                this.shootDelay = 2.5;
                this.retreat = false;
            }
            if (def.explosion) {
                this.exploding = false;
                this.explosionTimer = 0;
            }
        }

        update(dt) {
            if (!this.alive) return;
            this.hitFlash = Math.max(0, this.hitFlash - dt * 10);

            const dx = player.x - this.group.position.x;
            const dz = player.z - this.group.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            this.angle = Math.atan2(dx, dz);

            this.wobble += dt * 3;

            // Поведінка
            let moveX = 0, moveZ = 0;
            let speed = this.speed;

            if (this.type === 'exploder' && dist < 8 && !this.exploding) {
                this.exploding = true;
                this.explosionTimer = 1.5;
            }

            if (this.exploding) {
                this.explosionTimer -= dt;
                // Блимає
                if (this.glowMesh) {
                    this.glowMesh.material.opacity = 0.2 + Math.sin(this.explosionTimer * 20) * 0.3;
                }
                speed = this.speed * 1.8;
                this.hitFlash = 0.3;
                if (this.explosionTimer <= 0) {
                    this.explode();
                    return;
                }
                if (dist > 0.5) {
                    moveX = dx / dist * speed;
                    moveZ = dz / dist * speed;
                }
            } else if (this.type === 'runner') {
                if (dist > 0.5) {
                    moveX = dx / dist * speed;
                    moveZ = dz / dist * speed;
                }
            } else if (this.type === 'brute') {
                const chargeSpeed = dist < 6 ? speed * 2 : speed;
                if (dist > 1) {
                    moveX = dx / dist * chargeSpeed;
                    moveZ = dz / dist * chargeSpeed;
                }
            } else if (this.type === 'sniper') {
                this.shootTimer += dt;
                if (this.shootTimer >= this.shootDelay && dist < 20 && dist > 3) {
                    this.shootTimer = 0;
                    spawnEnemyBullet(this.group.position.x, this.group.position.z, this.angle);
                }
                if (dist < 5) {
                    moveX = -dx / dist * speed;
                    moveZ = -dz / dist * speed;
                } else if (dist > 15) {
                    moveX = dx / dist * speed * 0.5;
                    moveZ = dz / dist * speed * 0.5;
                } else {
                    moveX = dx / dist * speed * 0.2;
                    moveZ = dz / dist * speed * 0.2;
                }
            } else {
                if (dist > 0.5) {
                    moveX = dx / dist * speed;
                    moveZ = dz / dist * speed;
                }
            }

            // Рух
            this.group.position.x += moveX * dt;
            this.group.position.z += moveZ * dt;

            // Обертання до гравця
            this.group.lookAt(player.x, 0, player.z);

            // Підстрибування
            this.group.position.y = Math.abs(Math.sin(this.wobble * 2)) * 0.05;

            // Тінь під ногами
            if (this.shadowMesh) {
                this.shadowMesh.position.y = 0.01;
            }

            // Зіткнення з гравцем
            const curDist = Math.sqrt((player.x - this.group.position.x) ** 2 + (player.z - this.group.position.z) ** 2);
            if (curDist < this.r + 0.5 && player.invincible <= 0) {
                player.hp -= this.damage;
                player.invincible = 0.5;
                if (player.hp <= 0) {
                    player.hp = 0;
                    player.alive = false;
                    endGame();
                }
            }
        }

        takeDamage(dmg) {
            this.hp -= dmg;
            this.hitFlash = 0.3;
            if (this.hp <= 0) {
                this.die();
                return true;
            }
            return false;
        }

        die() {
            this.alive = false;
            game.score += this.score;
            game.kills++;

            // Частинки смерті
            for (let i = 0; i < 15; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 0.5 + Math.random() * 2;
                spawnParticle(
                    this.group.position.x, 0.3, this.group.position.z,
                    Math.cos(a) * s, Math.random() * 0.5, Math.sin(a) * s,
                    0x885533, 0.8, 0.5 + Math.random() * 0.5
                );
            }

            scene.remove(this.group);
            // Dispose geometry & materials
            this.group.traverse(child => {
                if (child.isMesh) {
                    child.geometry.dispose();
                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material.dispose();
                }
            });
        }

        explode() {
            playExplosion();
            // Шкода гравцю
            const d = Math.sqrt((player.x - this.group.position.x) ** 2 + (player.z - this.group.position.z) ** 2);
            if (d < 5) {
                const f = 1 - d / 5;
                player.hp -= this.damage * f;
                if (player.hp <= 0) { player.hp = 0; player.alive = false; endGame(); }
            }
            // Частинки вибуху
            for (let i = 0; i < 30; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 1 + Math.random() * 4;
                spawnParticle(
                    this.group.position.x, 0.3, this.group.position.z,
                    Math.cos(a) * s, 0.5 + Math.random() * 2, Math.sin(a) * s,
                    0xff8833, 1.0, 0.3 + Math.random() * 0.4
                );
            }
            for (let i = 0; i < 15; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 0.5 + Math.random() * 1;
                spawnParticle(
                    this.group.position.x, 0.2, this.group.position.z,
                    Math.cos(a) * s, Math.random() * 0.5, Math.sin(a) * s,
                    0xaaaaaa, 0.3, 0.1 + Math.random() * 0.2
                );
            }
            game.shake = 0.3;
            scene.remove(this.group);
            this.alive = false;
        }
    }

    // ============================================================
    // КУЛІ
    // ============================================================
    class Bullet3D {
        constructor(x, y, z, angle) {
            const geo = new THREE.SphereGeometry(0.08, 6, 6);
            const mat = new THREE.MeshBasicMaterial({ color: 0xaaccff });
            this.mesh = new THREE.Mesh(geo, mat);
            this.mesh.position.set(x, y, z);
            scene.add(this.mesh);

            this.angle = angle;
            this.speed = 25;
            this.life = 1.5;
            this.alive = true;
        }

        update(dt) {
            if (!this.alive) return;
            this.mesh.position.x += Math.sin(this.angle) * this.speed * dt;
            this.mesh.position.z += Math.cos(this.angle) * this.speed * dt;
            this.life -= dt;
            this.mesh.position.y = 1.6;

            if (this.life <= 0) this.remove();

            // Хіт ворогів
            for (const e of game.enemies) {
                if (!e.alive) continue;
                const d = Math.sqrt(
                    (this.mesh.position.x - e.group.position.x) ** 2 +
                    (this.mesh.position.z - e.group.position.z) ** 2
                );
                if (d < e.r + 0.2) {
                    const killed = e.takeDamage(1);
                    playHit();
                    // Частинки
                    for (let i = 0; i < 5; i++) {
                        const a = Math.random() * Math.PI * 2;
                        spawnParticle(
                            this.mesh.position.x, 1.3, this.mesh.position.z,
                            Math.cos(a) * 0.5, Math.random() * 0.3, Math.sin(a) * 0.5,
                            0xaaccff, 0.3, 0.1 + Math.random() * 0.1
                        );
                    }
                    if (killed) {
                        playDeath();
                        showDamageNum(e.group.position.x, e.group.position.z, e.score);
                    }
                    this.remove();
                    break;
                }
            }
        }

        remove() {
            this.alive = false;
            scene.remove(this.mesh);
            this.mesh.geometry.dispose();
            this.mesh.material.dispose();
        }
    }

    // ============================================================
    // КУЛІ ВОРОГІВ
    // ============================================================
    function spawnEnemyBullet(x, z, angle) {
        const geo = new THREE.SphereGeometry(0.12, 6, 6);
        const mat = new THREE.MeshBasicMaterial({ color: 0x66ffaa });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 1.0, z);
        scene.add(mesh);

        game.enemyBullets.push({
            mesh, x, z, angle,
            speed: 8,
            life: 3,
            alive: true,
            update(dt) {
                this.x += Math.sin(this.angle) * this.speed * dt;
                this.z += Math.cos(this.angle) * this.speed * dt;
                this.mesh.position.set(this.x, 1.0, this.z);
                this.life -= dt;
                if (this.life <= 0) {
                    this.remove();
                    return;
                }
                const d = Math.sqrt((player.x - this.x) ** 2 + (player.z - this.z) ** 2);
                if (d < 0.5 && player.invincible <= 0) {
                    player.hp -= 8;
                    player.invincible = 0.3;
                    showDamageNum(player.x, player.z, 8);
                    this.remove();
                }
            },
            remove() {
                this.alive = false;
                scene.remove(this.mesh);
                this.mesh.geometry.dispose();
                this.mesh.material.dispose();
            }
        });
    }

    // ============================================================
    // ЧАСТИНКИ
    // ============================================================
    const particleMeshes = [];

    function spawnParticle(x, y, z, vx, vy, vz, color, opacity, size) {
        const geo = new THREE.SphereGeometry(size, 4, 4);
        const mat = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: opacity,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        particleMeshes.push({
            mesh, mat,
            vx, vy, vz,
            life: 0.5 + Math.random() * 0.5,
            alive: true,
        });
    }

    function updateParticles(dt) {
        for (let i = particleMeshes.length - 1; i >= 0; i--) {
            const p = particleMeshes[i];
            if (!p.alive) continue;
            p.mesh.position.x += p.vx * dt;
            p.mesh.position.y += p.vy * dt;
            p.mesh.position.z += p.vz * dt;
            p.vy -= 2 * dt; // гравітація
            p.life -= dt;
            p.mat.opacity = Math.max(0, p.life * 0.5);
            if (p.life <= 0) {
                p.alive = false;
                scene.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
                particleMeshes.splice(i, 1);
            }
        }
    }

    // ============================================================
    // DAMAGE NUMBERS (HTML)
    // ============================================================
    function showDamageNum(x, z, amount) {
        const container = document.getElementById('dmgs');
        const el = document.createElement('div');
        el.className = 'dmg-num';
        el.textContent = '+' + amount;
        el.style.opacity = '0.3';
        container.appendChild(el);
        setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(-10px)';
            setTimeout(() => el.remove(), 500);
        }, 100);
    }

    // ============================================================
    // ЗВУКИ (синтезовані)
    // ============================================================
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playShootSound() {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.06);
        } catch(e) {}
    }

    function playHitSound() {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.04);
        } catch(e) {}
    }

    function playDeathSound() {
        try {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.25);
        } catch(e) {}
    }

    function playExplosionSound() {
        try {
            initAudio();
            const bufSize = audioCtx.sampleRate * 0.3;
            const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.1));
            const noise = audioCtx.createBufferSource();
            noise.buffer = buf;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            noise.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start(audioCtx.currentTime);
        } catch(e) {}
    }

    function playShoot() { playShootSound(); }
    function playHit() { playHitSound(); }
    function playDeath() { playDeathSound(); }
    function playExplosion() { playExplosionSound(); }

    // ============================================================
    // ХВИЛІ
    // ============================================================
    function startWave() {
        game.wave++;
        game.enemySpawned = 0;
        game.enemyCount = 3 + game.wave * 2;
        game.spawnTimer = 0;
        document.getElementById('wave').textContent = 'ХВИЛЯ ' + game.wave;
    }

    function spawnEnemy() {
        const a = Math.random() * Math.PI * 2;
        const d = 15 + Math.random() * 10;
        const x = player.x + Math.cos(a) * d;
        const z = player.z + Math.sin(a) * d;

        let type = 'stalker';
        const r = Math.random();
        const w = game.wave;
        if (w >= 2 && r < 0.2) type = 'runner';
        else if (w >= 3 && r < 0.1) type = 'brute';
        else if (w >= 4 && r < 0.12) type = 'sniper';
        else if (w >= 3 && r < 0.15) type = 'runner';
        if (w >= 5 && r < 0.08) type = 'exploder';

        const e = new Enemy3D(x, z, type);
        game.enemies.push(e);
        game.enemySpawned++;
    }

    // ============================================================
    // ПОЧАТОК ГРИ
    // ============================================================
    let running = false;
    let lastTime = 0;
    let gameLoopId = null;

    window.startGame = function() {
        document.getElementById('startOverlay').classList.add('hidden');

        // Pointer lock
        renderer.domElement.requestPointerLock();

        player.hp = player.maxHp;
        player.alive = true;
        player.x = 0;
        player.z = 0;
        player.invincible = 1;
        camera.position.set(0, player.height, 0);

        game.score = 0;
        game.wave = 0;
        game.kills = 0;
        game.enemies = [];
        game.bullets = [];
        game.enemyBullets = [];
        game.shake = 0;

        // Очистити частинки
        for (const p of particleMeshes) {
            scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
        }
        particleMeshes.length = 0;

        document.getElementById('scr').textContent = '0';
        document.getElementById('hpBar').style.width = '100%';

        startWave();
        running = true;
        lastTime = performance.now();

        if (gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoop();
    };

    // ============================================================
    // ВИХІД
    // ============================================================
    function endGame() {
        running = false;
        document.getElementById('startOverlay').classList.remove('hidden');
        document.getElementById('startOverlay').querySelector('h1').textContent = '💀 ЗАГИБЕЛЬ';
        document.getElementById('startOverlay').querySelector('.sub').innerHTML =
            `🎯 ${game.score} очок · 🌊 ${game.wave} хвиль`;
        document.getElementById('startOverlay').querySelector('button').textContent = '↺ ЩЕ РАЗ';
        document.exitPointerLock();
    }

    // ============================================================
    // ОБРОБКА КЕРУВАННЯ
    // ============================================================
    const keys = {};

    document.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ') e.preventDefault();
    });
    document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    // Pointer lock
    document.addEventListener('click', () => {
        if (running && !document.pointerLockElement) {
            renderer.domElement.requestPointerLock();
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (!document.pointerLockElement || !running) return;
        const sensitivity = 0.002;
        camera.rotation.y -= e.movementX * sensitivity;
        camera.rotation.x -= e.movementY * sensitivity;
        camera.rotation.x = Math.max(-1.2, Math.min(1.2, camera.rotation.x));
    });

    document.addEventListener('mousedown', (e) => {
        if (e.button === 0 && running) shoot();
    });
    document.addEventListener('mouseup', (e) => {
        if (e.button === 0) mousePressed = false;
    });

    let mousePressed = false;

    // ============================================================
    // СТРІЛЬБА
    // ============================================================
    function shoot() {
        if (!running || !player.alive || player.shootCooldown > 0) return;
        player.shootCooldown = player.shootDelay;
        playShoot();

        const angle = camera.rotation.y;
        const spread = (Math.random() - 0.5) * 0.04;
        const b = new Bullet3D(player.x, 1.5, player.z, angle + spread);
        game.bullets.push(b);
    }

    // ============================================================
    // ГОЛОВНИЙ ЦИКЛ
    // ============================================================
    function gameLoop() {
        if (!running) return;

        const now = performance.now();
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        // Рух гравця
        const sprint = keys['shift'] ? player.sprintMult : 1;
        let mx = 0, mz = 0;
        if (keys['w'] || keys['arrowup']) mz = -1;
        if (keys['s'] || keys['arrowdown']) mz = 1;
        if (keys['a'] || keys['arrowleft']) mx = -1;
        if (keys['d'] || keys['arrowright']) mx = 1;
        if (mx && mz) { mx *= 0.707; mz *= 0.707; }

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        forward.y = 0;
        right.y = 0;
        forward.normalize();
        right.normalize();

        const speed = player.speed * sprint * dt;
        player.x += (forward.x * mz + right.x * mx) * speed;
        player.z += (forward.z * mz + right.z * mx) * speed;

        // Межі світу
        const bound = 55;
        player.x = Math.max(-bound, Math.min(bound, player.x));
        player.z = Math.max(-bound, Math.min(bound, player.z));

        // Позиція камери
        camera.position.x = player.x;
        camera.position.z = player.z;

        // Хитання при ходьбі
        if (mx !== 0 || mz !== 0) {
            const bobSpeed = sprint === 1 ? 6 : 3;
            const bobAmp = sprint === 1 ? 0.02 : 0.01;
            game.timer += dt * bobSpeed;
            camera.position.y = player.height + Math.sin(game.timer) * bobAmp;
        } else {
            camera.position.y = player.height;
        }

        // Кулдаун
        if (player.shootCooldown > 0) player.shootCooldown -= dt;
        if (player.invincible > 0) player.invincible -= dt;
        if (game.shake > 0) game.shake -= dt;
        if (game.shake < 0) game.shake = 0;

        // Спавн ворогів
        if (game.enemySpawned < game.enemyCount) {
            game.spawnTimer += dt;
            if (game.spawnTimer >= 1.0) {
                game.spawnTimer = 0;
                spawnEnemy();
            }
        }

        // Оновлення ворогів
        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            e.update(dt);
            if (!e.alive) {
                game.enemies.splice(i, 1);
            }
        }

        // Оновлення куль
        for (let i = game.bullets.length - 1; i >= 0; i--) {
            const b = game.bullets[i];
            b.update(dt);
            if (!b.alive) game.bullets.splice(i, 1);
        }

        // Оновлення куль ворогів
        for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
            const b = game.enemyBullets[i];
            if (!b.alive) { game.enemyBullets.splice(i, 1); continue; }
            b.update(dt);
        }

        // Оновлення частинок
        updateParticles(dt);

        // Перевірка хвилі
        if (game.enemySpawned >= game.enemyCount && game.enemies.length === 0) {
            startWave();
        }

        // HUD
        document.getElementById('scr').textContent = game.score;
        const hpPct = player.hp / player.maxHp * 100;
        document.getElementById('hpBar').style.width = Math.max(0, hpPct) + '%';
        document.getElementById('hpBar').className = hpPct < 30 ? 'low' : '';

        // Смерть гравця
        if (!player.alive) {
            endGame();
            return;
        }

        // Рендер
        if (game.shake > 0) {
            const s = game.shake * 2;
            camera.position.x += (Math.random() - 0.5) * s * 0.01;
            camera.position.z += (Math.random() - 0.5) * s * 0.01;
        }

        // Стрільба за триманням кнопки
        if (mousePressed) shoot();

        renderer.render(scene, camera);
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    // ============================================================
    // АВТОЗАПУСК ЦИКЛУ (очікує старту)
    // ============================================================
    function idleLoop() {
        if (!running) {
            renderer.render(scene, camera);
            requestAnimationFrame(idleLoop);
        }
    }
    idleLoop();

    // ============================================================
    // ПОЧАТКОВИЙ СТАН
    // ============================================================
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);

</script>
</body>
