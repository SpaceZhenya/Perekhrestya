<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sandbox — симуляція світу</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #060a0e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
            overflow: hidden;
            color: #c8d0d0;
            height: 100vh;
        }

        #app {
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: 1fr 200px;
            height: 100vh;
            gap: 1px;
            background: rgba(255,255,255,0.03);
        }

        /* ========== КАРТА ========== */
        #map-wrap {
            grid-column: 1;
            grid-row: 1;
            position: relative;
            background: #080c12;
            overflow: hidden;
        }
        #map-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #map-overlay {
            position: absolute;
            top: 16px; left: 16px;
            display: flex; flex-direction: column; gap: 8px;
            pointer-events: none;
        }
        #map-overlay .info-box {
            background: rgba(6,8,12,0.8);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 8px 14px;
            pointer-events: auto;
            backdrop-filter: blur(6px);
        }
        #map-overlay .info-box .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.25);
        }
        #map-overlay .info-box .value {
            font-size: 22px;
            font-weight: 600;
            color: #e0e8e8;
            margin-top: 2px;
        }
        #map-overlay .info-box .value.good { color: #44cc66; }
        #map-overlay .info-box .value.bad { color: #ff4466; }

        /* ========== ПРАВА ПАНЕЛЬ ========== */
        #right {
            grid-column: 2;
            grid-row: 1 / span 2;
            background: #080c12;
            border-left: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #right .panel-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        #right .panel-header h2 {
            font-size: 13px;
            font-weight: 600;
            color: #d0d8d8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        #right .panel-header .sub {
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            margin-top: 2px;
        }
        #right .panel-header .day-display {
            font-size: 28px;
            font-weight: 700;
            color: #e8f0f0;
            margin-top: 6px;
        }
        #right .panel-header .day-display small {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255,255,255,0.25);
        }

        #news-feed {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
        }
        #news-feed::-webkit-scrollbar { width: 4px; }
        #news-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 2px; }

        .news-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            animation: fadeIn 0.4s ease-out;
        }
        .news-item:last-child { border-bottom: none; }
        .news-item .news-day {
            font-size: 10px;
            color: rgba(255,255,255,0.15);
            margin-bottom: 2px;
        }
        .news-item .news-text {
            font-size: 12px;
            line-height: 1.4;
            color: rgba(255,255,255,0.7);
        }
        .news-item .news-text .highlight { color: #66aaff; }
        .news-item .news-text .bad { color: #ff4466; }
        .news-item .news-text .good { color: #44cc66; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== НИЖНЯ ПАНЕЛЬ ========== */
        #bottom {
            grid-column: 1;
            grid-row: 2;
            background: #080c12;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #bottom .tabs {
            display: flex;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        #bottom .tabs button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.25);
            padding: 8px 16px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        #bottom .tabs button:hover { color: rgba(255,255,255,0.5); }
        #bottom .tabs button.active { color: #e0e8e8; border-bottom-color: #4488cc; background: rgba(68,136,204,0.04); }
        #bottom .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: none;
        }
        #bottom .tab-content.active { display: block; }
        #bottom .tab-content::-webkit-scrollbar { width: 4px; }
        #bottom .tab-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 12px;
        }
        .stat-row .stat-label { color: rgba(255,255,255,0.4); }
        .stat-row .stat-val { color: rgba(255,255,255,0.7); }
        .stat-row .stat-val.good { color: #44cc66; }
        .stat-row .stat-val.bad { color: #ff4466; }

        /* ========== ПАНЕЛЬ ПОДІЙ ========== */
        #event-panel {
            position: absolute;
            bottom: 16px;
            left: 16px;
            z-index: 10;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .event-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(6,8,12,0.75);
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .event-btn:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.1);
            color: #e0e8e8;
        }
        .event-btn:active { transform: scale(0.96); }
        .event-btn.used {
            opacity: 0.3;
            pointer-events: none;
            text-decoration: line-through;
        }

        /* ========== ПОЛОСА ПРОГРЕСУ ========== */
        #progress-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: rgba(255,255,255,0.04);
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4488cc, #66aaff);
            transition: width 0.3s;
        }

        #pause-btn {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            background: rgba(68,136,204,0.15);
            border: 1px solid rgba(68,136,204,0.2);
            color: #66aaff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            z-index: 10;
        }
        #pause-btn:hover { background: rgba(68,136,204,0.25); }

        @media (max-width: 900px) {
            #app {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr auto 200px;
            }
            #right { grid-column: 1; grid-row: 2; height: 200px; border-left: none; border-top: 1px solid rgba(255,255,255,0.04); }
            #bottom { grid-row: 3; }
        }
    </style>
</head>
<body>

                climate: +25, oil: +30, gold: +500,
            },
            news: [
                '☄️ АСТЕРОЇД! 500-метровий об\'єкт падає в Атлантику.',
                '🌊 Гігантське цунамі накриває узбережжя Європи та США.',
                '🏙️ Нью-Йорк, Лондон, Лісабон — під водою.',
                '📉 Біржі закриті. Падіння на 40%.',
                '🌫️ Пилюка в атмосфері. Температура падає на 2°C.',
                '🚨 Надзвичайний стан у 20 країнах.',

    const EVENT_LIST = Object.keys(EVENTS);

    // ============================================================
    // РЕНДЕР КАРТИ
    // ============================================================
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let mapW, mapH;

    function resizeMap() {
        const rect = document.getElementById('map-wrap').getBoundingClientRect();
        mapW = canvas.width = rect.width;
        mapH = canvas.height = rect.height;
    }

    // Спрощена карта світу — полігони
    const MAP_DATA = [
        // [label, cx, cy, rx, ry, colorKey]
        { label: 'usa',   x: 0.20, y: 0.38, rx: 0.15, ry: 0.12, key: 'usa' },
        { label: 'eu',    x: 0.48, y: 0.35, rx: 0.08, ry: 0.10, key: 'eu' },
        { label: 'cn',    x: 0.73, y: 0.38, rx: 0.10, ry: 0.10, key: 'cn' },
        { label: 'ru',    x: 0.60, y: 0.22, rx: 0.18, ry: 0.12, key: 'ru' },
        { label: 'jp',    x: 0.85, y: 0.40, rx: 0.04, ry: 0.06, key: 'jp' },
        { label: 'in',    x: 0.67, y: 0.55, rx: 0.05, ry: 0.08, key: 'in' },
        { label: 'br',    x: 0.35, y: 0.72, rx: 0.07, ry: 0.08, key: 'br' },
        { label: 'au',    x: 0.82, y: 0.75, rx: 0.06, ry: 0.04, key: 'au' },
        { label: 'kr',    x: 0.80, y: 0.38, rx: 0.02, ry: 0.04, key: 'kr' },
        { label: 'ua',    x: 0.53, y: 0.35, rx: 0.02, ry: 0.03, key: 'ua' },
    ];

    function getCountryColor(key) {
        const c = countries[key];
        if (!c) return '#1a2a3a';
        const s = c.stability;
        if (s > 75) return '#1a3a2a';
        if (s > 50) return '#3a3a1a';
        if (s > 25) return '#3a2a1a';
        return '#3a1a1a';
    }

    function getCountryStability(key) {
        const c = countries[key];
        return c ? c.stability : 50;
    }

    function drawMap() {
        ctx.clearRect(0, 0, mapW, mapH);

        // Океан
        const grad = ctx.createRadialGradient(mapW/2, mapH/2, 0, mapW/2, mapH/2, mapW);
        grad.addColorStop(0, '#0c1420');
        grad.addColorStop(1, '#060a10');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, mapW, mapH);

        // Сітка (широти)
        ctx.strokeStyle = 'rgba(255,255,255,0.02)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(0, mapH * (0.15 + i * 0.175));
            ctx.lineTo(mapW, mapH * (0.15 + i * 0.175));
            ctx.stroke();
        }

        // Країни — еліпси
        MAP_DATA.forEach(m => {
            const x = m.x * mapW;
            const y = m.y * mapH;
            const rx = m.rx * mapW;
            const ry = m.ry * mapH;
            const color = getCountryColor(m.key);
            const stable = getCountryStability(m.key);

            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            // Назва країни
            ctx.fillStyle = `rgba(255,255,255,${0.2 + stable * 0.004})`;
            ctx.font = `${10 + stable * 0.02}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(countries[m.key]?.name || m.label, x, y);
        });

        // Ефекти подій (хвилі, вогники)
        if (currentEvent === 'asteroid') {
            const cx = 0.4 * mapW, cy = 0.55 * mapH;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.arc(cx, cy, 20 + i * 25, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,80,60,${0.15 - i * 0.015})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        } else if (currentEvent === 'no-internet') {
            // Темні плями над містами
            MAP_DATA.forEach(m => {
                if (['usa','eu','cn','jp','kr'].includes(m.key)) {
                    const x = m.x * mapW; const y = m.y * mapH;
                    ctx.fillStyle = 'rgba(20,10,10,0.15)';
                    ctx.beginPath();
                    ctx.arc(x, y, 40, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        } else if (currentEvent === 'fusion') {
            // Сяйво
            ctx.fillStyle = 'rgba(68,200,255,0.03)';
            ctx.fillRect(0, 0, mapW, mapH);
        }
    }

    // ============================================================
    // ЛОГІКА СИМУЛЯЦІЇ
    // ============================================================
    function updateGlobalStatus() {
        const el = document.getElementById('globalStatus');
        const s = world.stability;
        if (s > 70) { el.textContent = '✅ СТАБІЛЬНО'; el.className = 'value good'; }
        else if (s > 40) { el.textContent = '⚠️ НЕСТАБІЛЬНО'; el.className = 'value'; }
        else if (s > 20) { el.textContent = '🔴 КРИЗА'; el.className = 'value bad'; }
        else { el.textContent = '☠️ КОЛАПС'; el.className = 'value bad'; }
    }

    function getWorldHealth() {
        return (world.stability + world.economy + world.internet + world.energyIndex) / 4;
    }

    function advanceDay() {
        if (isPaused || day >= SIM_DAYS) return;

        day++;
        document.getElementById('dayDisplay').innerHTML = `День ${day} <small>з ${SIM_DAYS}</small>`;

        // Погіршення від події
        if (currentEvent && EVENTS[currentEvent]) {
            const e = EVENTS[currentEvent];
            const decay = day / SIM_DAYS; // наростає
            for (const [key, val] of Object.entries(e.effects)) {
                if (world[key] !== undefined) {
                    world[key] = Math.max(0, Math.min(100, world[key] + val * 0.15 * decay));
                }
            }
            // Спеціальні ефекти
            if (currentEvent === 'no-internet') {
                world.gdp = Math.max(30, world.gdp - 0.5);
                world.unemployment = Math.min(30, world.unemployment + 0.4);
                world.inflation = Math.min(30, world.inflation + 0.6);
                world.crypto = Math.max(5000, world.crypto - 400);
            } else if (currentEvent === 'fusion') {
                world.gdp = Math.min(200, world.gdp + 1.5);
                world.unemployment = Math.max(2, world.unemployment - 0.2);
                world.inflation = Math.max(1, world.inflation - 0.15);
                world.oil = Math.max(20, world.oil - 1.5);
            } else if (currentEvent === 'ai-ban') {
                world.gdp = Math.max(40, world.gdp - 0.8);
                world.unemployment = Math.min(25, world.unemployment + 0.5);
                companies.forEach(c => { if (c.sector === 'tech') c.value *= 0.92; });
            } else if (currentEvent === 'no-gps') {
                world.gdp = Math.max(50, world.gdp - 0.4);
                world.oil = Math.min(120, world.oil + 0.5);
                companies.forEach(c => { if (c.sector === 'aero' || c.sector === 'auto') c.value *= 0.94; });
            } else if (currentEvent === 'asteroid') {
                world.gdp = Math.max(20, world.gdp - 1.2);
                world.unemployment = Math.min(30, world.unemployment + 0.6);
                world.gold = Math.min(5000, world.gold + 50);
                world.stockMarket = Math.max(500, world.stockMarket - 80);
            }
        }

        // Випадкові невеликі коливання
        world.stockMarket += (Math.random() - 0.5) * 60;
        world.stockMarket = Math.max(500, Math.min(10000, world.stockMarket));
        world.gold += (Math.random() - 0.5) * 20;

        // Оновлення країн
        for (const key in countries) {
            const c = countries[key];
            const drift = (Math.random() - 0.5) * 2;
            c.stability = Math.max(5, Math.min(100, c.stability + drift));
            if (currentEvent === 'no-internet') {
                if (['usa','eu','cn','jp','kr'].includes(key)) c.stability -= 1.5;
            }
            if (currentEvent === 'fusion') {
                c.stability += 0.5;
                c.tech += 0.3;
            }
        }

        // Новина
        addNews();

        // Оновлення UI
        updateGlobalStatus();
        updateTabs();
        updateCompanies();
        drawMap();
        updateProgress();
    }

    function addNews() {
        let text = '';
        let style = '';

        if (currentEvent && EVENTS[currentEvent]) {
            const e = EVENTS[currentEvent];
            if (e.news && day <= e.news.length) {
                text = e.news[day - 1];
            } else {
                // Автогенерація
                const templates = [
                    `🌍 День ${day}. Ситуація продовжує розвиватися.`,
                    `📊 Світові ринки реагують: ${world.stockMarket > 4000 ? 'зростання 📈' : 'падіння 📉'}`,
                    `🏛️ Уряди ${world.stability > 50 ? 'стабілізують' : 'намагаються контролювати'} ситуацію.`,
                    `💱 Курс золота: $${Math.round(world.gold)} за унцію.`,
                    `🛢️ Нафта: $${Math.round(world.oil)} за барель.`,
                    `📈 Безробіття: ${world.unemployment.toFixed(1)}%`,
                    `🌾 Сільське господарство ${world.climate > 60 ? 'страждає від клімату' : 'відносно стабільне'}.`,
                    `🔬 Індекс технологій: ${Math.round(world.aiIndex)}/100`,
                ];
                text = templates[(day + newsId) % templates.length];
            }
        } else {
            text = `🌍 День ${day}. Світ у нормі. Економіка: ${Math.round(world.economy)}%.`;
        }

        if (currentEvent === 'fusion' && text.includes('зростання')) style = 'good';
        else if (currentEvent === 'asteroid') style = 'bad';
        else if (world.stability < 30) style = 'bad';

        newsId++;
        const feed = document.getElementById('news-feed');
        const item = document.createElement('div');
        item.className = 'news-item';
        item.innerHTML = `<div class="news-day">День ${day}</div><div class="news-text${style ? ' '+style : ''}">${text}</div>`;
        feed.prepend(item);

        // Обмеження
        while (feed.children.length > 30) {
            feed.removeChild(feed.lastChild);
        }
    }

    function updateProgress() {
        const pct = (day / SIM_DAYS) * 100;
        document.getElementById('progress-fill').style.width = Math.min(100, pct) + '%';
    }

    // ============================================================
    // ТАБИ — ЕКОНОМІКА, ДЕРЖАВИ, КОМПАНІЇ, ТЕХ
    // ============================================================
    function updateTabs() {
        // Економіка
        const ec = document.getElementById('tab-economy');
        ec.innerHTML = `
            <div class="stat-row"><span class="stat-label">🌐 Світовий ВВП</span><span class="stat-val">$${world.gdp.toFixed(1)} трлн</span></div>
            <div class="stat-row"><span class="stat-label">📈 S&P 500</span><span class="stat-val${world.stockMarket > 4000 ? ' good' : ' bad'}">${Math.round(world.stockMarket)}</span></div>
            <div class="stat-row"><span class="stat-label">💰 Інфляція</span><span class="stat-val${world.inflation > 8 ? ' bad' : world.inflation < 4 ? ' good' : ''}">${world.inflation.toFixed(1)}%</span></div>
            <div class="stat-row"><span class="stat-label">👷 Безробіття</span><span class="stat-val${world.unemployment > 10 ? ' bad' : ''}">${world.unemployment.toFixed(1)}%</span></div>
            <div class="stat-row"><span class="stat-label">🛢️ Нафта</span><span class="stat-val">$${world.oil.toFixed(1)}</span></div>
            <div class="stat-row"><span class="stat-label">🥇 Золото</span><span class="stat-val${world.gold > 3000 ? ' bad' : ''}">$${Math.round(world.gold)}</span></div>
            <div class="stat-row"><span class="stat-label">₿ Bitcoin</span><span class="stat-val${world.crypto < 10000 ? ' bad' : world.crypto > 50000 ? ' good' : ''}">$${Math.round(world.crypto).toLocaleString()}</span></div>
            <div class="stat-row"><span class="stat-label">🌍 Стабільність</span><span class="stat-val${world.stability > 70 ? ' good' : world.stability < 40 ? ' bad' : ''}">${Math.round(world.stability)}/100</span></div>
        `;

        // Держави
        const ct = document.getElementById('tab-countries');
        ct.innerHTML = '';
        const sorted = Object.entries(countries).sort((a, b) => b[1].stability - a[1].stability);
        sorted.forEach(([key, c]) => {
            const row = document.createElement('div');
            row.className = 'stat-row';
            const color = c.stability > 70 ? 'good' : c.stability < 40 ? 'bad' : '';
            row.innerHTML = `<span class="stat-label">${c.name}</span><span class="stat-val ${color}">${Math.round(c.stability)}%</span>`;
            ct.appendChild(row);
        });

        // Компанії
        const co = document.getElementById('tab-companies');
        co.innerHTML = '';
        const sortedCo = [...companies].sort((a, b) => b.value - a.value);
        sortedCo.forEach(c => {
            const row = document.createElement('div');
            row.className = 'stat-row';
            const change = c.impacted;
            const color = change > 0 ? 'good' : change < 0 ? 'bad' : '';
            row.innerHTML = `<span class="stat-label">${c.name}</span><span class="stat-val">$${c.value.toFixed(0)} млрд</span>`;
            co.appendChild(row);
        });

        // Технології
        const te = document.getElementById('tab-tech');
        te.innerHTML = `
            <div class="stat-row"><span class="stat-label">🤖 Індекс AI</span><span class="stat-val${world.aiIndex > 60 ? ' good' : ' bad'}">${Math.round(world.aiIndex)}/100</span></div>
            <div class="stat-row"><span class="stat-label">🔋 Енергетика</span><span class="stat-val${world.energyIndex > 70 ? ' good' : ' bad'}">${Math.round(world.energyIndex)}/100</span></div>
            <div class="stat-row"><span class="stat-label">🌡️ Клімат</span><span class="stat-val${world.climate < 50 ? ' good' : ' bad'}">${world.climate < 50 ? 'Стабільний' : 'Погіршується'}</span></div>
            <div class="stat-row"><span class="stat-label">📡 Інтернет</span><span class="stat-val${world.internet > 50 ? ' good' : ' bad'}">${Math.round(world.internet)}%</span></div>
            <div class="stat-row"><span class="stat-label">🛰 GPS</span><span class="stat-val${world.gps > 50 ? ' good' : ' bad'}">${Math.round(world.gps)}%</span></div>
            <div class="stat-row"><span class="stat-label">🌐 Доступ до мережі</span><span class="stat-val">${world.internet > 50 ? '🟢 Онлайн' : '🔴 Офлайн'}</span></div>
        `;
    }

    function updateCompanies() {
        companies.forEach(c => {
            if (currentEvent === 'no-internet' && c.sector === 'tech') {
                c.value *= (0.95 + Math.random() * 0.03);
                c.impacted = -1;
            } else if (currentEvent === 'fusion' && c.sector === 'energy') {
                c.value *= (0.9 + Math.random() * 0.02);
                c.impacted = -1;
            } else if (currentEvent === 'fusion' && c.sector === 'tech') {
                c.value *= (1.05 + Math.random() * 0.03);
                c.impacted = 1;
            } else if (currentEvent === 'ai-ban' && c.sector === 'tech') {
                c.value *= (0.7 + Math.random() * 0.05);
                c.impacted = -1;
            } else if (currentEvent === 'asteroid') {
                c.value *= (0.85 + Math.random() * 0.05);
                c.impacted = -1;
            } else {
                c.value *= (1 + (Math.random() - 0.5) * 0.02);
                c.impacted = 0;
            }
            c.value = Math.max(10, c.value);
        });
    }

    // ============================================================
    // ЗАПУСК ПОДІЇ
    // ============================================================
    function startEvent(eventId) {
        if (currentEvent) return; // вже є подія
        currentEvent = eventId;
        const ev = EVENTS[eventId];
        if (!ev) return;

        // Показати панель події
        const result = document.getElementById('eventResult');
        result.style.display = 'block';
        document.getElementById('eventLabel').textContent = '⚡ ' + ev.name;
        document.getElementById('eventValue').textContent = ev.desc;
        document.getElementById('eventValue').className = 'value';

        // Позначити кнопку
        document.querySelectorAll('.event-btn').forEach(b => {
            if (b.dataset.event === eventId) b.classList.add('used');
        });

        // Скинути день
        day = 0;

        // Новина-заголовок
        const feed = document.getElementById('news-feed');
        const head = document.createElement('div');
        head.className = 'news-item';
        head.innerHTML = `<div class="news-day">⚡ ПОДІЯ</div><div class="news-text"><span class="highlight">${ev.name}</span> — ${ev.desc}</div>`;
        feed.prepend(head);

        // Старт симуляції
        setTimeout(tick, 500);
    }

    function tick() {
        if (day >= SIM_DAYS) {
            // Фінал
            const feed = document.getElementById('news-feed');
            const final = document.createElement('div');
            final.className = 'news-item';
            final.innerHTML = `<div class="news-day">🏁 ФІНАЛ</div>
                <div class="news-text">Симуляція завершена. Світ пройшов 30 днів після події.
                Фінальний стан: стабільність ${Math.round(world.stability)}%, економіка ${Math.round(world.economy)}%.</div>`;
            feed.prepend(final);
            isPaused = true;
            document.getElementById('pause-btn').textContent = '✅ Завершено';
            document.getElementById('pause-btn').style.borderColor = 'rgba(68,204,102,0.3)';
            document.getElementById('pause-btn').style.color = '#44cc66';
            return;
        }
        advanceDay();
        setTimeout(tick, TICK_MS);
    }

    // ============================================================
    // ПАНЕЛЬ ПОДІЙ
    // ============================================================
    function renderEvents() {
        const panel = document.getElementById('event-panel');
        panel.innerHTML = '';
        EVENT_LIST.forEach(key => {
            const ev = EVENTS[key];
            const btn = document.createElement('button');
            btn.className = 'event-btn';
            btn.dataset.event = key;
            btn.textContent = ev.name;
            btn.addEventListener('click', () => startEvent(key));
            panel.appendChild(btn);
        });
    }

    // ============================================================
    // ТАБИ
    // ============================================================
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // ============================================================
    // PAUSE
    // ============================================================
    const pauseBtn = document.createElement('button');
    pauseBtn.id = 'pause-btn';
    pauseBtn.textContent = '⏸️ Пауза';
    pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? '▶️ Продовжити' : '⏸️ Пауза';
        if (!isPaused && currentEvent) {
            setTimeout(tick, 500);
        }
    });
    document.querySelector('#map-wrap').appendChild(pauseBtn);

    // ============================================================
    // РЕСАЙЗ
    // ============================================================
    window.addEventListener('resize', () => {
        resizeMap();
        drawMap();
    });

    // ============================================================
    // АНІМАЦІЯ
    // ============================================================
    function animate() {
        drawMap();
        requestAnimationFrame(animate);
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    resizeMap();
    renderEvents();
    updateGlobalStatus();
    updateTabs();
    animate();

    // Стартова новина
    const feed = document.getElementById('news-feed');
    const start = document.createElement('div');
    start.className = 'news-item';
    start.innerHTML = `<div class="news-day">🚀 СТАРТ</div><div class="news-text">Симулятор AI Sandbox запущено. Обери подію, щоб почати експеримент.</div>`;
    feed.prepend(start);

    console.log('✅ AI Sandbox запущено');
    console.log('🌍 Події:', EVENT_LIST.map(k => EVENTS[k].name).join(', '));
</script>
</body>
