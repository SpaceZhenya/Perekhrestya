<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перехрестя</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #050508; font-family: 'Georgia', serif; }
        canvas { display: block; }
        #info {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #d4c5a9; background: rgba(0,0,0,0.6); padding: 8px 20px;
            border-radius: 20px; font-size: 14px; z-index: 10;
            border: 1px solid rgba(212,197,169,0.15);
            pointer-events: none; user-select: none;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        #memory {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92); display: none;
            flex-direction: column; align-items: center; justify-content: center;
            color: #e8dcc8; z-index: 20; padding: 40px;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        #memory .text { font-size: 20px; max-width: 600px; line-height: 1.7; font-style: italic; opacity: 0.9; }
        #memory .hint { margin-top: 30px; font-size: 14px; opacity: 0.35; letter-spacing: 0.1em; }
        #memory .title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.3em; opacity: 0.4; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="info">🖱 Клік — огляд • WASD — ходьба • E — взаємодія</div>
    <div id="memory">
        <div class="title">Спогад</div>
        <div class="text" id="memText"></div>
        <div class="hint">Натисни E, щоб закрити</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

        // ============================================================
        // ГЕНЕРАЦІЯ ТЕКСТУР
        // ============================================================
        function createTexture(w, h, drawFn, repeat = true) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const ctx = c.getContext('2d');
            drawFn(ctx, w, h);
            const tex = new THREE.CanvasTexture(c);
            if (repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; }
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Стіна — стара штукатурка з нерівностями
        const wallTex = createTexture(512, 512, (ctx, w, h) => {
            const base = 180;
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const n = (Math.sin(x * 0.1) * Math.cos(y * 0.08) * 20 +
                              Math.sin(x * 0.05 + y * 0.07) * 30 +
                              Math.random() * 10);
                    const v = Math.min(255, Math.max(140, base + n));
                    ctx.fillStyle = `rgb(${v+10},${v},${v-15})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            // плями
            for (let i = 0; i < 40; i++) {
                const x = Math.random() * w, y = Math.random() * h;
                const r = 5 + Math.random() * 20;
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, `rgba(100,80,60,${0.05 + Math.random() * 0.1})`);
                grad.addColorStop(1, 'rgba(100,80,60,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(x - r, y - r, r * 2, r * 2);
            }
        });

        // Bump-карта для стін
        const wallBump = createTexture(256, 256, (ctx, w, h) => {
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const n = (Math.sin(x * 0.2 + y * 0.15) * 0.3 +
                              Math.sin(x * 0.08) * Math.cos(y * 0.12) * 0.5 +
                              Math.random() * 0.2) * 255;
                    ctx.fillStyle = `rgb(${n},${n},${n})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
        }, false);

        // Підлога — широкі старі дошки
        const floorTex = createTexture(1024, 512, (ctx, w, h) => {
            const colors = ['#6a4f3a', '#5c4430', '#785a44', '#4e3828'];
            for (let x = 0; x < w; x += 80) {
                const ci = Math.floor(Math.random() * colors.length);
                ctx.fillStyle = colors[ci];
                const width = 72 + Math.random() * 12;
                ctx.fillRect(x, 0, width, h);
                // текстура дерева
                for (let i = 0; i < 50; i++) {
                    const lx = x + Math.random() * width;
                    const ly = Math.random() * h;
                    ctx.strokeStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.08})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(lx, ly);
                    ctx.lineTo(lx + (Math.random() - 0.5) * 20, ly + (Math.random() - 0.5) * 5);
                    ctx.stroke();
                }
                // сучки
                for (let i = 0; i < 2; i++) {
                    const kx = x + 10 + Math.random() * (width - 20);
                    const ky = Math.random() * h;
                    ctx.fillStyle = '#2a1a10';
                    ctx.beginPath();
                    ctx.arc(kx, ky, 3 + Math.random() * 6, 0, Math.PI * 2);
                    ctx.fill();
                }
                // тріщина
                if (Math.random() > 0.6) {
                    ctx.strokeStyle = 'rgba(30,20,10,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x + Math.random() * width, 0);
                    ctx.lineTo(x + Math.random() * width, h);
                    ctx.stroke();
                }
            }
        });

        const floorBump = createTexture(512, 256, (ctx, w, h) => {
            for (let x = 0; x < w; x += 40) {
                for (let y = 0; y < h; y++) {
                    const v = Math.sin(x * 0.3 + y * 0.01) * 20 + Math.random() * 30 + 100;
                    ctx.fillStyle = `rgb(${v},${v},${v})`;
                    ctx.fillRect(x, y, 40, 1);
                }
            }
        }, false);

        // Піч — цегла
        const brickTex = createTexture(512, 256, (ctx, w, h) => {
            ctx.fillStyle = '#7a4630';
            ctx.fillRect(0, 0, w, h);
            for (let y = 0; y < h; y += 22) {
                const off = (y / 22) % 2 === 0 ? 0 : 20;
                for (let x = -off; x < w; x += 42) {
                    const r = 25 + Math.random() * 15;
                    const g = 15 + Math.random() * 10;
                    const b = 10 + Math.random() * 8;
                    ctx.fillStyle = `rgb(${r+50},${g+30},${b+20})`;
                    ctx.fillRect(x, y, 40, 20);
                    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, 40, 20);
                }
            }
        });

        // ============================================================
        // СЦЕНА
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080810);
        scene.fog = new THREE.FogExp2(0x080810, 0.06);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(0, 1.6, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.shadowMap.bias = 0.00005;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.prepend(renderer.domElement);

        // ============================================================
        // ENVIRONMENT MAP (IBL)
        // ============================================================
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const envTexture = pmremGenerator.fromScene(new RoomEnvironment(renderer), 0.04).texture;
        scene.environment = envTexture;
        scene.environmentIntensity = 0.6;

        // ============================================================
        // ПОСТ-ПРОЦЕСИНГ
        // ============================================================
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.25, 0.3, 0.15
        );
        composer.addPass(bloomPass);

        // ============================================================
        // ОСВІТЛЕННЯ
        // ============================================================
        // Місячне світло (холодне)
        const moonLight = new THREE.DirectionalLight(0x8899cc, 1.5);
        moonLight.position.set(2.5, 7, -5);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        const d = 5;
        moonLight.shadow.camera.left = -d;
        moonLight.shadow.camera.right = d;
        moonLight.shadow.camera.top = d;
        moonLight.shadow.camera.bottom = -d;
        moonLight.shadow.camera.near = 1;
        moonLight.shadow.camera.far = 12;
        moonLight.shadow.bias = -0.001;
        scene.add(moonLight);

        // Заповнююче світло (від місяця, відбите від підлоги)
        const bounce = new THREE.DirectionalLight(0x667788, 0.3);
        bounce.position.set(-2, -1, 3);
        scene.add(bounce);

        // Лампа (тепле жовте світло)
        const lampLight = new THREE.PointLight(0xffcc77, 2.5, 6);
        lampLight.position.set(-0.3, 2.5, 1.2);
        lampLight.shadow.mapSize.width = 512;
        lampLight.shadow.mapSize.height = 512;
        scene.add(lampLight);

        // Вогонь печі (тепле помаранчеве)
        const fireLight = new THREE.PointLight(0xff5500, 2.0, 4);
        fireLight.position.set(-1.5, 0.4, 1.3);
        scene.add(fireLight);

        // Ліхтар над столом
        const lanternLight = new THREE.PointLight(0xffaa55, 0.6, 3);
        lanternLight.position.set(0.8, 2.0, -0.6);
        scene.add(lanternLight);

        // ============================================================
        // КІМНАТА
        // ============================================================
        const roomW = 5, roomD = 5, roomH = 2.8;

        // Підлога
        const floorMat = new THREE.MeshStandardMaterial({
            map: floorTex,
            bumpMap: floorBump,
            bumpScale: 0.02,
            roughness: 0.85,
            metalness: 0.0
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0, 0);
        floor.receiveShadow = true;
        scene.add(floor);

        // Стіни
        const wallMat = new THREE.MeshStandardMaterial({
            map: wallTex,
            bumpMap: wallBump,
            bumpScale: 0.015,
            roughness: 0.92,
            metalness: 0.0,
            side: THREE.DoubleSide
        });
        function makeWall(w, h, x, y, z, ry) {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
            m.position.set(x, y, z);
            m.rotation.y = ry;
            m.receiveShadow = true;
            scene.add(m);
        }
        makeWall(roomW, roomH, 0, roomH/2, -roomD/2, 0);
        makeWall(roomW, roomH, 0, roomH/2, roomD/2, 0);
        makeWall(roomD, roomH, -roomW/2, roomH/2, 0, Math.PI/2);
        makeWall(roomD, roomH, roomW/2, roomH/2, 0, Math.PI/2);

        // Стеля
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.95, metalness: 0.0 });
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.y = roomH;
        scene.add(ceil);

        // Плінтуси
        const plinthMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.9 });
        function makePlinth(x, z, w, ry) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(w, 0.08, 0.04), plinthMat);
            p.position.set(x, 0.04, z);
            p.rotation.y = ry;
            scene.add(p);
        }
        makePlinth(0, -roomD/2 + 0.02, roomW, 0);
        makePlinth(0, roomD/2 - 0.02, roomW, 0);
        makePlinth(-roomW/2 + 0.02, 0, roomD, Math.PI/2);
        makePlinth(roomW/2 - 0.02, 0, roomD, Math.PI/2);

        // ============================================================
        // ВІКНО (з глибиною)
        // ============================================================
        const windowMat = new THREE.MeshStandardMaterial({
            color: 0x1a3355, emissive: 0x1a3355, emissiveIntensity: 0.2,
            transparent: true, opacity: 0.35, roughness: 0.05, metalness: 0.0,
            envMapIntensity: 0.3
        });
        const windowGl = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.8), windowMat);
        windowGl.position.set(1.6, 1.3, -roomD/2 + 0.05);
        scene.add(windowGl);

        // Підвіконня
        const sillMat = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.85 });
        const sill = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.05, 0.12), sillMat);
        sill.position.set(1.6, 0.9, -roomD/2 + 0.08);
        sill.receiveShadow = true;
        scene.add(sill);

        // Рамка вікна
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.8 });
        const fw = 0.94, fh = 0.84;
        frameParts = [
            { s: [fw, 0.03], p: [1.6, 1.7, -roomD/2 + 0.03] },
            { s: [fw, 0.03], p: [1.6, 0.9, -roomD/2 + 0.03] },
            { s: [0.03, fh], p: [2.05, 1.3, -roomD/2 + 0.03] },
            { s: [0.03, fh], p: [1.15, 1.3, -roomD/2 + 0.03] },
        ];
        frameParts.forEach(p => {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(p.s[0], p.s[1]), frameMat);
            m.position.set(p.p[0], p.p[1], p.p[2]);
            scene.add(m);
        });

        // ============================================================
        // ПІЧ
        // ============================================================
        const stoveMat = new THREE.MeshStandardMaterial({
            map: brickTex, roughness: 0.85, metalness: 0.0,
            envMapIntensity: 0.1
        });
        const stove = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.7, 0.75), stoveMat);
        stove.position.set(-1.5, 0.85, 1.2);
        stove.castShadow = true;
        stove.receiveShadow = true;
        scene.add(stove);

        // Верх печі (білий)
        const topMat = new THREE.MeshStandardMaterial({ color: 0xccc0b0, roughness: 0.7 });
        const stoveTop = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.04, 0.77), topMat);
        stoveTop.position.set(-1.5, 1.7, 1.2);
        stoveTop.receiveShadow = true;
        stoveTop.castShadow = true;
        scene.add(stoveTop);

        // Топка
        const fireMat = new THREE.MeshStandardMaterial({
            color: 0xff5500, emissive: 0xff4400, emissiveIntensity: 0.6,
            transparent: true, opacity: 0.8
        });
        const fireGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.25), fireMat);
        fireGlow.position.set(-1.5, 0.4, 1.55);
        scene.add(fireGlow);

        // Дрова
        const logMat = new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.95 });
        for (let i = 0; i < 3; i++) {
            const log = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.2, 6), logMat);
            log.rotation.z = Math.random() * 0.3;
            log.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            log.position.set(-1.5 + (i-1) * 0.07, 0.28, 1.5 + (Math.random() - 0.5) * 0.05);
            scene.add(log);
        }

        // ============================================================
        // СТІЛ
        // ============================================================
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x7a5a3a, roughness: 0.65, metalness: 0.0, envMapIntensity: 0.2 });
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.75), tableMat);
        tableTop.position.set(0.8, 0.75, -0.6);
        tableTop.receiveShadow = true;
        tableTop.castShadow = true;
        scene.add(tableTop);

        const legMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.8 });
        [[-0.55, 0.38, -0.9], [0.55, 0.38, -0.9], [-0.55, 0.38, -0.3], [0.55, 0.38, -0.3]].forEach(p => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.7, 6), legMat);
            leg.position.set(0.8 + p[0], p[1], -0.6 + p[2]);
            leg.castShadow = true;
            scene.add(leg);
        });

        // Чашка на столі
        const cupMat = new THREE.MeshStandardMaterial({ color: 0xd4c5a9, roughness: 0.3, metalness: 0.1 });
        const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.08, 12), cupMat);
        cup.position.set(0.9, 0.79, -0.55);
        cup.castShadow = true;
        scene.add(cup);
        const cupHandle = new THREE.Mesh(new THREE.TorusGeometry(0.025, 0.008, 8, 8), cupMat);
        cupHandle.position.set(0.945, 0.82, -0.55);
        cupHandle.rotation.z = Math.PI / 2;
        scene.add(cupHandle);

        // ============================================================
        // ФОТО
        // ============================================================
        const photoMat = new THREE.MeshStandardMaterial({ color: 0xd4c5a9, roughness: 0.5, envMapIntensity: 0.1 });
        const photoImg = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.36), photoMat);
        photoImg.position.set(0.3, 1.2, -roomD/2 + 0.02);
        scene.add(photoImg);
        const photoFrm = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.42, 0.025), new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 }));
        photoFrm.position.set(0.3, 1.2, -roomD/2 + 0.01);
        scene.add(photoFrm);

        // ============================================================
        // РУШНИК
        // ============================================================
        const towelMat = new THREE.MeshStandardMaterial({ color: 0xd4b898, roughness: 0.9 });
        const towel = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.6), towelMat);
        towel.position.set(-0.5, 1.2, -roomD/2 + 0.02);
        scene.add(towel);
        // Вишивка
        const embroMat = new THREE.MeshStandardMaterial({ color: 0xcc3333 });
        for (let i = 0; i < 4; i++) {
            const e = new THREE.Mesh(new THREE.PlaneGeometry(0.03, 0.45), embroMat);
            e.position.set(-0.5 + (i-1.5) * 0.09, 1.2, -roomD/2 + 0.04);
            scene.add(e);
        }

        // ============================================================
        // КЛЮЧ
        // ============================================================
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xccaa55, metalness: 0.8, roughness: 0.2, envMapIntensity: 0.5 });
        const keyGroup = new THREE.Group();
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.012, 8, 12), keyMat);
        ring.rotation.x = Math.PI / 2;
        keyGroup.add(ring);
        const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.012, 0.012), keyMat);
        shaft.position.x = 0.045;
        keyGroup.add(shaft);
        const bit1 = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.035, 0.012), keyMat);
        bit1.position.set(0.09, -0.012, 0);
        keyGroup.add(bit1);
        const bit2 = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.02, 0.012), keyMat);
        bit2.position.set(0.09, 0.022, 0);
        keyGroup.add(bit2);
        keyGroup.position.set(-1.2, 0.06, 0.6);
        scene.add(keyGroup);

        // ============================================================
        // ДВЕРІ
        // ============================================================
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.85, metalness: 0.0 });
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.04), doorMat);
        door.position.set(roomW/2 - 0.02, 0.9, 0);
        door.castShadow = true;
        scene.add(door);
        const handle = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), keyMat);
        handle.position.set(roomW/2 - 0.02, 0.92, 0.07);
        scene.add(handle);
        // Одвірок
        const trimMat = new THREE.MeshStandardMaterial({ color: 0x3a2515, roughness: 0.9 });
        const trim = new THREE.Mesh(new THREE.BoxGeometry(0.88, 1.9, 0.06), trimMat);
        trim.position.set(roomW/2 - 0.04, 0.9, 0);
        scene.add(trim);

        // ============================================================
        // ПИЛ
        // ============================================================
        const dustCount = 300;
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustData = [];
        for (let i = 0; i < dustCount; i++) {
            dustPos[i*3] = (Math.random() - 0.5) * 4;
            dustPos[i*3+1] = Math.random() * 2.5;
            dustPos[i*3+2] = (Math.random() - 0.5) * 4 - 1;
            dustData.push({ s: 0.08 + Math.random() * 0.15, p: Math.random() * Math.PI * 2, a: 0.01 + Math.random() * 0.03 });
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0xccddee, size: 0.007, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
        const dust = new THREE.Points(dustGeo, dustMat);
        dust.position.set(1, 0, -2.5);
        scene.add(dust);

        // ============================================================
        // ІНТЕРАКТИВ
        // ============================================================
        const interactables = [];
        function addInteract(mesh, data) { mesh.userData = data; interactables.push(mesh); }
        addInteract(photoImg, { memory: 'Тобі 5 років. Ти складаєш вежу з кубиків. Бабуся сидить поруч і посміхається. «Ти в мене найрозумніший, Євгенку.» Це єдина фотографія, де вона щаслива.' });
        addInteract(towel, { memory: '«Кожен візерунок — молитва. Червоний — любов. Чорний — земля. Білий — чистота. Бабуся вишивала цей рушник три зими, і тепер він оберігає наш дім.»' });
        addInteract(stove, { memory: 'Холодними вечорами ти залазив на піч. Бабуся давала тепле молоко з медом. За вікном хуртовина. Тут було затишно, як ніде більше.' });
        addInteract(keyGroup, { key: true, memory: 'Старий іржавий ключ. На кільці подряпина: «1943». Бабуся ніколи не розповідала, що сталося того року.' });
        addInteract(door, { door: true });

        let hasKey = false;
        let selectedObj = null;
        let inMemory = false;
        let escaped = false;

        // ============================================================
        // УПРАВЛІННЯ
        // ============================================================
        let isLocked = false;
        let pitch = 0, yaw = 0;
        let fwd = false, bwd = false, left = false, right = false;

        renderer.domElement.addEventListener('click', () => {
            if (!isLocked && !inMemory) renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
        });

        document.addEventListener('mousemove', e => {
            if (!isLocked) return;
            yaw -= e.movementX * 0.0015;
            pitch -= e.movementY * 0.0015;
            pitch = Math.max(-1.4, Math.min(1.4, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'KeyW') fwd = true;
            if (e.code === 'KeyS') bwd = true;
            if (e.code === 'KeyA') left = true;
            if (e.code === 'KeyD') right = true;
            if (e.code === 'KeyE') interact();
        });
        document.addEventListener('keyup', e => {
            if (e.code === 'KeyW') fwd = false;
            if (e.code === 'KeyS') bwd = false;
            if (e.code === 'KeyA') left = false;
            if (e.code === 'KeyD') right = false;
        });

        function interact() {
            if (inMemory) {
                document.getElementById('memory').style.display = 'none';
                inMemory = false;
                if (escaped) {
                    setTimeout(() => showMem('Ти спускаєшся в підвал... тут темно. Пахне землею і часом. Десь далеко голос бабусі: «Не бійся, дитино...»'), 200);
                }
                return;
            }
            if (!selectedObj) return;
            const d = selectedObj.userData;
            if (d.key && !hasKey) {
                hasKey = true;
                scene.remove(keyGroup);
                showMem(d.memory);
                return;
            }
            if (d.door) {
                showMem(hasKey
                    ? 'Ти вставляєш ключ. Замок клацає глухо, наче його не відчиняли десятиліттями. Двері прочиняються. З підвалу тягне холодом і вогкістю. Знизу чути тихий голос: «Ти прийшов... я чекала.»'
                    : 'Двері зачинені. Бабуся казала: «Під третім кахлем біля печі...»');
                if (hasKey) escaped = true;
                return;
            }
            if (d.memory) showMem(d.memory);
        }

        function showMem(text) {
            document.getElementById('memText').textContent = `«${text}»`;
            document.getElementById('memory').style.display = 'flex';
            inMemory = true;
            if (document.pointerLockElement) document.exitPointerLock();
        }

        // ============================================================
        // RAYCASTER
        // ============================================================
        const raycaster = new THREE.Raycaster();

        function updateSelection() {
            if (inMemory || !isLocked) { selectedObj = null; return; }
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = 3.0;
            const hits = raycaster.intersectObjects(interactables.filter(o => o.parent !== null));
            selectedObj = hits.length > 0 ? hits[0].object : null;
        }

        // ============================================================
        // АНІМАЦІЯ
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);
            const time = clock.getElapsedTime();

            // Рух
            if (isLocked && !inMemory) {
                const dir = new THREE.Vector3(Number(right) - Number(left), 0, Number(bwd) - Number(fwd));
                if (dir.length() > 0) {
                    dir.normalize();
                    const speed = 2.0;
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize();
                    const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    side.y = 0; side.normalize();
                    const move = new THREE.Vector3();
                    move.add(forward.multiplyScalar(dir.z * speed * delta));
                    move.add(side.multiplyScalar(dir.x * speed * delta));
                    camera.position.add(move);
                    camera.position.x = Math.max(-2.0, Math.min(2.0, camera.position.x));
                    camera.position.z = Math.max(-2.0, Math.min(2.0, camera.position.z));
                    camera.position.y = 1.6;
                }
                updateSelection();
            }

            // Вогонь
            const f = 0.6 + Math.sin(time * 3.7) * 0.3 + Math.sin(time * 8.3) * 0.12 + Math.sin(time * 15.1) * 0.05;
            fireLight.intensity = f * 2.2;
            fireMat.emissiveIntensity = 0.4 + f * 0.5;
            fireMat.opacity = 0.5 + Math.sin(time * 2.8) * 0.15;

            // Лампа ледь гойдається
            lampLight.position.y = 2.5 + Math.sin(time * 0.5) * 0.015;

            // Пил
            const dp = dust.geometry.attributes.position.array;
            for (let i = 0; i < dustCount; i++) {
                dp[i*3] += Math.sin(time * dustData[i].s + dustData[i].p) * dustData[i].a;
                dp[i*3+1] += Math.sin(time * dustData[i].s * 0.7 + dustData[i].p * 1.3) * dustData[i].a;
                dp[i*3+2] += Math.sin(time * dustData[i].s * 0.5 + dustData[i].p * 0.9) * dustData[i].a * 0.5;
            }
            dust.geometry.attributes.position.needsUpdate = true;

            // Ключ
            if (keyGroup.parent) keyGroup.rotation.y = Math.sin(time * 0.4) * 0.08;

            composer.render();
        }
        animate();

        // ============================================================
        // РЕСАЙЗ
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('✅ Перехрестя');
    </script>
</body>
</html>
