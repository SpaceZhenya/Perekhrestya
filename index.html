<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перехрестя — 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; font-family: 'Georgia', serif; overflow: hidden; user-select: none; }
        
        #game {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 600px;
            background: #1a1510;
            border: 1px solid rgba(212,197,169,0.15);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }
        canvas { display: block; width: 800px; height: 600px; cursor: pointer; }

        #inv {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50px;
            background: rgba(0,0,0,0.75);
            border-top: 1px solid rgba(212,197,169,0.1);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
        }
        .inv-slot {
            width: 40px; height: 40px;
            border: 1px solid rgba(212,197,169,0.15);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            background: rgba(255,255,255,0.03);
        }
        .inv-slot.has { border-color: rgba(212,197,169,0.35); background: rgba(212,197,169,0.08); }

        #dialog {
            position: absolute;
            bottom: 60px; left: 20px; right: 20px;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(212,197,169,0.12);
            border-radius: 6px;
            padding: 16px 20px;
            color: #e8dcc8;
            font-size: 15px;
            line-height: 1.6;
            display: none;
            backdrop-filter: blur(4px);
            max-height: 120px;
            overflow-y: auto;
        }
        #dialog .speaker {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.4;
            margin-bottom: 4px;
        }
        #dialog .close-hint {
            position: absolute;
            bottom: 6px; right: 12px;
            font-size: 11px;
            opacity: 0.25;
        }
        #dialog.show { display: block; }

        @media (max-width: 820px) {
            #game { width: 100vw; height: 100vh; border: none; border-radius: 0; }
            canvas { width: 100vw; height: calc(100vh - 50px); }
        }
    </style>
</head>
<body>

<div id="game">
    <canvas id="c" width="800" height="600"></canvas>
    <div id="inv"></div>
    <div id="dialog">
        <div class="speaker" id="dSpeaker">Спогад</div>
        <div id="dText"></div>
        <div class="close-hint">клік — закрити</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const invDiv = document.getElementById('inv');
    const dialog = document.getElementById('dialog');
    const dSpeaker = document.getElementById('dSpeaker');
    const dText = document.getElementById('dText');

    const W = 800, H = 600;

    // ============================================================
    // ДАНІ ГРИ
    // ============================================================
    const inventory = [];
    let dialogOpen = false;
    let currentScene = 'room';
    let hasKey = false;
    let escaped = false;
    let talkedToGhost = false;
    let stoveExamined = false;
    let photoExamined = false;

    function addToInv(item) {
        if (!inventory.includes(item)) { inventory.push(item); renderInv(); }
    }
    function hasItem(item) { return inventory.includes(item); }

    // ============================================================
    // СЦЕНИ
    // ============================================================
    function scene_room() {
        // Стіна
        const grad = ctx.createRadialGradient(400, 200, 100, 400, 200, 600);
        grad.addColorStop(0, '#3a3025');
        grad.addColorStop(1, '#1a1510');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, 450);

        // Підлога
        ctx.fillStyle = '#2a2015';
        ctx.fillRect(0, 450, W, 150);
        // Дошки
        for (let x = 0; x < W; x += 70) {
            ctx.fillStyle = '#33261a';
            ctx.fillRect(x, 448, 66, 152);
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, 448, 66, 152);
        }

        // Вікно (місячне світло)
        ctx.fillStyle = '#1a3045';
        ctx.fillRect(280, 60, 180, 180);
        ctx.fillStyle = '#2a4060';
        ctx.fillRect(285, 65, 170, 170);
        // Місяць
        ctx.fillStyle = 'rgba(180,200,230,0.15)';
        ctx.beginPath();
        ctx.arc(370, 100, 30, 0, Math.PI * 2);
        ctx.fill();
        // Рамка
        ctx.strokeStyle = '#4a3520';
        ctx.lineWidth = 4;
        ctx.strokeRect(280, 60, 180, 180);
        ctx.beginPath();
        ctx.moveTo(370, 60); ctx.lineTo(370, 240);
        ctx.moveTo(280, 150); ctx.lineTo(460, 150);
        ctx.stroke();

        // Піч (ліворуч)
        ctx.fillStyle = '#6a4530';
        ctx.fillRect(40, 180, 140, 200);
        // Цегла
        for (let y = 185; y < 375; y += 18) {
            const off = (y / 18) % 2 === 0 ? 0 : 14;
            for (let x = 42 - off; x < 178; x += 28) {
                ctx.fillStyle = `hsl(20, 25%, ${28 + Math.random() * 10}%)`;
                ctx.fillRect(x, y, 26, 16);
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, 26, 16);
            }
        }
        // Топка
        ctx.fillStyle = '#1a0a05';
        ctx.fillRect(80, 300, 60, 60);
        // Вогонь
        const f = Date.now() / 200;
        ctx.fillStyle = `rgba(255, ${80 + Math.sin(f) * 30}, 0, ${0.6 + Math.sin(f * 1.3) * 0.2})`;
        ctx.beginPath();
        ctx.ellipse(110, 330 + Math.sin(f) * 3, 18 + Math.sin(f * 1.7) * 5, 15 + Math.sin(f * 0.9) * 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 200, 100, ${0.3 + Math.sin(f * 2.1) * 0.1})`;
        ctx.beginPath();
        ctx.ellipse(110, 326 + Math.sin(f * 1.1) * 2, 8 + Math.sin(f * 0.7) * 3, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        // Піч верх
        ctx.fillStyle = '#8a7050';
        ctx.fillRect(35, 180, 150, 10);
        ctx.fillRect(35, 175, 150, 8);

        // Стіл (центр-праворуч)
        ctx.fillStyle = '#6a4a30';
        ctx.fillRect(480, 380, 200, 10);
        ctx.fillRect(490, 390, 8, 60);
        ctx.fillRect(660, 390, 8, 60);
        // Чашка
        ctx.fillStyle = '#d4c5a9';
        ctx.fillRect(570, 360, 30, 22);
        ctx.fillStyle = '#b8a888';
        ctx.fillRect(570, 360, 30, 4);
        // Пара
        ctx.fillStyle = 'rgba(200,180,160,0.1)';
        for (let i = 0; i < 3; i++) {
            const px = 585 + Math.sin(Date.now()/800 + i) * 5;
            const py = 350 - i * 8 + Math.sin(Date.now()/600 + i*2) * 3;
            ctx.beginPath();
            ctx.ellipse(px, py, 4 + i, 3, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        // Свічка
        ctx.fillStyle = '#8a7a60';
        ctx.fillRect(530, 370, 6, 14);
        ctx.fillStyle = '#ffcc66';
        ctx.beginPath();
        ctx.arc(533, 368, 3 + Math.sin(Date.now()/300) * 1, 0, Math.PI * 2);
        ctx.fill();

        // Фото на стіні
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(580, 140, 50, 60);
        ctx.fillStyle = '#d4c5a9';
        ctx.fillRect(584, 144, 42, 52);
        ctx.fillStyle = 'rgba(180,160,140,0.5)';
        ctx.fillRect(590, 150, 30, 40); // фігурка
        ctx.fillStyle = 'rgba(200,180,160,0.3)';
        ctx.fillRect(594, 155, 22, 30);

        // Рушник
        ctx.fillStyle = '#d4b898';
        ctx.fillRect(180, 120, 30, 80);
        ctx.fillStyle = '#cc3333';
        for (let i = 0; i < 4; i++) {
            ctx.fillRect(183 + i * 7, 130, 3, 60);
        }

        // Двері (праворуч)
        ctx.fillStyle = '#3a2515';
        ctx.fillRect(740, 180, 55, 240);
        ctx.fillStyle = '#8a7a50';
        ctx.fillRect(778, 300, 6, 6);
        ctx.strokeStyle = '#2a1a0a';
        ctx.lineWidth = 2;
        ctx.strokeRect(740, 180, 55, 240);

        // Ключ на підлозі (якщо не взяли)
        if (!hasKey) {
            ctx.fillStyle = '#ccaa55';
            ctx.beginPath();
            ctx.arc(100, 460, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(106, 457, 12, 3);
            ctx.fillRect(116, 455, 3, 7);
        }

        // Тінь від місяця
        ctx.fillStyle = 'rgba(120,150,200,0.03)';
        ctx.fillRect(280, 240, 180, 200);
    }

    // ============================================================
    // ХОТСПОТИ
    // ============================================================
    const hotspots = [
        { id: 'stove', x: 40, y: 180, w: 140, h: 200, cursor: 'pointer',
          label: '🔥 Піч', once: false,
          action: () => {
              if (!stoveExamined) {
                  stoveExamined = true;
                  showDialog('Спогад', '«Під третім кахлем біля печі...» — згадуєш слова бабусі. Тут колись була схованка.');
              } else if (!hasKey) {
                  showDialog('Спогад', 'Кахель під піччю хитається. Ти піднімаєш його. Під ним — старий іржавий ключ.');
                  hasKey = true;
              } else {
                  showDialog('Спогад', 'Холодними вечорами ти залазив на піч. Бабуся давала тепле молоко з медом. Тут було затишно.');
              }
          } },
        { id: 'photo', x: 580, y: 140, w: 50, h: 60, cursor: 'pointer',
          label: '📷 Фото', once: false,
          action: () => {
              photoExamined = true;
              showDialog('Спогад', 'Тобі 5 років. Ти складаєш вежу з кубиків. Бабуся сидить поруч і посміхається. «Ти в мене найрозумніший, Євгенку.» Це єдина фотографія, де вона щаслива.');
          } },
        { id: 'towel', x: 180, y: 120, w: 30, h: 80, cursor: 'pointer',
          label: '🧵 Рушник', once: false,
          action: () => {
              showDialog('Спогад', '«Кожен візерунок — молитва. Червоний — любов. Чорний — земля. Білий — чистота.» Бабуся вишивала цей рушник три зими.');
          } },
        { id: 'key', x: 90, y: 445, w: 40, h: 30, cursor: 'pointer',
          label: '🔑 Ключ', once: true,
          condition: () => !hasKey,
          action: () => {
              hasKey = true;
              showDialog('🔑 Знайдено!', 'Старий іржавий ключ. На кільці подряпина: «1943».');
              addToInv('🔑');
          } },
        { id: 'door', x: 740, y: 180, w: 55, h: 240, cursor: 'pointer',
          label: '🚪 Двері', once: false,
          action: () => {
              if (hasKey) {
                  escaped = true;
                  showDialog('🚪 Двері', 'Ти вставляєш ключ. Замок клацає глухо, наче його не відчиняли десятиліттями. Двері прочиняються. З підвалу тягне холодом і вогкістю.');
                  setTimeout(() => {
                      showDialog('Спогад', 'Ти спускаєшся в підвал... тут темно. Пахне землею і часом. Десь далеко голос бабусі: «Не бійся, дитино, це всього лиш спогади.»');
                  }, 2000);
              } else {
                  showDialog('🚪 Двері', 'Двері зачинені. Бабуся колись казала: «Під третім кахлем біля печі...»');
              }
          } },
    ];

    // ============================================================
    // РЕНДЕР
    // ============================================================
    let mouseX = 0, mouseY = 0;
    let hoveredHotspot = null;
    let particles = [];

    function updateParticles() {
        if (Math.random() > 0.7) {
            particles.push({
                x: 280 + Math.random() * 180,
                y: 60 + Math.random() * 20,
                vx: (Math.random() - 0.5) * 0.2,
                vy: 0.1 + Math.random() * 0.3,
                life: 200 + Math.random() * 200,
                size: 1 + Math.random() * 2
            });
        }
        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            return p.life > 0 && p.y < 350;
        });
    }

    function render() {
        ctx.clearRect(0, 0, W, H);

        // Сцена
        scene_room();

        // Частинки (пил в промені місяця)
        particles.forEach(p => {
            ctx.fillStyle = `rgba(200,220,255,${(p.life / 300) * 0.3})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Хотспот ховер
        if (hoveredHotspot && !dialogOpen) {
            const h = hoveredHotspot;
            ctx.strokeStyle = 'rgba(255,200,100,0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(h.x, h.y, h.w, h.h);
            ctx.setLineDash([]);
            // Підпис
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            const tw = ctx.measureText(h.label).width + 20;
            ctx.fillRect(h.x + h.w/2 - tw/2, h.y - 28, tw, 22);
            ctx.fillStyle = '#ffcc66';
            ctx.font = '13px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText(h.label, h.x + h.w/2, h.y - 12);
        }

        // Затемнення країв
        const vig = ctx.createRadialGradient(400, 300, 250, 400, 300, 450);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
    }

    function renderInv() {
        invDiv.innerHTML = '<div class="inv-slot' + (inventory.length > 0 ? ' has' : '') + '">' + (inventory[0] || '') + '</div>';
    }

    // ============================================================
    // ДІАЛОГ
    // ============================================================
    function showDialog(speaker, text) {
        dSpeaker.textContent = speaker;
        dText.textContent = text;
        dialog.classList.add('show');
        dialogOpen = true;
    }
    function closeDialog() {
        dialog.classList.remove('show');
        dialogOpen = false;
    }

    // ============================================================
    // КЛІКИ ТА МИША
    // ============================================================
    function getMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        return { x, y };
    }

    canvas.addEventListener('mousemove', e => {
        const { x, y } = getMouse(e);
        mouseX = x; mouseY = y;
        hoveredHotspot = null;
        for (const h of hotspots) {
            if (h.condition && !h.condition()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                hoveredHotspot = h;
                break;
            }
        }
        canvas.style.cursor = hoveredHotspot && !dialogOpen ? 'pointer' : 'default';
    });

    canvas.addEventListener('click', e => {
        const { x, y } = getMouse(e);
        if (dialogOpen) { closeDialog(); return; }
        for (const h of hotspots) {
            if (h.condition && !h.condition()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                h.action();
                return;
            }
        }
    });

    // Touch
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const { x, y } = getMouse(touch);
        if (dialogOpen) { closeDialog(); return; }
        hoveredHotspot = null;
        for (const h of hotspots) {
            if (h.condition && !h.condition()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                hoveredHotspot = h;
                h.action();
                return;
            }
        }
    }, { passive: false });

    // ============================================================
    // ЦИКЛ
    // ============================================================
    function loop() {
        updateParticles();
        render();
        requestAnimationFrame(loop);
    }
    renderInv();
    loop();

    console.log('✅ Перехрестя 2D');
</script>
</body>
</html>
