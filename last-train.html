<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Останній потяг — Last Train</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050508; overflow: hidden; font-family: 'Georgia', serif; user-select: none; }
        canvas { display: block; }

        #ui {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; align-items: center;
            background: rgba(6,6,10,0.7); padding: 6px 14px;
            border-radius: 20px; border: 1px solid rgba(200,180,160,0.08);
            backdrop-filter: blur(4px); z-index: 10;
        }
        #ui button {
            background: rgba(200,180,160,0.06);
            border: 1px solid rgba(200,180,160,0.1);
            color: #c8b4a0; width: 32px; height: 32px;
            border-radius: 50%; font-size: 16px;
            cursor: pointer; transition: all 0.15s;
        }
        #ui button:hover { background: rgba(200,180,160,0.15); }
        #scene-name {
            color: rgba(200,180,160,0.4);
            font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
            margin: 0 10px; min-width: 120px; text-align: center;
        }
        #inv {
            display: flex; gap: 3px; margin-left: 6px;
        }
        #inv span {
            width: 28px; height: 28px;
            border: 1px solid rgba(200,180,160,0.08);
            border-radius: 3px; display: flex; align-items: center;
            justify-content: center; font-size: 14px;
        }
        #inv span.has { border-color: rgba(200,180,160,0.2); background: rgba(200,180,160,0.04); }

        #dialog {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px;
            background: rgba(6,6,10,0.92); border: 1px solid rgba(200,180,160,0.06);
            border-radius: 8px; padding: 16px 20px;
            color: #d0c0b0; font-size: 14px; line-height: 1.6;
            display: none; z-index: 20;
            backdrop-filter: blur(6px);
        }
        #dialog .speaker {
            font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.2em; opacity: 0.3; margin-bottom: 4px;
        }
        #dialog .choices { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        #dialog .choices button {
            background: rgba(200,180,160,0.06);
            border: 1px solid rgba(200,180,160,0.1);
            color: #c8b4a0; padding: 5px 14px; border-radius: 4px;
            font-size: 13px; font-family: 'Georgia', serif;
            cursor: pointer; transition: all 0.15s;
        }
        #dialog .choices button:hover { background: rgba(200,180,160,0.12); border-color: rgba(200,180,160,0.25); }

        #hint {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(200,180,160,0.25);
            font-size: 13px; z-index: 10;
            pointer-events: none;
            transition: opacity 1s;
            font-style: italic;
        }

        #start-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #06060a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50;
            cursor: pointer; transition: opacity 0.8s;
        }
        #start-screen h1 {
            color: #c8b4a0; font-size: 2.4em; font-weight: normal;
            letter-spacing: 0.3em; margin-bottom: 6px;
        }
        #start-screen .sub { color: rgba(200,180,160,0.35); font-size: 0.9em; letter-spacing: 0.15em; }
        #start-screen .btn {
            margin-top: 30px; padding: 10px 36px;
            border: 1px solid rgba(200,180,160,0.15);
            border-radius: 4px; color: #c8b4a0; font-size: 1em;
            font-family: 'Georgia', serif;
            background: rgba(200,180,160,0.03); cursor: pointer;
            transition: all 0.3s;
        }
        #start-screen .btn:hover { background: rgba(200,180,160,0.1); border-color: rgba(200,180,160,0.3); }

        #end-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6,6,10,0.96); display: none;
            flex-direction: column; align-items: center;
            justify-content: center; z-index: 50; padding: 40px; text-align: center;
        }
        #end-screen h2 { color: #c8b4a0; font-weight: normal; letter-spacing: 0.2em; margin-bottom: 14px; font-size: 1.4em; }
        #end-screen p { color: rgba(200,180,160,0.5); font-size: 0.9em; max-width: 480px; line-height: 1.6; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>ОСТАННІЙ ПОТЯГ</h1>
    <div class="sub">— Last Train —</div>
    <div class="btn">🚂 Почати</div>
</div>

<div id="end-screen">
    <h2>🚂 КІНЕЦЬ</h2>
    <p id="end-text"></p>
</div>

<div id="hint">🖱 Тягни мишу — озирнутись • Клік — взаємодія</div>

<div id="dialog">
    <div class="speaker" id="dSpeaker"></div>
    <div id="dText"></div>
    <div class="choices" id="dChoices"></div>
</div>

<div id="ui">
    <button id="btnPrev">‹</button>
    <span id="scene-name">Купе 1</span>
    <button id="btnNext">›</button>
    <span id="inv"></span>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';

    // ============================================================
    // СЦЕНА
    // ============================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080810);
    scene.fog = new THREE.FogExp2(0x080810, 0.02);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 30);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    document.body.prepend(renderer.domElement);

    // ============================================================
    // ОСВІТЛЕННЯ
    // ============================================================
    const ambient = new THREE.AmbientLight(0x445566, 1.5);
    scene.add(ambient);
    const lamp = new THREE.PointLight(0xffcc88, 2.0, 8);
    lamp.position.set(0, 2.5, 0);
    scene.add(lamp);
    // Додаткове світло з вікон
    const moon = new THREE.DirectionalLight(0x8899cc, 0.8);
    moon.position.set(2, 4, -3);
    scene.add(moon);

    // ============================================================
    // СТАН
    // ============================================================
    const inv = [];
    const flags = {};
    let dialogOpen = false;
    let currentCar = 0;
    let isLocked = false;
    let yaw = 0;
    let canClick = true;

    function hasItem(item) { return inv.includes(item); }
    function addItem(item) { if (!inv.includes(item)) { inv.push(item); renderUI(); } }
    function flag(name) { return flags[name] || false; }
    function setFlag(name) { flags[name] = true; }

    // ============================================================
    // ПОБУДОВА ВАГОНІВ
    // ============================================================
    const carGroups = [];

    function makeFloor(group, w, d) {
        const geo = new THREE.PlaneGeometry(w, d);
        const mat = new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.95 });
        const m = new THREE.Mesh(geo, mat);
        m.rotation.x = -Math.PI/2;
        m.position.y = -0.01;
        m.receiveShadow = true;
        group.add(m);
    }

    function makeWall(group, w, h, x, y, z, ry, color = 0x5a4a3a) {
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.9, side: THREE.DoubleSide });
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
        m.position.set(x, y, z);
        m.rotation.y = ry;
        group.add(m);
    }

    function makeSeat(group, x, z, left = true) {
        const mat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 });
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.6), mat);
        m.position.set(x, 0.4, z);
        m.castShadow = true;
        group.add(m);
        const mat2 = new THREE.MeshStandardMaterial({ color: 0x4a3828, roughness: 0.85 });
        const top = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.06, 0.6), mat2);
        top.position.set(x, 0.8, z);
        group.add(top);
    }

    function makeWindow(group, x, z) {
        const mat = new THREE.MeshStandardMaterial({
            color: 0x0a1520, emissive: 0x0a1a30, emissiveIntensity: 0.2,
            transparent: true, opacity: 0.4, roughness: 0.1
        });
        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.7), mat);
        m.position.set(x, 1.3, z);
        group.add(m);
        // Рамка
        const rm = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.8 });
        const hg = 0.72, wg = 0.72, t = 0.03;
        [ [x, 1.66, z], [x, 0.94, z] ].forEach(p => {
            const h = new THREE.Mesh(new THREE.BoxGeometry(wg + 0.04, t, t), rm);
            h.position.set(p[0], p[1], p[2]);
            group.add(h);
        });
        [ [x - 0.35, z], [x + 0.35, z] ].forEach(p => {
            const v = new THREE.Mesh(new THREE.BoxGeometry(t, hg + 0.04, t), rm);
            v.position.set(p[0], 1.3, p[1]);
            group.add(v);
        });
    }

    function makeTable(group, x, z) {
        const mat = new THREE.MeshStandardMaterial({ color: 0x5a4030, roughness: 0.8 });
        const top = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.3), mat);
        top.position.set(x, 0.75, z);
        top.castShadow = true;
        group.add(top);
        const lm = new THREE.MeshStandardMaterial({ color: 0x4a3020 });
        [[-0.2, 0.38, -0.1], [0.2, 0.38, -0.1], [-0.2, 0.38, 0.1], [0.2, 0.38, 0.1]].forEach(p => {
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.7, 4), lm);
            leg.position.set(x + p[0], p[1], z + p[2]);
            group.add(leg);
        });
    }

    function makeLamp(group, x, z) {
        const light = new THREE.PointLight(0xffaa55, 0.3, 3);
        light.position.set(x, 2.2, z);
        group.add(light);
    }

    // ============================================================
    // ВАГОН 1 — КУПЕ
    // ============================================================
    function buildCar1() {
        const g = new THREE.Group();
        const Wc = 3.6, Dc = 3.0, Hc = 2.6;

        makeFloor(g, Wc, Dc);
        makeWall(g, Wc, Hc, 0, Hc/2, -Dc/2, 0);
        makeWall(g, Wc, Hc, 0, Hc/2, Dc/2, 0);
        makeWall(g, Dc, Hc, -Wc/2, Hc/2, 0, Math.PI/2);
        makeWall(g, Dc, Hc, Wc/2, Hc/2, 0, Math.PI/2);

        // Стеля
        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(Wc, Dc),
            new THREE.MeshStandardMaterial({ color: 0x1e1a14, roughness: 0.95, side: THREE.DoubleSide }));
        ceil.rotation.x = Math.PI/2;
        ceil.position.y = Hc;
        g.add(ceil);

        // Сидіння
        makeSeat(g, -0.8, 0.6);
        makeSeat(g, 0.8, 0.6);

        // Столик
        makeTable(g, 0, 0.3);

        // Вікно
        makeWindow(g, 0.8, -Dc/2 + 0.05);

        // Багажна полиця
        const sm = new THREE.MeshStandardMaterial({ color: 0x3a2a1a });
        const shelf = new THREE.Mesh(new THREE.BoxGeometry(Wc - 0.6, 0.04, 0.2), sm);
        shelf.position.set(0, 1.8, -0.3);
        g.add(shelf);

        // Людина — бізнесмен
        const personGroup = makePerson(0x3a2a2a, 0xd4b898, 0x1a1a1a);
        personGroup.position.set(-0.8, 0, 0.6);
        g.add(personGroup);

        // Чемодан (інтерактивний)
        const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.25),
            new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.85 }));
        trunk.position.set(1.2, 0.1, -0.7);
        trunk.userData = { interact: true, id: 'suitcase',
            action: () => { setFlag('ticketTaken'); addItem('🎫');
                showText('🧳 Чемодан', 'Старий квиток. «Купе 3, місце 7. 23:55.» На звороті: «Не віддавай нікому.»'); } };
        g.add(trunk);

        // Фото на стіні
        const photo = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.25),
            new THREE.MeshStandardMaterial({ color: 0xd4c5a9, roughness: 0.6 }));
        photo.position.set(-0.3, 1.2, -Dc/2 + 0.03);
        photo.userData = { interact: true, id: 'photo',
            action: () => { setFlag('photoTaken'); addItem('🖼');
                showText('🖼 Фото', 'Родина біля моря. 2007. На звороті: «Наш останній потяг». Ти впізнаєш себе.'); } };
        g.add(photo);

        g.position.set(0, 0, 0);
        scene.add(g);
        carGroups.push(g);
        return g;
    }

    // ============================================================
    // ВАГОН 2 — РЕСТОРАН
    // ============================================================
    function buildCar2() {
        const g = new THREE.Group();
        const Wc = 3.6, Dc = 3.0, Hc = 2.6;

        makeFloor(g, Wc, Dc);
        makeWall(g, Wc, Hc, 0, Hc/2, -Dc/2, 0);
        makeWall(g, Wc, Hc, 0, Hc/2, Dc/2, 0);
        makeWall(g, Dc, Hc, -Wc/2, Hc/2, 0, Math.PI/2);
        makeWall(g, Dc, Hc, Wc/2, Hc/2, 0, Math.PI/2);

        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(Wc, Dc),
            new THREE.MeshStandardMaterial({ color: 0x1a1610, roughness: 0.95, side: THREE.DoubleSide }));
        ceil.rotation.x = Math.PI/2; ceil.position.y = Hc; g.add(ceil);

        // Стійка бару
        const barMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.85 });
        const bar = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.4), barMat);
        bar.position.set(0, 0.8, 0.8);
        g.add(bar);
        const barTop = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.04, 0.45), barMat);
        barTop.position.set(0, 1.6, 0.8);
        g.add(barTop);

        // Столики
        makeTable(g, -0.8, -0.6);
        makeTable(g, 0.8, -0.6);

        // Вікна
        makeWindow(g, -0.8, -Dc/2 + 0.05);
        makeWindow(g, 0.8, -Dc/2 + 0.05);

        // Провідник
        const cond = makePerson(0x2a2a3a, 0xc8b898, 0x2a2018);
        cond.position.set(0, 0, 0.8);
        g.add(cond);

        // Меню на стійці
        const menu = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.12),
            new THREE.MeshStandardMaterial({ color: 0xd4c5a9 }));
        menu.position.set(0.3, 1.2, 1.02);
        menu.userData = { interact: true, id: 'menu',
            action: () => showText('📋 Меню', '«Чай — безкоштовно. Компот — 1 руб. 2006 р.» Ціни з минулого.') };
        g.add(menu);

        g.position.set(0, 0, 0);
        scene.add(g);
        carGroups.push(g);
        return g;
    }

    // ============================================================
    // ВАГОН 3 — ВАНТАЖНИЙ
    // ============================================================
    function buildCar3() {
        const g = new THREE.Group();
        const Wc = 3.6, Dc = 3.0, Hc = 2.6;

        makeFloor(g, Wc, Dc);
        makeWall(g, Wc, Hc, 0, Hc/2, -Dc/2, 0, 0x3a3030);
        makeWall(g, Wc, Hc, 0, Hc/2, Dc/2, 0, 0x3a3030);
        makeWall(g, Dc, Hc, -Wc/2, Hc/2, 0, Math.PI/2, 0x3a3030);
        makeWall(g, Dc, Hc, Wc/2, Hc/2, 0, Math.PI/2, 0x3a3030);

        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(Wc, Dc),
            new THREE.MeshStandardMaterial({ color: 0x0e0c14, roughness: 0.95, side: THREE.DoubleSide }));
        ceil.rotation.x = Math.PI/2; ceil.position.y = Hc; g.add(ceil);

        // Ящики
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x1e1a14, roughness: 0.9 });
        for (let i = 0; i < 3; i++) {
            const bx = new THREE.Mesh(new THREE.BoxGeometry(0.3 + i*0.08, 0.25 + i*0.03, 0.3 + i*0.08), boxMat);
            bx.position.set(-0.6 + i*0.6, 0.12 + i*0.02, -0.3);
            g.add(bx);
        }

        // Маленьке вікно
        makeWindow(g, -1.2, -Dc/2 + 0.05);

        // Тінь (таємнича фігура)
        const shadowMat = new THREE.MeshStandardMaterial({ color: 0x0a0810, emissive: 0x0a0a20, emissiveIntensity: 0.1 });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.08, 0.3, 8), shadowMat);
        body.position.set(0, 0.15, 0.2);
        g.add(body);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), shadowMat);
        head.position.set(0, 0.35, 0.2);
        g.add(head);
        // Очі (світяться)
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x4466aa, emissive: 0x4466aa, emissiveIntensity: 0.3 });
        [-0.03, 0.03].forEach(ox => {
            const eye = new THREE.Mesh(new THREE.SphereGeometry(0.015, 6, 6), eyeMat);
            eye.position.set(ox, 0.36, 0.25);
            g.add(eye);
        });

        // Ящик з листами
        const letterBox = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.3),
            new THREE.MeshStandardMaterial({ color: 0x1e1a14 }));
        letterBox.position.set(0.6, 0.1, -0.5);
        letterBox.userData = { interact: true, id: 'box',
            action: () => {
                if (hasItem('🔑') && !flag('boxOpened')) {
                    setFlag('boxOpened');
                    showText('📦 Ящик', 'Старі листи. Фото батьків. Дитинство. Все чекало на тебе тут.');
                } else if (!hasItem('🔑')) {
                    showText('📦 Ящик', 'Замкнено. Потрібен ключ.');
                }
            } };
        g.add(letterBox);

        // Двері виходу
        const doorMat = new THREE.MeshStandardMaterial({ color: 0x3a2515, roughness: 0.9 });
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.6, 0.04), doorMat);
        door.position.set(1.5, 0.8, 0);
        door.userData = { interact: true, id: 'exit',
            action: () => {
                if (flag('boxOpened') && !flag('escaped')) {
                    setFlag('escaped');
                    showText('🚪 Двері', 'Ти виходиш. Холодне повітря. Потяг сповільнюється. Станція «2007». Дім.');
                    setTimeout(() => {
                        document.getElementById('end-screen').style.display = 'flex';
                        document.getElementById('end-text').textContent = 'Ти вийшов з потяга. Теплий вітер, запах моря. Попереду — будинок, де чекають. Ти встиг попрощатись.';
                    }, 3000);
                } else {
                    showText('🚪 Двері', 'Потяг мчить надто швидко. Рано виходити.');
                }
            } };
        g.add(door);

        g.position.set(0, 0, 0);
        scene.add(g);
        carGroups.push(g);
        return g;
    }

    // ============================================================
    // ПЕРСОНАЖ (проста 3D)
    // ============================================================
    function makePerson(clothesColor, skinColor, hairColor) {
        const g = new THREE.Group();

        // Тіло
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.35, 8),
            new THREE.MeshStandardMaterial({ color: clothesColor }));
        body.position.y = 0.17;
        g.add(body);

        // Голова
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10),
            new THREE.MeshStandardMaterial({ color: skinColor }));
        head.position.y = 0.38;
        g.add(head);

        // Очі
        const w = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const b = new THREE.MeshStandardMaterial({ color: 0x222222 });
        [-0.025, 0.025].forEach(ox => {
            const wh = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), w);
            wh.position.set(ox, 0.39, 0.07);
            g.add(wh);
            const bl = new THREE.Mesh(new THREE.SphereGeometry(0.01, 6, 6), b);
            bl.position.set(ox, 0.39, 0.08);
            g.add(bl);
        });

        // Волосся
        const hr = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 8),
            new THREE.MeshStandardMaterial({ color: hairColor }));
        hr.position.y = 0.425;
        hr.scale.y = 0.5;
        g.add(hr);

        return g;
    }

    // ============================================================
    // ПОБУДУВАТИ ВСІ ВАГОНИ
    // ============================================================
    buildCar1();
    buildCar2();
    buildCar3();

    // Сховати всі, показати перший
    carGroups.forEach((g, i) => g.visible = i === 0);

    // ============================================================
    // УПРАВЛІННЯ
    // ============================================================
    function switchCar(idx) {
        carGroups.forEach((g, i) => g.visible = i === idx);
        currentCar = idx;
        yaw = 0;
        camera.quaternion.identity();
        const names = ['Купе 1', 'Вагон-ресторан', 'Вантажний'];
        document.getElementById('scene-name').textContent = names[idx] || '';
    }

    document.getElementById('btnPrev').addEventListener('click', () => {
        if (dialogOpen) return;
        if (currentCar > 0) switchCar(currentCar - 1);
    });
    document.getElementById('btnNext').addEventListener('click', () => {
        if (dialogOpen) return;
        if (currentCar < carGroups.length - 1) switchCar(currentCar + 1);
    });

    let isDragging = false;
    let prevX = 0;

    renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; });
    window.addEventListener('mousemove', e => {
        if (!isDragging || dialogOpen) return;
        const dx = e.clientX - prevX;
        prevX = e.clientX;
        yaw -= dx * 0.005;
        camera.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // Touch
    renderer.domElement.addEventListener('touchstart', e => { isDragging = true; prevX = e.touches[0].clientX; });
    renderer.domElement.addEventListener('touchmove', e => {
        if (!isDragging || dialogOpen) return;
        const dx = e.touches[0].clientX - prevX;
        prevX = e.touches[0].clientX;
        yaw -= dx * 0.005;
        camera.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0, 'YXZ'));
    });
    renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

    // ============================================================
    // КЛІК — ВЗАЄМОДІЯ
    // ============================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('click', e => {
        if (dialogOpen) { closeDialog(); return; }
        if (isDragging) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        raycaster.far = 2.5;

        const car = carGroups[currentCar];
        const hits = raycaster.intersectObjects(car.children, true);
        for (const hit of hits) {
            let obj = hit.object;
            while (obj && !obj.userData.interact) obj = obj.parent;
            if (obj && obj.userData.action) {
                obj.userData.action();
                return;
            }
        }
    });

    // ============================================================
    // ДІАЛОГИ
    // ============================================================
    function showText(speaker, text) {
        document.getElementById('dSpeaker').textContent = speaker;
        document.getElementById('dText').textContent = text;
        document.getElementById('dChoices').innerHTML = '';
        document.getElementById('dialog').style.display = 'block';
        dialogOpen = true;
    }

    function showDialog(speaker, text, choices) {
        document.getElementById('dSpeaker').textContent = speaker;
        document.getElementById('dText').textContent = text;
        const cont = document.getElementById('dChoices');
        cont.innerHTML = '';
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.textContent = c.text;
            btn.onclick = () => { dialogOpen = false; document.getElementById('dialog').style.display = 'none'; if (c.next) c.next(); };
            cont.appendChild(btn);
        });
        document.getElementById('dialog').style.display = 'block';
        dialogOpen = true;
    }

    function closeDialog() {
        document.getElementById('dialog').style.display = 'none';
        dialogOpen = false;
    }

    // ============================================================
    // UI
    // ============================================================
    function renderUI() {
        let html = '';
        for (let i = 0; i < 4; i++) {
            html += '<span' + (inv[i] ? ' class="has"' : '') + '>' + (inv[i] || '') + '</span>';
        }
        document.getElementById('inv').innerHTML = html;
    }

    // ============================================================
    // СТАРТ
    // ============================================================
    document.querySelector('#start-screen .btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('start-screen').style.display = 'none';
            showText('🚂', 'Ти прокидаєшся в купе. За вікном — ніч. Потяг мчить крізь темряву. Ти не пам\'ятаєш, як сюди потрапив. Годинник: 23:55.');
        }, 800);
    });

    // ============================================================
    // АНІМАЦІЯ
    // ============================================================
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // РЕСАЙЗ
    // ============================================================
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
