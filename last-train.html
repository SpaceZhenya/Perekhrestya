<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Останній потяг — сюжетна гра</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #06060a;
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            color: #d0c0b0;
        }

        #game {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 600px;
            background: #0d0d12;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas { display: block; width: 800px; height: 500px; cursor: pointer; }

        /* UI низ */
        #ui-bot {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 100px;
            background: linear-gradient(0deg, #0a0a0f 0%, #0e0e14 100%);
            border-top: 1px solid rgba(200,180,160,0.06);
            padding: 8px 16px;
            display: grid;
            grid-template-columns: 60px 1fr 120px;
            gap: 8px;
            align-items: center;
        }

        #inventory {
            display: flex; gap: 4px; flex-wrap: wrap;
        }
        #inventory .slot {
            width: 44px; height: 44px;
            border: 1px solid rgba(200,180,160,0.08);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            background: rgba(255,255,255,0.02);
            transition: all 0.2s;
        }
        #inventory .slot.has { border-color: rgba(200,180,160,0.15); background: rgba(200,180,160,0.03); }

        #scene-name {
            text-align: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(200,180,160,0.25);
        }

        #nav-buttons {
            display: flex; gap: 6px; justify-content: flex-end;
        }
        #nav-buttons button {
            background: rgba(200,180,160,0.04);
            border: 1px solid rgba(200,180,160,0.08);
            color: #c8b4a0;
            padding: 6px 16px;
            border-radius: 3px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Georgia', serif;
            line-height: 1;
        }
        #nav-buttons button:hover { background: rgba(200,180,160,0.1); border-color: rgba(200,180,160,0.2); }

        /* Діалог */
        #dialog {
            position: absolute;
            bottom: 105px; left: 10px; right: 10px;
            background: rgba(6,6,10,0.95);
            border: 1px solid rgba(200,180,160,0.06);
            border-radius: 6px;
            padding: 14px 18px;
            display: none;
            z-index: 20;
            backdrop-filter: blur(6px);
            max-height: 200px;
        }
        #dialog .d-name {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.3;
            margin-bottom: 4px;
        }
        #dialog .d-text {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(200,180,160,0.85);
        }
        #dialog .d-choices {
            margin-top: 10px;
            display: flex; flex-wrap: wrap;
            gap: 6px;
        }
        #dialog .d-choices button {
            background: rgba(200,180,160,0.04);
            border: 1px solid rgba(200,180,160,0.08);
            color: #c8b4a0;
            padding: 6px 16px;
            border-radius: 3px;
            font-size: 13px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.15s;
        }
        #dialog .d-choices button:hover { background: rgba(200,180,160,0.1); border-color: rgba(200,180,160,0.2); }

        /* Затемнення для тексту */
        #text-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 100px;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(6,6,10,0.88);
            z-index: 15;
            padding: 40px;
            text-align: center;
        }
        #text-overlay .t-text {
            font-size: 18px;
            line-height: 1.8;
            color: rgba(200,180,160,0.8);
            max-width: 600px;
        }
        #text-overlay .t-sub {
            font-size: 12px;
            color: rgba(200,180,160,0.25);
            margin-top: 16px;
            letter-spacing: 0.1em;
        }
        #text-overlay .t-close {
            margin-top: 20px;
            background: rgba(200,180,160,0.06);
            border: 1px solid rgba(200,180,160,0.1);
            color: #c8b4a0;
            padding: 8px 24px;
            border-radius: 3px;
            font-size: 13px;
            font-family: 'Georgia', serif;
            cursor: pointer;
        }
        #text-overlay .t-close:hover { background: rgba(200,180,160,0.1); }

        /* Початок */
        #start {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #06060a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            transition: opacity 1.2s;
        }
        #start h1 {
            font-size: 2.6em;
            font-weight: normal;
            letter-spacing: 0.3em;
            color: #c8b4a0;
            text-shadow: 0 0 40px rgba(200,180,160,0.1);
        }
        #start .sub {
            color: rgba(200,180,160,0.25);
            font-size: 0.8em;
            letter-spacing: 0.2em;
            margin-top: 8px;
        }
        #start .btn {
            margin-top: 36px;
            padding: 12px 40px;
            border: 1px solid rgba(200,180,160,0.12);
            border-radius: 4px;
            color: #c8b4a0;
            font-size: 1.1em;
            font-family: 'Georgia', serif;
            background: rgba(200,180,160,0.02);
            cursor: pointer;
            transition: all 0.3s;
        }
        #start .btn:hover { background: rgba(200,180,160,0.06); border-color: rgba(200,180,160,0.25); }

        /* Кінець */
        #end {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6,6,10,0.96);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 40px;
            text-align: center;
        }
        #end h2 { font-weight: normal; letter-spacing: 0.2em; color: #c8b4a0; margin-bottom: 12px; font-size: 1.3em; }
        #end p { color: rgba(200,180,160,0.5); font-size: 0.9em; max-width: 500px; line-height: 1.7; }
        #end .restart {
            margin-top: 24px;
            padding: 10px 30px;
            border: 1px solid rgba(200,180,160,0.12);
            background: none;
            color: #c8b4a0;
            font-family: 'Georgia', serif;
            cursor: pointer;
            border-radius: 4px;
        }
        #end .restart:hover { background: rgba(200,180,160,0.05); }

        /* Секретна кнопка */
        #secret-hint {
            position: absolute;
            top: 4px; right: 4px;
            width: 14px; height: 14px;
            background: rgba(200,180,160,0.02);
            border-radius: 50%;
            cursor: pointer;
            z-index: 5;
            border: 1px solid rgba(200,180,160,0.04);
        }
        #secret-hint:hover { background: rgba(200,180,160,0.06); }
        #secret-hint::after {
            content: '?';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8px;
            color: rgba(200,180,160,0.1);
        }

        @media (max-width: 820px) {
            #game { width: 100vw; height: 100vh; border-radius: 0; }
            canvas { width: 100vw; height: calc(100vh - 100px); }
        }
    </style>
</head>
<body>

<div id="game">
    <div id="start">
        <h1>ОСТАННІЙ ПОТЯГ</h1>
        <div class="sub">— останній рейс —</div>
        <div class="btn">🚂 Почати</div>
    </div>

    <div id="end">
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <button class="restart" onclick="location.reload()">🔄 Заново</button>
    </div>

    <div id="secret-hint" onclick="showSecret()"></div>

    <div id="text-overlay">
        <div>
            <div class="t-text" id="tText"></div>
            <div class="t-sub" id="tSub">— натисни щоб продовжити —</div>
            <button class="t-close" id="tCloseBtn">Продовжити</button>
        </div>
    </div>

    <canvas id="c" width="800" height="500"></canvas>

    <div id="dialog">
        <div class="d-name" id="dName"></div>
        <div class="d-text" id="dText"></div>
        <div class="d-choices" id="dChoices"></div>
    </div>

    <div id="ui-bot">
        <div id="inventory"></div>
        <div id="scene-name">Купе №3</div>
        <div id="nav-buttons">
            <button id="btnPrev">◀</button>
            <button id="btnNext">▶</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 500;

    // Елементи UI
    const invEl = document.getElementById('inventory');
    const dialog = document.getElementById('dialog');
    const dName = document.getElementById('dName');
    const dText = document.getElementById('dText');
    const dChoices = document.getElementById('dChoices');
    const sceneName = document.getElementById('scene-name');
    const textOverlay = document.getElementById('text-overlay');
    const tText = document.getElementById('tText');
    const tClose = document.getElementById('tCloseBtn');
    const tSub = document.getElementById('tSub');
    const start = document.getElementById('start');

    // ============================================================
    // СТАН
    // ============================================================
    const inv = [];
    const flags = {};
    let dialogOpen = false;
    let overlayOpen = false;
    let currentScene = 'car';
    let lookAngle = 0; // 0-2 (ліворуч, центр, праворуч)
    let gameStarted = false;
    let isTransitioning = false;

    const LOCATIONS = ['corridor', 'car', 'restaurant', 'luggage', 'roof'];

    function has(item) { return inv.includes(item); }
    function flag(f) { return flags[f] || false; }
    function setFlag(f) { flags[f] = true; }

    // ============================================================
    // МАЛЮВАННЯ КІМНАТ
    // ============================================================
    function drawVignette() {
        const g = ctx.createRadialGradient(400, 200, 100, 400, 200, 500);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.6, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.45)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }

    function drawFloor(y) {
        ctx.fillStyle = '#1e1812';
        ctx.fillRect(0, y, W, H - y);
        for (let x = 0; x < W; x += 40) {
            ctx.fillStyle = (Math.floor(x/40) % 2 === 0) ? '#221a14' : '#1c1610';
            ctx.fillRect(x, y, 40, H - y);
        }
        ctx.strokeStyle = 'rgba(0,0,0,0.08)';
        ctx.lineWidth = 0.5;
        for (let x = 0; x < W; x += 40) { ctx.strokeRect(x, y, 40, H - y); }
    }

    function drawWindow(x, y, w, h, hasMoon = true) {
        ctx.fillStyle = '#0a1520';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#0d1a2a';
        ctx.fillRect(x+3, y+3, w-6, h-6);
        if (hasMoon) {
            ctx.fillStyle = 'rgba(200,200,230,0.04)';
            ctx.beginPath();
            ctx.arc(x + w*0.3, y + h*0.3, 8, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.strokeStyle = '#3a2a1a';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        ctx.beginPath();
        ctx.moveTo(x + w/2, y); ctx.lineTo(x + w/2, y + h);
        ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2);
        ctx.stroke();
    }

    function drawPerson(x, y, colors) {
        const {skin='#d4b898', clothes='#3a2a2a', hair='#1a1a1a'} = colors;
        ctx.fillStyle = clothes;
        ctx.fillRect(x-10, y-30, 20, 38);
        ctx.fillStyle = skin;
        ctx.beginPath();
        ctx.arc(x, y-42, 12, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = hair;
        ctx.beginPath();
        ctx.arc(x, y-47, 12, Math.PI*1.2, Math.PI*1.8);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x-4, y-44, 3, 0, Math.PI*2);
        ctx.arc(x+4, y-44, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(x-3, y-43, 1.5, 0, Math.PI*2);
        ctx.arc(x+5, y-43, 1.5, 0, Math.PI*2);
        ctx.fill();
    }

    // ============================================================
    // СЦЕНИ
    // ============================================================
    function drawCorridor(angle) {
        const o = angle * 100;
        ctx.fillStyle = '#1a1610';
        ctx.fillRect(0, 0, W, 350);
        for (let x = 0; x < W; x += 30) {
            ctx.fillStyle = (Math.floor(x/30) % 2 === 0) ? '#201a14' : '#1c1610';
            ctx.fillRect(x, 0, 30, 350);
        }

        ctx.fillStyle = '#151008';
        ctx.fillRect(0, 0, W, 30);

        // Лампи
        for (let i = 0; i < 3; i++) {
            const lx = 100 + i*280 + o*0.1;
            ctx.fillStyle = '#ffddaa';
            ctx.globalAlpha = 0.04 + Math.sin(Date.now()/500 + i) * 0.01;
            ctx.fillRect(lx, 28, 8, 4);
            ctx.fillStyle = '#ffeecc';
            ctx.globalAlpha = 0.02;
            ctx.fillRect(lx-15, 30, 38, 20);
            ctx.globalAlpha = 1;
        }

        drawFloor(350);

        // Двері
        for (let i = 0; i < 3; i++) {
            const dx = 80 + i*240 + o*0.2;
            ctx.fillStyle = '#2a1a10';
            ctx.fillRect(dx, 80, 55, 270);
            ctx.strokeStyle = 'rgba(60,40,30,0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(dx, 80, 55, 270);
        }

        // Вікно в кінці
        drawWindow(700, 60, 60, 90, true);

        // Провідник у кінці коридору
        if (!flag('conductorTalked2')) {
            drawPerson(650 + o*0.1, 310, {skin:'#d4b898', clothes:'#1a1a2a', hair:'#1a2020'});
            ctx.fillStyle = 'rgba(200,180,160,0.03)';
            ctx.font = '9px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('провідник', 650 + o*0.1, 285);
        }

        drawVignette();

        ctx.fillStyle = 'rgba(200,180,160,0.08)';
        ctx.font = '28px Georgia';
        ctx.textAlign = 'left'; ctx.fillText('‹', 12, H/2);
        ctx.textAlign = 'right'; ctx.fillText('›', W-12, H/2);
    }

    function drawCar(angle) {
        const o = angle * 80;
        ctx.fillStyle = '#262016';
        ctx.fillRect(0, 0, W, 350);
        ctx.fillStyle = '#221c14';
        ctx.fillRect(0, 0, W, 350);

        // Стіни — ліва і права
        ctx.fillStyle = '#282218';
        ctx.fillRect(0, 0, 180 + o*0.2, 350);
        ctx.fillStyle = '#262016';
        ctx.fillRect(620 + o*0.2, 0, W, 350);

        ctx.fillStyle = '#1c1610';
        ctx.fillRect(0, 0, W, 28);

        drawFloor(350);

        // Сидіння
        const seatColor = '#3a2a1a';
        ctx.fillStyle = seatColor;
        ctx.fillRect(80 + o*0.2, 220, 80, 100);
        ctx.fillRect(640 + o*0.2, 220, 80, 100);
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(80 + o*0.2, 220, 80, 10);
        ctx.fillRect(640 + o*0.2, 220, 80, 10);

        // Столик
        ctx.fillStyle = '#5a4030';
        ctx.fillRect(350 + o*0.3, 200, 100, 5);
        ctx.fillStyle = '#4a3020';
        ctx.fillRect(395 + o*0.3, 205, 10, 70);

        // Вікно
        drawWindow(340, 60, 120, 150, true);

        // Багаж
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(80 + o*0.1, 32, 640, 10);

        // Пальто
        ctx.fillStyle = '#2a2015';
        ctx.fillRect(200 + o*0.1, 35, 20, 50);

        // Сусід
        if (!flag('neighborGone')) {
            drawPerson(120 + o*0.2, 260, {skin:'#d4b898', clothes:'#3a2a2a', hair:'#222222'});
            ctx.fillStyle = 'rgba(200,180,160,0.03)';
            ctx.font = '9px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('сусід', 120 + o*0.2, 230);
        }

        // Чемодан
        if (!flag('ticketTaken')) {
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(700, 275, 40, 35);
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(700, 275, 40, 5);
        }

        drawVignette();
    }

    function drawRestaurant(angle) {
        const o = angle * 60;
        ctx.fillStyle = '#1e1a14';
        ctx.fillRect(0, 0, W, 350);
        ctx.fillStyle = '#1c1610';
        ctx.fillRect(0, 0, W, 28);
        drawFloor(350);

        // Стійка
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(340 + o, 160, 120, 190);
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(330 + o, 160, 140, 8);

        // Пляшки
        for (let i = 0; i < 5; i++) {
            ctx.fillStyle = ['#2a3a2a','#3a2a2a','#2a2a3a','#4a3a2a','#2a3a2a'][i];
            ctx.fillRect(358 + i*12 + o, 140, 8, 20);
        }

        // Столики
        [{x:80,y:260,w:60},{x:500,y:260,w:60}].forEach(t => {
            ctx.fillStyle = '#5a4030';
            ctx.fillRect(t.x + o*0.3, t.y, t.w, 4);
            ctx.fillStyle = '#4a3020';
            ctx.fillRect(t.x + o*0.3 + 8, t.y+4, 5, 50);
            ctx.fillRect(t.x + o*0.3 + t.w-13, t.y+4, 5, 50);
        });

        // Вікна
        drawWindow(100, 100, 60, 100, true);
        drawWindow(550, 100, 60, 100, true);

        // Провідник
        if (!flag('conductorGone')) {
            drawPerson(400 + o, 170, {skin:'#c8b898', clothes:'#1a1a2a', hair:'#2a2018'});
            ctx.fillStyle = 'rgba(200,180,160,0.03)';
            ctx.font = '9px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('провідник', 400 + o, 145);
            // Кашкет
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(386 + o, 118, 28, 5);
            ctx.fillRect(383 + o, 115, 34, 4);
        }

        drawVignette();
    }

    function drawLuggage(angle) {
        const o = angle * 80;
        ctx.fillStyle = '#121018';
        ctx.fillRect(0, 0, W, 350);
        ctx.fillStyle = '#0e0c14';
        ctx.fillRect(0, 0, W, 28);
        drawFloor(350);

        // Ящики
        for (let i = 0; i < 3; i++) {
            const bx = 100 + i*180 + o*0.2;
            const by = 230 - i*15;
            ctx.fillStyle = '#1e1a14';
            ctx.fillRect(bx, by, 70 + i*15, 70 + i*6);
            ctx.strokeStyle = 'rgba(60,40,30,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, 70 + i*15, 70 + i*6);
        }

        // Мале вікно
        drawWindow(30, 60, 40, 50, true);

        // Світло
        ctx.fillStyle = '#ffddaa';
        ctx.globalAlpha = 0.04 + Math.sin(Date.now()/600) * 0.01;
        ctx.fillRect(385, 0, 30, 4);
        ctx.globalAlpha = 1;

        // Тінь (таємнича постать)
        if (!flag('shadowGone')) {
            const sx = 400 + o*0.2;
            ctx.fillStyle = '#08060e';
            ctx.beginPath();
            ctx.arc(sx, 200, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(sx - 16, 200, 32, 40);
            ctx.fillStyle = 'rgba(100,130,200,0.15)';
            ctx.beginPath();
            ctx.arc(sx-5, 198, 3, 0, Math.PI*2);
            ctx.arc(sx+5, 198, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'rgba(200,180,160,0.03)';
            ctx.font = '9px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('?', sx, 255);
        }

        drawVignette();
    }

    function drawRoof(angle) {
        const o = angle * 80;
        ctx.fillStyle = '#08060c';
        ctx.fillRect(0, 0, W, H);

        // Зорі
        for (let i = 0; i < 40; i++) {
            const sx = (i*137 + 50) % W;
            const sy = (i*97 + 30) % 250;
            ctx.fillStyle = `rgba(200,210,255,${0.1 + Math.sin(Date.now()/1000 + i) * 0.05})`;
            ctx.beginPath();
            ctx.arc(sx, sy, 0.5 + Math.sin(i)*0.5, 0, Math.PI*2);
            ctx.fill();
        }

        // Місяць
        ctx.fillStyle = 'rgba(200,200,220,0.06)';
        ctx.beginPath();
        ctx.arc(600, 60, 40, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(200,200,220,0.02)';
        ctx.beginPath();
        ctx.arc(600, 60, 60, 0, Math.PI*2);
        ctx.fill();

        // Потяг (дах)
        ctx.fillStyle = '#0a0810';
        ctx.fillRect(0, 280, W, 220);

        // Край даху
        ctx.fillStyle = '#0e0c14';
        ctx.fillRect(0, 280, W, 8);

        // Рух
        for (let i = 0; i < 10; i++) {
            ctx.fillStyle = `rgba(255,255,255,${0.01 + Math.sin(Date.now()/300 + i*0.5) * 0.005})`;
            ctx.fillRect(i*80 + (Date.now()/200 % 80) - 80 + o*0.1, 290 + i*15, 20, 3);
        }

        // Тінь (та сама)
        if (!flag('shadowGoneRoof')) {
            const sx = 350 + o*0.2;
            ctx.fillStyle = '#0a0810';
            ctx.beginPath();
            ctx.arc(sx, 310, 16, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(sx - 14, 310, 28, 35);
            ctx.fillStyle = 'rgba(100,130,200,0.1)';
            ctx.beginPath();
            ctx.arc(sx-4, 308, 2.5, 0, Math.PI*2);
            ctx.arc(sx+4, 308, 2.5, 0, Math.PI*2);
            ctx.fill();
        }

        drawVignette();
    }

    function showText(name, text, noOverlay = false) {
        if (overlayOpen) return;
        if (noOverlay) {
            dName.textContent = name;
            dText.textContent = text;
            dChoices.innerHTML = '<button onclick="closeDialog()">Продовжити</button>';
            dialog.style.display = 'block';
            dialogOpen = true;
        } else {
            tText.textContent = text;
            tSub.textContent = '— ' + name + ' —';
            textOverlay.style.display = 'flex';
            overlayOpen = true;
        }
    }

    function openDialog(name, text, choices) {
        if (overlayOpen) return;
        dName.textContent = name;
        dText.textContent = text;
        dChoices.innerHTML = '';
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.textContent = c.text;
            btn.onclick = () => {
                dialog.style.display = 'none';
                dialogOpen = false;
                if (c.next) c.next();
            };
            dChoices.appendChild(btn);
        });
        dialog.style.display = 'block';
        dialogOpen = true;
    }

    function closeDialog() {
        dialog.style.display = 'none';
        dialogOpen = false;
    }

        textOverlay.style.display = 'none';
        overlayOpen = false;
    });

    function startGame() {
        start.style.opacity = '0';
        start.style.pointerEvents = 'none';
        setTimeout(() => { start.style.display = 'none'; }, 800);
        gameStarted = true;
        showText('🚂 2007', 'Ти прокидаєшся в купе. За вікном — ніч. Потяг мчить. Годинник — 23:55. У кишені папірець: «Згадай останній рейс №7.» Ти не пам\'ятаєш, як сюди потрапив. Але щось у цьому потязі... знайоме.');

    document.getElementById('start').addEventListener('click', e => {
        if (e.target === e.currentTarget) startGame();
    });

    // Кнопки навігації
    document.getElementById('btnPrev').addEventListener('click', () => {
        if (dialogOpen || overlayOpen) return;
        const locs = LOCATIONS;
        const idx = locs.indexOf(currentScene);
        if (idx > 0) switchScene(locs[idx - 1]);
    });
    document.getElementById('btnNext').addEventListener('click', () => {
        if (dialogOpen || overlayOpen) return;
        const locs = LOCATIONS;
        const idx = locs.indexOf(currentScene);
        if (idx < locs.length - 1) switchScene(locs[idx + 1]);
    });

    function switchScene(scene) {
        if (isTransitioning) return;
        isTransitioning = true;
        currentScene = scene;
        lookAngle = 0;
        if (dialogOpen) closeDialog();
        // Якщо гравець вийшов на дах — секретна умова
        if (scene === 'roof' && !flag('foundRoof')) {
            setFlag('foundRoof');
            addItem('🌙');
            setTimeout(() => {
                showText('🌙 Дах', 'Холодний вітер. Зорі. Ти вийшов на дах рухомого потяга. Внизу — темрява. Але далеко попереду — вогні. Станція? Чи щось інше?');
            }, 500);
        }
        setTimeout(() => { isTransitioning = false; }, 300);
    }

    // ============================================================
    // РЕНДЕР
    // ============================================================
    function render() {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, W, H);

        if (!gameStarted) { requestAnimationFrame(render); return; }

        // Малювання сцени
        switch(currentScene) {
            case 'corridor': drawCorridor(lookAngle); break;
            case 'car': drawCar(lookAngle); break;
            case 'restaurant': drawRestaurant(lookAngle); break;
            case 'luggage': drawLuggage(lookAngle); break;
            case 'roof': drawRoof(lookAngle); break;
            default: drawCar(0);
        }

        // Назва сцени
        const names = {
            corridor: 'коридор', car: 'купе №3', restaurant: 'вагон-ресторан',
            luggage: 'вантажний', roof: 'дах'
        };
        sceneName.textContent = (names[currentScene] || currentScene).toUpperCase();

        // Обробка кліків через canvas (промальована)
        if (gameStarted && !isTransitioning) {
            const hs = getHotspots(currentScene, lookAngle);
            if (mousePos) {
                let found = false;
                for (const h of hs) {
                    if (!h.show || !h.show()) continue;
                    const {x,y,w,h:hh} = h;
                    if (mousePos.x >= x && mousePos.x <= x+w && mousePos.y >= y && mousePos.y <= y+hh) {
                        // Підрамка
                        ctx.strokeStyle = 'rgba(200,180,160,0.12)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3,3]);
                        ctx.strokeRect(x, y, w, hh);
                        ctx.setLineDash([]);
                        ctx.fillStyle = 'rgba(6,6,10,0.6)';
                        ctx.font = '9px Georgia';
                        ctx.textAlign = 'center';
                        const tw = ctx.measureText(h.label).width + 12;
                        ctx.fillRect(x + w/2 - tw/2, y - 18, tw, 14);
                        ctx.fillStyle = '#c8b4a0';
                        ctx.fillText(h.label, x + w/2, y - 8);
                        found = true;
                        break;
                    }
                }
                canvas.style.cursor = found ? 'pointer' : 'default';
            }
        }

        requestAnimationFrame(render);
    }

    // ============================================================
    // МИША
    // ============================================================
    let mousePos = null;

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        mousePos = {
            x: (e.clientX - rect.left) * (W / rect.width),
            y: (e.clientY - rect.top) * (H / rect.height)
        };
    });

    canvas.addEventListener('mouseleave', () => { mousePos = null; canvas.style.cursor = 'default'; });

    canvas.addEventListener('click', e => {
        if (!gameStarted || dialogOpen || overlayOpen || isTransitioning) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (W / rect.width);
        const y = (e.clientY - rect.top) * (H / rect.height);

        const hs = getHotspots(currentScene, lookAngle);
        for (const h of hs) {
            if (!h.show || !h.show()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.hh) {
                h.action();
                return;
            }
        }

        // Край — переміщення
        if (x < 30) {
            const locs = LOCATIONS;
            const idx = locs.indexOf(currentScene);
            if (idx > 0) switchScene(locs[idx - 1]);
        } else if (x > W - 30) {
            const locs = LOCATIONS;
            const idx = locs.indexOf(currentScene);
            if (idx < locs.length - 1) switchScene(locs[idx + 1]);
        }
    });

    // Клавіші
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' && !dialogOpen && !overlayOpen) {
            const locs = LOCATIONS; const idx = locs.indexOf(currentScene);
            if (idx > 0) switchScene(locs[idx - 1]);
        }
        if (e.key === 'ArrowRight' && !dialogOpen && !overlayOpen) {
            const locs = LOCATIONS; const idx = locs.indexOf(currentScene);
            if (idx < locs.length - 1) switchScene(locs[idx + 1]);
        }
        if (e.key === 'Escape') {
            if (dialogOpen) closeDialog();
            if (overlayOpen) { textOverlay.style.display = 'none'; overlayOpen = false; }
        }
    });

    // ============================================================
    // СТАРТ
    // ============================================================
    renderInv();
    render();
</script>
</body>
</html>
