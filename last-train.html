<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Останній потяг — Last Train</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #08080a; font-family: 'Georgia', serif; overflow: hidden; user-select: none; }
        #game {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 600px;
            background: #0d0d12;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
        }
        canvas { display: block; width: 800px; height: 550px; cursor: pointer; }

        #ui-bot {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 50px;
            display: flex; align-items: center;
            background: rgba(8,8,10,0.85);
            border-top: 1px solid rgba(200,180,160,0.08);
            padding: 0 10px;
        }
        #nav { display: flex; gap: 6px; }
        #nav button {
            background: rgba(200,180,160,0.06);
            border: 1px solid rgba(200,180,160,0.12);
            color: #c8b4a0;
            width: 36px; height: 36px;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.15s;
        }
        #nav button:hover { background: rgba(200,180,160,0.15); border-color: rgba(200,180,160,0.3); }
        #nav button:active { background: rgba(200,180,160,0.2); }
        #inv {
            display: flex; gap: 4px; margin-left: 14px;
        }
        .inv-slot {
            width: 36px; height: 36px;
            border: 1px solid rgba(200,180,160,0.1);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            background: rgba(255,255,255,0.02);
        }
        .inv-slot.has { border-color: rgba(200,180,160,0.25); background: rgba(200,180,160,0.06); }
        #scene-name {
            margin-left: auto;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(200,180,160,0.3);
        }

        #dialog {
            position: absolute;
            bottom: 55px; left: 15px; right: 15px;
            background: rgba(6,6,10,0.94);
            border: 1px solid rgba(200,180,160,0.08);
            border-radius: 5px;
            padding: 14px 16px;
            color: #d0c0b0;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            max-height: 180px;
            backdrop-filter: blur(4px);
        }
        #dialog .speaker {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.35;
            margin-bottom: 3px;
        }
        #dialog .choices { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        #dialog .choices button {
            background: rgba(200,180,160,0.06);
            border: 1px solid rgba(200,180,160,0.12);
            color: #c8b4a0;
            padding: 6px 14px;
            border-radius: 3px;
            font-size: 13px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.15s;
        }
        #dialog .choices button:hover { background: rgba(200,180,160,0.15); border-color: rgba(200,180,160,0.3); }

        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6,6,10,1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            transition: opacity 0.8s;
        }
        #start-screen h1 {
            color: #c8b4a0;
            font-size: 2.4em;
            font-weight: normal;
            letter-spacing: 0.3em;
        }
        #start-screen .sub { color: rgba(200,180,160,0.4); font-size: 0.9em; letter-spacing: 0.15em; margin-top: 6px; }
        #start-screen .start-btn {
            margin-top: 30px;
            padding: 10px 36px;
            border: 1px solid rgba(200,180,160,0.2);
            border-radius: 4px;
            color: #c8b4a0;
            font-size: 1em;
            font-family: 'Georgia', serif;
            background: rgba(200,180,160,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        #start-screen .start-btn:hover { background: rgba(200,180,160,0.12); border-color: rgba(200,180,160,0.4); }

        #end-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6,6,10,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 40px;
            text-align: center;
        }
        #end-screen h2 { color: #c8b4a0; font-weight: normal; letter-spacing: 0.2em; margin-bottom: 16px; font-size: 1.4em; }
        #end-screen p { color: rgba(200,180,160,0.6); font-size: 0.9em; max-width: 500px; line-height: 1.6; }

        @media (max-width: 820px) {
            #game { width: 100vw; height: 100vh; border-radius: 0; }
            canvas { width: 100vw; height: calc(100vh - 50px); }
        }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>ОСТАННІЙ ПОТЯГ</h1>
    <div class="sub">— Last Train —</div>
    <div class="start-btn">🚂 Почати</div>
</div>

<div id="end-screen">
    <h2>🚂 КІНЕЦЬ</h2>
    <p id="end-text"></p>
</div>

<div id="game">
    <canvas id="c" width="800" height="550"></canvas>
    <div id="dialog">
        <div class="speaker" id="dSpeaker"></div>
        <div id="dText"></div>
        <div class="choices" id="dChoices"></div>
    </div>
    <div id="ui-bot">
        <div id="nav">
            <button id="btnPrev">◀</button>
            <button id="btnNext">▶</button>
        </div>
        <div id="inv"></div>
        <div id="scene-name">Купе 1</div>
    </div>
</div>

<script>
    // ============================================================
    // НАЛАШТУВАННЯ
    // ============================================================
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 550;

    const invDiv = document.getElementById('inv');
    const dialog = document.getElementById('dialog');
    const dSpeaker = document.getElementById('dSpeaker');
    const dText = document.getElementById('dText');
    const dChoices = document.getElementById('dChoices');
    const sceneName = document.getElementById('scene-name');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    const endText = document.getElementById('end-text');

    // ============================================================
    // СТАН ГРИ
    // ============================================================
    const inventory = [];
    let dialogOpen = false;
    let currentAngle = 0; // -1(ліворуч), 0(центр), 1(праворуч)
    let currentScene = 'car1';
    let globalFlags = {};

    function addToInv(item) { if (!inventory.includes(item)) { inventory.push(item); renderInv(); } }
    function hasItem(item) { return inventory.includes(item); }
    function flag(name) { return globalFlags[name] || false; }
    function setFlag(name) { globalFlags[name] = true; }

    // ============================================================
    // ДОПОМІЖНІ ФУНКЦІЇ МАЛЮВАННЯ
    // ============================================================
    function drawPerson(x, y, skinColor, clothesColor, hairColor, isMale = true) {
        // Тіло
        ctx.fillStyle = clothesColor;
        ctx.fillRect(x - 12, y - 40, 24, 50);
        // Голова
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.arc(x, y - 52, 14, 0, Math.PI * 2);
        ctx.fill();
        // Волосся
        ctx.fillStyle = hairColor;
        if (isMale) {
            ctx.fillRect(x - 14, y - 66, 28, 12);
            ctx.beginPath();
            ctx.arc(x, y - 66, 14, Math.PI, 2 * Math.PI);
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(x, y - 58, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = hairColor;
            ctx.fillRect(x - 12, y - 64, 24, 8);
        }
        // Очі
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - 5, y - 54, 4, 0, Math.PI * 2);
        ctx.arc(x + 5, y - 54, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(x - 4, y - 53, 2, 0, Math.PI * 2);
        ctx.arc(x + 6, y - 53, 2, 0, Math.PI * 2);
        ctx.fill();
        // Комір
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - 4, y - 42, 8, 4);
    }

    function drawWindow(x, y, w, h) {
        ctx.fillStyle = '#0a1520';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#152035';
        ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
        ctx.fillStyle = 'rgba(180,200,230,0.06)';
        ctx.beginPath();
        ctx.arc(x + w * 0.5, y + h * 0.3, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#3a2a1a';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, w, h);
        ctx.beginPath();
        ctx.moveTo(x + w/2, y); ctx.lineTo(x + w/2, y + h);
        ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2);
        ctx.stroke();
    }

    function drawTable(x, y, w, color = '#3a2a1a') {
        ctx.fillStyle = '#5a4030';
        ctx.fillRect(x, y, w, 6);
        ctx.fillStyle = '#4a3020';
        ctx.fillRect(x + 8, y + 6, 5, 50);
        ctx.fillRect(x + w - 13, y + 6, 5, 50);
    }

    function drawFloor(y) {
        ctx.fillStyle = '#1a1610';
        ctx.fillRect(0, y, W, H - y);
        ctx.fillStyle = '#221c14';
        for (let x = 0; x < W; x += 60) {
            ctx.fillRect(x, y, 58, H - y);
            ctx.strokeStyle = 'rgba(0,0,0,0.12)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, 58, H - y);
        }
    }

    function vignette() {
        const g = ctx.createRadialGradient(400, 250, 150, 400, 250, 500);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
    }

    // ============================================================
    // ВАГОН 1 — КУПЕ
    // ============================================================
    function drawCar1(angle) {
        const off = angle * 80;
        ctx.fillStyle = '#2e281e';
        ctx.fillRect(0, 0, W, 430);

        // Стіни
        ctx.fillStyle = '#282218';
        ctx.fillRect(0, 0, 280 + off, 430);
        ctx.fillStyle = '#262016';
        ctx.fillRect(520 + off, 0, W, 430);

        // Стеля
        ctx.fillStyle = '#1e1a14';
        ctx.fillRect(0, 0, W, 30);
        ctx.fillStyle = '#ffddaa';
        ctx.globalAlpha = 0.1 + Math.sin(Date.now() / 800) * 0.025;
        ctx.fillRect(370, 0, 60, 6);
        ctx.globalAlpha = 1;

        drawFloor(430);

        // Сидіння ліворуч
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(100 + off * 0.2, 280, 100, 120);
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(100 + off * 0.2, 280, 100, 16);
        ctx.fillStyle = '#2a1a10';
        ctx.fillRect(100 + off * 0.2, 296, 100, 104);

        // Сидіння праворуч
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(600 + off * 0.2, 280, 100, 120);
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(600 + off * 0.2, 280, 100, 16);

        // Столик
        drawTable(300 + off * 0.3, 260, 200);

        // Вікно
        drawWindow(330, 70, 140, 150);

        // Багажна полиця
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(80 + off * 0.1, 50, 640, 12);

        // Пальто
        ctx.fillStyle = '#2a2015';
        ctx.fillRect(180 + off * 0.1, 55, 25, 50);
        ctx.fillStyle = '#1a1510';
        ctx.fillRect(182 + off * 0.1, 105, 21, 18);

        // === ЛЮДИ ===
        // Бізнесмен (сидить ліворуч)
        if (!flag('businessmanGone')) {
            drawPerson(150 + off * 0.2, 310, '#d4b898', '#3a2a2a', '#1a1a1a', true);
            ctx.fillStyle = 'rgba(200,180,160,0.04)';
            ctx.font = '10px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('чоловік у костюмі', 150 + off * 0.2, 270);
        }

        // Чемодан (якщо не взяли квиток)
        if (!flag('ticketTaken')) {
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(680, 350, 45, 40);
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(680, 350, 45, 6);
            ctx.strokeStyle = '#5a4a3a';
            ctx.lineWidth = 1;
            ctx.strokeRect(680, 350, 45, 40);
        }

        vignette();

        // Стрілки
        ctx.fillStyle = 'rgba(200,180,160,0.15)';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'left'; ctx.fillText('‹', 10, H/2);
        ctx.textAlign = 'right'; ctx.fillText('›', W - 10, H/2);
    }

    // ============================================================
    // ВАГОН 2 — РЕСТОРАН
    // ============================================================
    function drawCar2(angle) {
        const off = angle * 60;
        ctx.fillStyle = '#1e1a14';
        ctx.fillRect(0, 0, W, 430);

        // Стеля
        ctx.fillStyle = '#1a1610';
        ctx.fillRect(0, 0, W, 30);
        ctx.fillStyle = '#ffddaa';
        ctx.globalAlpha = 0.08 + Math.sin(Date.now() / 700) * 0.02;
        ctx.fillRect(370, 0, 60, 6);
        ctx.globalAlpha = 1;

        drawFloor(430);

        // Стійка бару
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(340 + off, 180, 120, 250);
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(330 + off, 180, 140, 10);

        // Пляшки
        const bc = ['#2a3a2a','#3a2a2a','#2a2a3a','#4a3a2a'];
        for (let i = 0; i < 5; i++) {
            ctx.fillStyle = bc[i % 4];
            ctx.fillRect(358 + i * 12 + off, 158, 8, 22);
            ctx.fillStyle = 'rgba(200,180,140,0.05)';
            ctx.fillRect(359 + i * 12 + off, 156, 6, 3);
        }

        // Столики
        drawTable(80 + off * 0.3, 300, 70);
        drawTable(500 + off * 0.3, 300, 70);

        // Вікна
        drawWindow(100, 110, 80, 110);
        drawWindow(520, 110, 80, 110);

        // === ЛЮДИ ===
        // Провідник (за стійкою)
        if (!flag('conductorGone')) {
            drawPerson(400 + off, 190, '#c8b898', '#2a2a3a', '#2a2018', true);
            ctx.fillStyle = 'rgba(200,180,160,0.04)';
            ctx.font = '10px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('провідник', 400 + off, 160);
            // Кашкет
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(386 + off, 138, 28, 6);
            ctx.fillRect(383 + off, 135, 34, 4);
        }

        vignette();

        ctx.fillStyle = 'rgba(200,180,160,0.15)';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'left'; ctx.fillText('‹', 10, H/2);
        ctx.textAlign = 'right'; ctx.fillText('›', W - 10, H/2);
    }

    // ============================================================
    // ВАГОН 3 — ВАНТАЖНИЙ
    // ============================================================
    function drawCar3(angle) {
        const off = angle * 80;
        ctx.fillStyle = '#121018';
        ctx.fillRect(0, 0, W, 430);

        // Стеля
        ctx.fillStyle = '#0e0c14';
        ctx.fillRect(0, 0, W, 30);
        ctx.fillStyle = '#ffddaa';
        ctx.globalAlpha = 0.06 + Math.sin(Date.now() / 600) * 0.015;
        ctx.fillRect(380, 0, 40, 6);
        ctx.globalAlpha = 1;

        drawFloor(430);

        // Ящики
        for (let i = 0; i < 3; i++) {
            const bx = 100 + i * 200 + off * 0.2;
            const by = 280 - i * 20;
            ctx.fillStyle = '#1e1a14';
            ctx.fillRect(bx, by, 80 + i * 15, 70 + i * 8);
            ctx.strokeStyle = 'rgba(80,60,40,0.25)';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, 80 + i * 15, 70 + i * 8);
        }

        // Маленьке віконце
        drawWindow(30, 70, 50, 60);

        // === ЛЮДИ ===
        // Тінь (таємнича постать)
        if (!flag('shadowGone')) {
            const sx = 370 + off * 0.2;
            // Силует
            ctx.fillStyle = '#0a0810';
            ctx.beginPath();
            ctx.arc(sx, 230, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#08060e';
            ctx.fillRect(sx - 16, 230, 32, 45);
            // Очі (світяться)
            ctx.fillStyle = 'rgba(150,180,255,0.2)';
            ctx.beginPath();
            ctx.arc(sx - 5, 228, 3, 0, Math.PI * 2);
            ctx.arc(sx + 5, 228, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(200,180,160,0.04)';
            ctx.font = '10px Georgia';
            ctx.textAlign = 'center';
            ctx.fillText('?', sx, 290);
        }

        vignette();

        ctx.fillStyle = 'rgba(200,180,160,0.12)';
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'right'; ctx.fillText('›', W - 10, H/2);
    }

    // ============================================================
    // СЦЕНИ
    // ============================================================
    const scenes = {
        car1: {
            name: 'Купе 1',
            draw: drawCar1,
            hotspots: function(angle) {
                const off = angle * 80;
                return [
                    { id: 'businessman', x: 130 + off*0.2 - 20, y: 260, w: 40, h: 70,
                      label: '💼 Чоловік', show: () => !flag('businessmanGone'),
                      action: () => {
                          if (!flag('talkedBM')) {
                              setFlag('talkedBM');
                              showDialog('💼 Чоловік у костюмі', 'Він сидить біля вікна й дивиться у ніч. «Ти теж прокинувся? Я їду вже третю ніч. Щоночі той самий потяг. Та сама музика. Ті самі обличчя. Ти — нове. Це поганий знак.»', [
                                  { text: 'Хто ти?', next: () => showText('💼 Чоловік', '«Я — ніхто. Просто пасажир. Але я знаю одне: якщо побачиш провідника — не бери в нього чай. Ніколи.»') },
                                  { text: 'Як зупинити потяг?', next: () => showText('💼 Чоловік', '«Зупинити? Ха! Ти думаєш, я б не спробував? Кажуть, ключ у провідника. Але він не віддасть.»') },
                              ]);
                          } else {
                              showText('💼 Чоловік', 'Він мовчки дивиться у вікно. Здається, він уже сказав усе.');
                          }
                      } },
                    { id: 'suitcase', x: 680, y: 350, w: 45, h: 40,
                      label: '🧳 Чемодан', show: () => !flag('ticketTaken'),
                      action: () => { setFlag('ticketTaken'); addToInv('🎫');
                          showText('🧳 Чемодан', 'Старий шкіряний чемодан. Всередині — квиток. «Купе 3, місце 7. Сьогодні. 23:55.» І напис: «Не віддавай квиток нікому.»'); } },
                    { id: 'photo', x: 580, y: 80, w: 60, h: 50,
                      label: '🖼 Фото', show: () => !flag('photoTaken'),
                      action: () => { setFlag('photoTaken'); addToInv('🖼');
                          showText('🖼 Фото', 'Родина біля моря. 2007 рік. Мама, тато, дівчинка. На звороті: «Наш останній потяг до моря». Ти впізнаєш ту дівчинку. Це ти.'); } },
                ];
            }
        },
        car2: {
            name: 'Вагон-ресторан',
            draw: drawCar2,
            hotspots: function(angle) {
                const off = angle * 60;
                return [
                    { id: 'conductor', x: 370 + off - 20, y: 150, w: 60, h: 85,
                      label: '👨‍✈️ Провідник', show: () => !flag('conductorGone'),
                      action: () => {
                          if (!flag('talkedCond')) {
                              setFlag('talkedCond');
                              showDialog('👨‍✈️ Провідник', 'Він стоїть за стійкою і протирає склянку. Погляд у тебе — колючий. «Чаю? Він заспокоює нерви. Всі пасажири беруть чай. Ти перший, хто вагається.»', [
                                  { text: 'Візьми чай.', next: () => { setFlag('tookTea'); showText('👨‍✈️ Провідник', 'Він наливає темну рідину. Ти робиш ковток — і світ на мить тьмяніє. Коли отямлюєшся, він усміхається. «Тепер ти — один із нас.»'); } },
                                  { text: 'Відмовитись.', next: () => showText('👨‍✈️ Провідник', 'Він знизує плечима. «Як хочеш. Але запам\'ятай: у цьому потязі всі рано чи пізно беруть чай. Питання часу.»') },
                              ]);
                          } else if (flag('tookTea') && !flag('askedKey')) {
                              setFlag('askedKey');
                              showDialog('👨‍✈️ Провідник', 'Ти вимагаєш ключ. Він довго дивиться на тебе. Потім дістає з кишені малий латунний ключ. «Вантажний вагон. Але тобі туди не треба, повір.»', [
                                  { text: 'Дай сюди.', next: () => { setFlag('gotKey'); addToInv('🔑'); showText('🔑 Отримано', 'Ключ холодний і важкий. На бирці — номер «3».'); } },
                                  { text: 'Чому не треба?', next: () => showText('👨‍✈️ Провідник', '«Там те, що лишилось від минулого рейсу. Ті, хто не вийшов. Вони чекають.»') },
                              ]);
                          } else {
                              showText('👨‍✈️ Провідник', 'Він мовчки протирає склянку. Знову і знову.');
                          }
                      } },
                    { id: 'menu', x: 340 + off, y: 190, w: 120, h: 12,
                      label: '📋 Меню', show: () => true,
                      action: () => showText('📋 Меню', '«Чай — безкоштовно. Кава — 5 руб. 2006 р. Бутерброд — 3 руб. Компот — 1 руб.» Ціни з минулого. Потяг застряг у часі.') },
                ];
            }
        },
        car3: {
            name: 'Вантажний вагон',
            draw: drawCar3,
            hotspots: function(angle) {
                const off = angle * 80;
                return [
                    { id: 'shadow', x: 340 + off*0.2 - 30, y: 200, w: 60, h: 80,
                      label: '👤 Тінь', show: () => !flag('shadowGone'),
                      action: () => {
                          if (!flag('talkedShadow')) {
                              setFlag('talkedShadow');
                              showDialog('👤 Тінь', 'З темряви виступає силует. Голос тихий, надтріснутий, але знайомий. «Ти нарешті прийшов. Я чекав. Цей потяг возить тих, хто не попрощався. Твоя родина — у вагоні, який ти ще не знайшов.»', [
                                  { text: 'Хто ти?', next: () => showText('👤 Тінь', '«Я — той, хто вів цей потяг до тебе. Я — твій батько. Я не встиг попрощатись 2007-го. Тепер маємо час.»') },
                                  { text: 'Як зупинити це?', next: () => showText('👤 Тінь', '«Провідник має ключ. Але він не віддасть просто так. Він хоче, щоб ти лишився. Навічно.»') },
                              ]);
                          } else if (flag('gotKey') && !flag('boxOpened')) {
                              setFlag('boxOpened');
                              showText('📦 Ящик', 'Ти відчиняєш ящик ключем. Всередині — листи. Багато листів. Усі — до тебе. «Не сходь на цьому потязі. Він іде в один кінець. Тато.» Останній лист датований сьогодні.');
                          } else {
                              showText('👤 Тінь', 'Він мовчки дивиться на тебе. Його очі світяться у темряві.');
                          }
                      } },
                    { id: 'box', x: 100 + off*0.2, y: 280, w: 80, h: 70,
                      label: '📦 Ящик', show: () => flag('gotKey') && !flag('boxOpened'),
                      action: () => { setFlag('boxOpened');
                          showText('📦 Ящик', 'Ключ підходить. Всередині — старі сімейні листи. Фото батьків. Твій дитячий малюнок: «Тату, повернись». Ти хочеш вийти з цього потяга.'); } },
                    { id: 'exit', x: 660, y: 200, w: 60, h: 100,
                      label: '🚪 Двері', show: () => flag('boxOpened') && !flag('escaped'),
                      action: () => { setFlag('escaped');
                          showText('🚪 Двері', 'Ти смикаєш ручку. Двері піддаються. Холодне повітря б\'є в обличчя. Потяг сповільнюється. Ти бачиш вогні станції... Станція «2007». Дім.');
                          setTimeout(() => {
                              endScreen.style.display = 'flex';
                              endText.textContent = 'Ти виходиш з потяга. Теплий вітер. Пахне морем. Попереду — будинок, де чекають. Ти встиг попрощатись.';
                          }, 3000);
                      } },
                ];
            }
        }
    };

    // ============================================================
    // РЕНДЕР
    // ============================================================
    let hoveredHotspot = null;
    let particles = [];

    function updateParticles() {
        if (Math.random() > 0.5) {
            particles.push({
                x: Math.random() * W, y: 40 + Math.random() * 40,
                vx: (Math.random() - 0.5) * 0.15, vy: 0.2 + Math.random() * 0.4,
                life: 150 + Math.random() * 150, size: 0.5 + Math.random() * 1.5
            });
        }
        particles = particles.filter(p => {
            p.x += p.vx; p.y += p.vy; p.life--;
            return p.life > 0 && p.y < 400;
        });
    }

    function render() {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, W, H);

        const scene = scenes[currentScene];
        if (scene) scene.draw(currentAngle);

        particles.forEach(p => {
            ctx.fillStyle = `rgba(200,190,180,${(p.life / 200) * 0.12})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        if (hoveredHotspot && !dialogOpen) {
            const h = hoveredHotspot;
            ctx.strokeStyle = 'rgba(200,180,160,0.2)';
            ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
            ctx.strokeRect(h.x, h.y, h.w, h.h);
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(6,6,10,0.75)';
            const tw = ctx.measureText(h.label).width + 16;
            ctx.fillRect(h.x + h.w/2 - tw/2, h.y - 22, tw, 16);
            ctx.fillStyle = '#c8b4a0';
            ctx.font = '10px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText(h.label, h.x + h.w/2, h.y - 11);
        }

        sceneName.textContent = scene ? scene.name : '';
    }

    function renderInv() {
        let html = '';
        for (let i = 0; i < 4; i++) {
            html += '<div class="inv-slot' + (inventory[i] ? ' has' : '') + '">' + (inventory[i] || '') + '</div>';
        }
        invDiv.innerHTML = html;
    }

    // ============================================================
    // ДІАЛОГИ
    // ============================================================
    function showText(speaker, text) {
        dSpeaker.textContent = speaker;
        dText.textContent = text;
        dChoices.innerHTML = '';
        dialog.classList.add('show');
        dialogOpen = true;
    }

    function showDialog(speaker, text, choices) {
        dSpeaker.textContent = speaker;
        dText.textContent = text;
        dChoices.innerHTML = '';
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.textContent = c.text;
            btn.addEventListener('click', () => {
                dialogOpen = false;
                dialog.classList.remove('show');
                if (c.next) c.next();
            });
            dChoices.appendChild(btn);
        });
        dialog.classList.add('show');
        dialogOpen = true;
    }

    function closeDialog() {
        dialog.classList.remove('show');
        dialogOpen = false;
    }

    // ============================================================
    // НАВІГАЦІЯ
    // ============================================================
    btnPrev.addEventListener('click', () => { if (!dialogOpen) currentAngle = Math.max(-1, currentAngle - 1); });
    btnNext.addEventListener('click', () => { if (!dialogOpen) currentAngle = Math.min(1, currentAngle + 1); });
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' && !dialogOpen) currentAngle = Math.max(-1, currentAngle - 1);
        if (e.key === 'ArrowRight' && !dialogOpen) currentAngle = Math.min(1, currentAngle + 1);
        if (e.key === 'e' || e.key === 'E') { if (dialogOpen) closeDialog(); }
    });

    // ============================================================
    // КЛІКИ ТА МИША
    // ============================================================
    function getMouse(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width),
                 y: (e.clientY - rect.top) * (canvas.height / rect.height) };
    }

    canvas.addEventListener('mousemove', e => {
        if (dialogOpen) { hoveredHotspot = null; canvas.style.cursor = 'default'; return; }
        const { x, y } = getMouse(e);
        const scene = scenes[currentScene];
        if (!scene) return;
        const hs = scene.hotspots(currentAngle);
        hoveredHotspot = null;
        for (const h of hs) {
            if (!h.show || !h.show()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                hoveredHotspot = h; break;
            }
        }
        canvas.style.cursor = hoveredHotspot ? 'pointer' : 'default';
    });

    canvas.addEventListener('click', e => {
        if (dialogOpen) { closeDialog(); return; }
        const { x, y } = getMouse(e);
        const scene = scenes[currentScene];
        if (!scene) return;
        const hs = scene.hotspots(currentAngle);
        for (const h of hs) {
            if (!h.show || !h.show()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                h.action(); return;
            }
        }
        // Перехід між вагонами
        if (x < 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx > 0) goToCar(cars[idx - 1]);
        } else if (x > W - 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx < cars.length - 1) goToCar(cars[idx + 1]);
        }
    });

    function goToCar(car) {
        currentScene = car;
        currentAngle = 0;
        if (dialogOpen) closeDialog();
    }

    // Touch
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const { x, y } = getMouse(touch);
        if (dialogOpen) { closeDialog(); return; }
        const scene = scenes[currentScene];
        if (!scene) return;
        const hs = scene.hotspots(currentAngle);
        for (const h of hs) {
            if (!h.show || !h.show()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                h.action(); return;
            }
        }
        if (x < 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx > 0) goToCar(cars[idx - 1]);
        } else if (x > W - 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx < cars.length - 1) goToCar(cars[idx + 1]);
        }
    }, { passive: false });

    // ============================================================
    // СТАРТ
    // ============================================================
    startScreen.querySelector('.start-btn').addEventListener('click', () => {
        startScreen.style.opacity = '0';
        setTimeout(() => { startScreen.style.display = 'none'; }, 800);
        showText('🚂', 'Ти прокидаєшся в купе. За вікном — ніч. Потяг мчить крізь темряву. Ти не пам\'ятаєш, як сюди потрапив. Годинник: 23:55. У кишені папірець: «Знайди правду в трьох вагонах.»');
    });

    // ============================================================
    // ЦИКЛ
    // ============================================================
    function loop() {
        updateParticles();
        render();
        requestAnimationFrame(loop);
    }
    renderInv();
    loop();
    console.log('✅ Останній потяг');
</script>
</body>
</html>
