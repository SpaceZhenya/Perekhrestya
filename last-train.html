<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Останній потяг — Last Train</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #08080a; font-family: 'Georgia', serif; overflow: hidden; user-select: none; }
        #game {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 600px;
            background: #0d0d12;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
        }
        canvas { display: block; width: 800px; height: 550px; cursor: pointer; }

        #ui-bot {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 50px;
            display: flex; align-items: center;
            background: rgba(8,8,10,0.85);
            border-top: 1px solid rgba(200,180,160,0.08);
            padding: 0 10px;
        }
        #nav {
            display: flex; gap: 6px;
        }
        #nav button {
            background: rgba(200,180,160,0.06);
            border: 1px solid rgba(200,180,160,0.12);
            color: #c8b4a0;
            width: 36px; height: 36px;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.15s;
        }
        #nav button:hover { background: rgba(200,180,160,0.15); border-color: rgba(200,180,160,0.3); }
        #nav button:active { background: rgba(200,180,160,0.2); }
        #nav button:disabled { opacity: 0.2; cursor: default; background: transparent; }

        #inv {
            display: flex; gap: 4px; margin-left: 14px;
        }
        .inv-slot {
            width: 36px; height: 36px;
            border: 1px solid rgba(200,180,160,0.1);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            background: rgba(255,255,255,0.02);
        }
        .inv-slot.has { border-color: rgba(200,180,160,0.25); background: rgba(200,180,160,0.06); }

        #scene-name {
            margin-left: auto;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(200,180,160,0.3);
        }

        #dialog {
            position: absolute;
            bottom: 55px; left: 15px; right: 15px;
            background: rgba(6,6,10,0.92);
            border: 1px solid rgba(200,180,160,0.08);
            border-radius: 5px;
            padding: 14px 16px;
            color: #d0c0b0;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            max-height: 140px;
            backdrop-filter: blur(4px);
        }
        #dialog .speaker {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.35;
            margin-bottom: 3px;
        }
        #dialog .choices { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        #dialog .choices button {
            background: rgba(200,180,160,0.06);
            border: 1px solid rgba(200,180,160,0.12);
            color: #c8b4a0;
            padding: 6px 14px;
            border-radius: 3px;
            font-size: 13px;
            font-family: 'Georgia', serif;
            cursor: pointer;
            transition: all 0.15s;
        }
        #dialog .choices button:hover { background: rgba(200,180,160,0.15); border-color: rgba(200,180,160,0.3); }

        /* Стартовий екран */
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6,6,10,1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            transition: opacity 0.8s;
        }
        #start-screen h1 {
            color: #c8b4a0;
            font-size: 2.4em;
            font-weight: normal;
            letter-spacing: 0.3em;
            margin-bottom: 6px;
        }
        #start-screen .sub {
            color: rgba(200,180,160,0.4);
            font-size: 0.9em;
            letter-spacing: 0.15em;
        }
        #start-screen .start-btn {
            margin-top: 30px;
            padding: 10px 36px;
            border: 1px solid rgba(200,180,160,0.2);
            border-radius: 4px;
            color: #c8b4a0;
            font-size: 1em;
            font-family: 'Georgia', serif;
            background: rgba(200,180,160,0.05);
            cursor: pointer;
            transition: all 0.3s;
        }
        #start-screen .start-btn:hover {
            background: rgba(200,180,160,0.12);
            border-color: rgba(200,180,160,0.4);
        }

        #end-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(6,6,10,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 40px;
            text-align: center;
        }
        #end-screen h2 { color: #c8b4a0; font-weight: normal; letter-spacing: 0.2em; margin-bottom: 16px; font-size: 1.4em; }
        #end-screen p { color: rgba(200,180,160,0.6); font-size: 0.9em; max-width: 500px; line-height: 1.6; }

        @media (max-width: 820px) {
            #game { width: 100vw; height: 100vh; border-radius: 0; }
            canvas { width: 100vw; height: calc(100vh - 50px); }
        }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>ОСТАННІЙ ПОТЯГ</h1>
    <div class="sub">— Last Train —</div>
    <div class="start-btn">🚂 Почати</div>
</div>

<div id="end-screen">
    <h2>🚂 КІНЕЦЬ</h2>
    <p id="end-text"></p>
</div>

<div id="game">
    <canvas id="c" width="800" height="550"></canvas>
    <div id="dialog">
        <div class="speaker" id="dSpeaker"></div>
        <div id="dText"></div>
        <div class="choices" id="dChoices"></div>
    </div>
    <div id="ui-bot">
        <div id="nav">
            <button id="btnPrev">◀</button>
            <button id="btnNext">▶</button>
        </div>
        <div id="inv"></div>
        <div id="scene-name">Купе 1</div>
    </div>
</div>

<script>
    // ============================================================
    // НАЛАШТУВАННЯ
    // ============================================================
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 550;

    const invDiv = document.getElementById('inv');
    const dialog = document.getElementById('dialog');
    const dSpeaker = document.getElementById('dSpeaker');
    const dText = document.getElementById('dText');
    const dChoices = document.getElementById('dChoices');
    const sceneName = document.getElementById('scene-name');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const startScreen = document.getElementById('start-screen');
    const endScreen = document.getElementById('end-screen');
    const endText = document.getElementById('end-text');

    // ============================================================
    // СТАН ГРИ
    // ============================================================
    const inventory = [];
    let dialogOpen = false;
    let currentAngle = 0; // 0=center, -1=left, 1=right
    let currentScene = 'car1';
    let gamePhase = 'start'; // start, exploring, ending
    let talkedToBusinessman = false;
    let talkedToConductor = false;
    let talkedToMystery = false;
    let foundTicket = false;
    let foundPhoto = false;
    let foundKey = false;
    let gaveTicket = false;
    let puzzleSolved = false;

    function addToInv(item) {
        if (!inventory.includes(item)) { inventory.push(item); renderInv(); }
    }
    function hasItem(item) { return inventory.includes(item); }

    // ============================================================
    // СЦЕНИ
    // ============================================================
    function drawCar1(angle) {
        // Стіни купе
        const colors = ['#2a2518', '#1e1a12', '#362e1e'];
        ctx.fillStyle = colors[1];
        ctx.fillRect(0, 0, W, H);

        // Панорама — зміщення
        const offset = angle * 100;

        // Ліва стіна
        ctx.fillStyle = '#2e281e';
        ctx.fillRect(0, 0, 260 + offset, H);

        // Права стіна
        ctx.fillStyle = '#2a241a';
        ctx.fillRect(540 + offset, 0, W, H);

        // Стеля
        ctx.fillStyle = '#1e1a14';
        ctx.fillRect(0, 0, W, 50);
        // Плафон
        ctx.fillStyle = '#ffddaa';
        ctx.globalAlpha = 0.15 + Math.sin(Date.now() / 800) * 0.03;
        ctx.fillRect(370, 0, 60, 10);
        ctx.globalAlpha = 1;

        // Підлога
        ctx.fillStyle = '#1a1610';
        ctx.fillRect(0, 430, W, 120);
        ctx.fillStyle = '#221c14';
        for (let x = 0; x < W; x += 60) {
            ctx.fillRect(x, 430, 58, 120);
            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, 430, 58, 120);
        }

        // Сидіння (ліворуч)
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(100, 300, 120, 100);
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(100, 300, 120, 20);
        ctx.fillStyle = '#2a1a10';
        ctx.fillRect(100, 320, 120, 80);

        // Сидіння (праворуч)
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(580, 300, 120, 100);
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(580, 300, 120, 20);
        ctx.fillStyle = '#2a1a10';
        ctx.fillRect(580, 320, 120, 80);

        // Столик біля вікна
        ctx.fillStyle = '#5a4030';
        ctx.fillRect(300, 280, 200, 8);
        ctx.fillStyle = '#4a3020';
        ctx.fillRect(310, 288, 6, 60);
        ctx.fillRect(490, 288, 6, 60);

        // Вікно (центр)
        ctx.fillStyle = '#0a1520';
        ctx.fillRect(330, 80, 140, 160);
        ctx.fillStyle = '#152035';
        ctx.fillRect(334, 84, 132, 152);
        // Місяць
        ctx.fillStyle = 'rgba(180,200,230,0.08)';
        ctx.beginPath();
        ctx.arc(380, 120, 25, 0, Math.PI * 2);
        ctx.fill();
        // Рамка вікна
        ctx.strokeStyle = '#4a3520';
        ctx.lineWidth = 4;
        ctx.strokeRect(330, 80, 140, 160);
        ctx.beginPath();
        ctx.moveTo(400, 80); ctx.lineTo(400, 240);
        ctx.moveTo(330, 160); ctx.lineTo(470, 160);
        ctx.stroke();
        // Штори
        ctx.fillStyle = 'rgba(80,40,30,0.3)';
        ctx.fillRect(330, 80, 12, 160);
        ctx.fillRect(458, 80, 12, 160);

        // Багажна полиця
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(60, 60, 680, 16);

        // Пальто
        ctx.fillStyle = '#2a2015';
        ctx.fillRect(150, 70, 30, 50);
        ctx.fillStyle = '#1a1510';
        ctx.fillRect(152, 120, 26, 20);

        // Картина на стіні
        ctx.fillStyle = '#2a1a0a';
        ctx.fillRect(600, 100, 80, 60);
        ctx.fillStyle = '#1a2535';
        ctx.fillRect(604, 104, 72, 52);

        // Чемодан (якщо ще не взяли квиток)
        if (!foundTicket) {
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(680, 370, 50, 40);
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(680, 370, 50, 8);
            ctx.strokeStyle = '#5a4a3a';
            ctx.lineWidth = 2;
            ctx.strokeRect(680, 370, 50, 40);
        }

        // Затемнення країв
        const vig = ctx.createRadialGradient(400, 250, 200, 400, 250, 450);
        vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);

        // Стрілки переходу
        const cars = Object.keys(scenes);
        const idx = cars.indexOf(currentScene);
        if (idx > 0) {
            ctx.fillStyle = 'rgba(200,180,160,0.08)';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('◀', 8, H/2);
        }
        if (idx < cars.length - 1) {
            ctx.fillStyle = 'rgba(200,180,160,0.08)';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('▶', W - 8, H/2);
        }
    }

    function drawCar2(angle) {
        ctx.fillStyle = '#1e1a14';
        ctx.fillRect(0, 0, W, H);

        const offset = angle * 80;

        // Стійка бару
        ctx.fillStyle = '#3a2a1a';
        ctx.fillRect(340 + offset, 180, 120, 250);

        // Стільниця
        ctx.fillStyle = '#4a3828';
        ctx.fillRect(330 + offset, 180, 140, 12);

        // Пляшки
        const bottleColors = ['#2a3a2a', '#3a2a2a', '#2a2a3a', '#4a3a2a'];
        for (let i = 0; i < 5; i++) {
            ctx.fillStyle = bottleColors[i % 4];
            ctx.fillRect(355 + i * 14 + offset, 150, 10, 30);
            ctx.fillStyle = 'rgba(200,180,140,0.05)';
            ctx.fillRect(357 + i * 14 + offset, 148, 6, 4);
        }

        // Столики
        for (let i = 0; i < 2; i++) {
            const tx = 80 + i * 400 + offset * 0.5;
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(tx, 320, 80, 6);
            ctx.fillStyle = '#2a1a10';
            ctx.fillRect(tx + 5, 326, 6, 50);
            ctx.fillRect(tx + 69, 326, 6, 50);
        }

        // Вікна
        for (let i = 0; i < 2; i++) {
            const wx = 120 + i * 380;
            ctx.fillStyle = '#0a1520';
            ctx.fillRect(wx, 100, 100, 120);
            ctx.fillStyle = '#152035';
            ctx.fillRect(wx + 3, 103, 94, 114);
            ctx.strokeStyle = '#3a2a1a';
            ctx.lineWidth = 3;
            ctx.strokeRect(wx, 100, 100, 120);
        }

        // Підлога
        ctx.fillStyle = '#1a1610';
        ctx.fillRect(0, 430, W, 120);
        ctx.fillStyle = '#221c14';
        for (let x = 0; x < W; x += 50) {
            ctx.fillRect(x, 430, 48, 120);
        }

        // Стеля
        ctx.fillStyle = '#1a1610';
        ctx.fillRect(0, 0, W, 40);
        ctx.fillStyle = '#ffddaa';
        ctx.globalAlpha = 0.1 + Math.sin(Date.now() / 700) * 0.02;
        ctx.fillRect(380, 0, 40, 8);
        ctx.globalAlpha = 1;

        const vig = ctx.createRadialGradient(400, 250, 200, 400, 250, 450);
        vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
    }

    function drawCar3(angle) {
        ctx.fillStyle = '#121018';
        ctx.fillRect(0, 0, W, H);

        const offset = angle * 120;

        // Вантажні ящики
        ctx.fillStyle = '#1e1a14';
        for (let i = 0; i < 3; i++) {
            const bx = 100 + i * 200 + offset * 0.3;
            const by = 300 - i * 30;
            ctx.fillRect(bx, by, 90 + i * 20, 70 + i * 10);
            ctx.strokeStyle = 'rgba(80,60,40,0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, 90 + i * 20, 70 + i * 10);
        }

        // Ланцюги
        ctx.strokeStyle = 'rgba(100,90,80,0.3)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(150 + i * 250, 60);
            ctx.lineTo(150 + i * 250, 150 + i * 20);
            ctx.stroke();
        }

        // Маленьке віконце
        ctx.fillStyle = '#0a1220';
        ctx.fillRect(30, 80, 60, 80);
        ctx.fillStyle = '#152035';
        ctx.fillRect(33, 83, 54, 74);
        ctx.strokeStyle = '#3a2a1a';
        ctx.lineWidth = 3;
        ctx.strokeRect(30, 80, 60, 80);

        // Підлога
        ctx.fillStyle = '#161218';
        ctx.fillRect(0, 430, W, 120);

        // Лампа
        ctx.fillStyle = '#ffddaa';
        ctx.globalAlpha = 0.08 + Math.sin(Date.now() / 600) * 0.02;
        ctx.fillRect(385, 0, 30, 10);
        ctx.globalAlpha = 1;

        const vig = ctx.createRadialGradient(400, 250, 150, 400, 250, 400);
        vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
    }

    // ============================================================
    // ХОТСПОТИ
    // ============================================================
    const scenes = {
        car1: {
            name: 'Купе 1',
            draw: (a) => drawCar1(a),
            hotspots: (angle) => [
                { id: 'suitcase', x: 680, y: 370, w: 50, h: 40, label: '🧳 Чемодан',
                  condition: () => !foundTicket && angle === 1,
                  action: () => { foundTicket = true; addToInv('🎫'); showText('🧳 Чемодан', 'Старий шкіряний чемодан. Він не твій. Але всередині — квиток. «Купе 3, місце 7. Сьогодні. 23:55.» Що за дивний час для потяга?'); } },
                { id: 'photo', x: 600, y: 100, w: 80, h: 60, label: '🖼 Фото',
                  condition: () => !foundPhoto && angle === 1,
                  action: () => { foundPhoto = true; addToInv('🖼'); showText('🖼 Фото', 'Родина. Мама, тато, дівчинка. На звороті: «2007, наш останній потяг до моря». У тебе стискається серце — ти впізнаєш цю дівчинку. Це ти?'); } },
                { id: 'note', x: 350, y: 280, w: 50, h: 20, label: '📜 Записка',
                  condition: () => angle === 0 && !talkedToBusinessman,
                  action: () => { showText('📜 Записка', '«Не вір провіднику. Він знає більше, ніж каже. — Підпис: Той, хто їхав до тебе.»'); } },
            ]
        },
        car2: {
            name: 'Вагон-ресторан',
            draw: (a) => drawCar2(a),
            hotspots: (angle) => [
                { id: 'menu', x: 340, y: 190, w: 120, h: 20, label: '📋 Меню',
                  condition: () => angle === 0,
                  action: () => { showText('📋 Меню', '«Страви дня: Чай з м\'ятою. Бутерброд з маслом. Запіканка. Кава — безкоштовно для всіх пасажирів. Особливе: компот із сухофруктів.» Все виглядає звичайно, але ціни — в рублях 2006 року.'); } },
                { id: 'key', x: 200, y: 150, w: 20, h: 20, label: '🔑 Ключ',
                  condition: () => !foundKey && angle === -1,
                  action: () => { foundKey = true; addToInv('🔑'); showText('🔑 Ключ', 'Малий латунний ключ. На бирці: «Купе 3, службове». Провідник недобачає.'); } },
            ]
        },
        car3: {
            name: 'Вантажний вагон',
            draw: (a) => drawCar3(a),
            hotspots: (angle) => [
                { id: 'box', x: 100, y: 300, w: 90, h: 70, label: '📦 Ящик',
                  condition: () => angle === -1 && hasItem('🔑'),
                  action: () => { if (hasItem('🔑')) { showText('📦 Ящик', 'Ящик зачинено. Ключ підходить. Всередині — старі листи. Вони адресовані тобі. «Не сходь на цьому потязі. Він возить тільки спогади. Твій батько знав.»'); } } },
                { id: 'shadow', x: 350, y: 250, w: 100, h: 150, label: '👤 Тінь',
                  condition: () => angle === 0 && foundTicket && !talkedToMystery,
                  action: () => { talkedToMystery = true; showDialog('👤 Тінь у кутку', 'З темряви виступає постать. Голос тихий, надтріснутий. «Ти нарешті прийшов. Я чекав тебе три роки. Цей потяг — не для живих. Він возить тих, хто не попрощався. Твоя родина... вони чекають на тебе в останньому купе.»', [
                      { text: 'Хто ти?', next: () => showText('👤 Тінь', '«Я — той, хто вів цей потяг до тебе. Я — твій батько. Я не встиг попрощатись 2007-го. Тепер у нас є час.»') },
                      { text: 'Я не розумію.', next: () => showText('👤 Тінь', '«Все зрозумієш. Знайди провідника. Він знає, як зупинити потяг. Але чи хочеш ти його зупиняти?»') },
                  ]); }
                },
            ]
        }
    };

    // ============================================================
    // РЕНДЕР
    // ============================================================
    function getAngleIndex() { return currentAngle + 1; } // -1,0,1 → 0,1,2

    let hoveredHotspot = null;
    let particles = [];

    function updateParticles() {
        if (Math.random() > 0.6) {
            particles.push({
                x: Math.random() * W, y: 50 + Math.random() * 50,
                vx: (Math.random() - 0.5) * 0.15,
                vy: 0.2 + Math.random() * 0.4,
                life: 150 + Math.random() * 150,
                size: 0.5 + Math.random() * 1.5
            });
        }
        particles = particles.filter(p => {
            p.x += p.vx; p.y += p.vy; p.life--;
            return p.life > 0 && p.y < 400;
        });
    }

    function render() {
        ctx.clearRect(0, 0, W, H);

        const scene = scenes[currentScene];
        if (scene) scene.draw(currentAngle);

        // Пилові частинки
        particles.forEach(p => {
            ctx.fillStyle = `rgba(200,190,180,${(p.life / 200) * 0.15})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });

        // Ховер
        if (hoveredHotspot && !dialogOpen) {
            const h = hoveredHotspot;
            ctx.strokeStyle = 'rgba(200,180,160,0.25)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.strokeRect(h.x, h.y, h.w, h.h);
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(6,6,10,0.75)';
            const tw = ctx.measureText(h.label).width + 16;
            ctx.fillRect(h.x + h.w/2 - tw/2, h.y - 24, tw, 18);
            ctx.fillStyle = '#c8b4a0';
            ctx.font = '11px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText(h.label, h.x + h.w/2, h.y - 11);
        }

        sceneName.textContent = scene ? scene.name : '';
    }

    function renderInv() {
        const slots = inventory.length;
        let html = '';
        for (let i = 0; i < Math.max(4, slots); i++) {
            html += '<div class="inv-slot' + (inventory[i] ? ' has' : '') + '">' + (inventory[i] || '') + '</div>';
        }
        invDiv.innerHTML = html;
    }

    // ============================================================
    // ДІАЛОГИ
    // ============================================================
    let dialogCallback = null;

    function showText(speaker, text) {
        dSpeaker.textContent = speaker;
        dText.textContent = text;
        dChoices.innerHTML = '';
        dialog.classList.add('show');
        dialogOpen = true;
        dialogCallback = null;
    }

    function showDialog(speaker, text, choices) {
        dSpeaker.textContent = speaker;
        dText.textContent = text;
        dChoices.innerHTML = '';
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.textContent = c.text;
            btn.addEventListener('click', () => {
                dialogOpen = false;
                dialog.classList.remove('show');
                if (c.next) c.next();
            });
            dChoices.appendChild(btn);
        });
        dialog.classList.add('show');
        dialogOpen = true;
    }

    function closeDialog() {
        dialog.classList.remove('show');
        dialogOpen = false;
        if (dialogCallback) { dialogCallback(); dialogCallback = null; }
    }

    // ============================================================
    // НАВІГАЦІЯ
    // ============================================================
    btnPrev.addEventListener('click', () => {
        if (dialogOpen) return;
        currentAngle = Math.max(-1, currentAngle - 1);
    });
    btnNext.addEventListener('click', () => {
        if (dialogOpen) return;
        currentAngle = Math.min(1, currentAngle + 1);
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' && !dialogOpen) currentAngle = Math.max(-1, currentAngle - 1);
        if (e.key === 'ArrowRight' && !dialogOpen) currentAngle = Math.min(1, currentAngle + 1);
        if (e.key === 'e' || e.key === 'E') { if (dialogOpen) closeDialog(); }
    });

    // ============================================================
    // КЛІКИ ТА МИША
    // ============================================================
    function getMouse(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('mousemove', e => {
        if (dialogOpen) { hoveredHotspot = null; canvas.style.cursor = 'default'; return; }
        const { x, y } = getMouse(e);
        const scene = scenes[currentScene];
        if (!scene) return;
        const hs = scene.hotspots(currentAngle);
        hoveredHotspot = null;
        for (const h of hs) {
            if (h.condition && !h.condition()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                hoveredHotspot = h; break;
            }
        }
        canvas.style.cursor = hoveredHotspot ? 'pointer' : 'default';
    });

    canvas.addEventListener('click', e => {
        if (dialogOpen) { closeDialog(); return; }
        const { x, y } = getMouse(e);
        const scene = scenes[currentScene];
        if (!scene) return;
        const hs = scene.hotspots(currentAngle);
        for (const h of hs) {
            if (h.condition && !h.condition()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                h.action(); return;
            }
        }
        // Перехід між вагонами
        if (x < 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx > 0) goToCar(cars[idx - 1]);
            return;
        }
        if (x > W - 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx < cars.length - 1) goToCar(cars[idx + 1]);
            return;
        }
    });

    // Touch
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const { x, y } = getMouse(touch);
        if (dialogOpen) { closeDialog(); return; }
        const scene = scenes[currentScene];
        if (!scene) return;
        const hs = scene.hotspots(currentAngle);
        for (const h of hs) {
            if (h.condition && !h.condition()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                h.action(); return;
            }
        }
    }, { passive: false });

    // Touch — перехід між вагонами + клік
    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        const touch = e.touches[0];
        const { x, y } = getMouse(touch);
        if (dialogOpen) { closeDialog(); return; }
        const scene = scenes[currentScene];
        if (!scene) return;
        const hs = scene.hotspots(currentAngle);
        for (const h of hs) {
            if (h.condition && !h.condition()) continue;
            if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
                h.action(); return;
            }
        }
        if (x < 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx > 0) goToCar(cars[idx - 1]);
            return;
        }
        if (x > W - 40) {
            const cars = Object.keys(scenes);
            const idx = cars.indexOf(currentScene);
            if (idx < cars.length - 1) goToCar(cars[idx + 1]);
            return;
        }
    }, { passive: false });

    // ============================================================
    // ПЕРЕХІД МІЖ ВАГОНАМИ
    // ============================================================
    function goToCar(car) {
        currentScene = car;
        currentAngle = 0;
        dialogOpen = false;
        dialog.classList.remove('show');
    }

    // Кнопки на canvas для переходу між вагонами
    // Лівий край → попередній вагон, правий → наступний

    // ============================================================
    // СТАРТ / КІНЕЦЬ
    // ============================================================
    startScreen.querySelector('.start-btn').addEventListener('click', () => {
        startScreen.style.opacity = '0';
        setTimeout(() => { startScreen.style.display = 'none'; }, 800);
        showText('🚂', 'Ти прокидаєшся в купе. За вікном — ніч. Потяг мчить, але ти не пам\'ятаєш, як сюди потрапив. Годинник показує 23:55. У кишені — клаптик паперу: «Знайди правду в трьох вагонах.»');
    });

    function showEnding(text) {
        endText.textContent = text;
        endScreen.style.display = 'flex';
    }

    // ============================================================
    // ЦИКЛ
    // ============================================================
    function loop() {
        updateParticles();
        render();
        requestAnimationFrame(loop);
    }
    renderInv();
    loop();

    console.log('✅ Останній потяг');
</script>
</body>
</html>
